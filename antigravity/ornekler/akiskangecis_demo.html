<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kertik - Akışkan Geçiş Prototipi</title>
<style>
:root{
  --bg:#F5F2EA; --bg2:#EFEBE1; --ink:#16181B; --ink2:#3E4148;
  --muted:#726E65; --faint:#9C978C; --line:#DCD5C6; --track:#DCD6C7;
  --accent:#B05237; --cool:#3E7C77; --warn:#8B6828; --ok:#4E7855; --danger:#9C3F33;
  --fill:#16181B; --onFill:#F5F2EA;
  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
}
:root.dark{
  --bg:#16171A; --bg2:#1D1E22; --ink:#EDE9E0; --ink2:#BCB7AC;
  --muted:#948F84; --faint:#6A665E; --line:#2C2D31; --track:#33343A;
  --accent:#D0785B; --cool:#79B3AE; --warn:#C39A55; --ok:#7FA886; --danger:#D08A7E;
  --fill:#EDE9E0; --onFill:#16171A;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit}

#app{
  max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding:20px 22px 30px;justify-content:space-between;
}

/* Karşılaştırma Banner */
.demo-banner{
  background:var(--bg2);border:1px solid var(--line);border-radius:18px;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.demo-banner .info{font-size:13px;color:var(--muted);line-height:1.35}
.demo-banner .info b{color:var(--ink);display:block;font-size:13.5px}
.toggle-chip{
  background:var(--track);border:0;border-radius:999px;padding:6px 14px;
  font-size:12px;font-weight:600;color:var(--ink2);transition:background .2s,color .2s;
}
.toggle-chip.active{background:var(--accent);color:#FFF}

/* Üst Mod Seçici */
.modes{display:flex;justify-content:center;margin-top:10px}
.modes .seg{
  display:flex;background:var(--track);border-radius:999px;padding:3px;position:relative;
}
.modes button{
  border:0;background:none;color:var(--muted);font-size:13.5px;font-weight:500;
  padding:8px 22px;border-radius:999px;position:relative;z-index:2;
  transition:color .35s var(--ease-soft);
}
.modes button.on{color:var(--onFill)}
.modes .knob{
  position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--fill);z-index:1;
  transition:left .4s var(--ease-spring), width .4s var(--ease-spring);
}

/* Merkez Kadran ve Sayaç */
.tcenter{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;width:100%;
}
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  font-weight:500;height:16px;margin-bottom:18px;
  transition:opacity .3s ease, transform .35s var(--ease-spring);
}

.dialwrap{
  position:relative;width:min(290px,80vw);aspect-ratio:1;display:grid;place-items:center;
}
.dialwrap svg{
  position:absolute;inset:0;width:100%;height:100%;overflow:visible;
}

/* Kadran Morfoloji Katmanları */
.dial-layer{
  transform-origin:155px 155px;
  transition:opacity .42s var(--ease-spring), transform .45s var(--ease-spring), filter .42s ease;
}
.dial-layer.hidden{
  opacity:0;pointer-events:none;
  transform:scale(0.92);
  filter:blur(2px);
}
.dial-layer.visible{
  opacity:1;pointer-events:auto;
  transform:scale(1);
  filter:blur(0px);
}

/* Eski Mod (Hard Cut) için animasyonsuz sınıf */
.no-anim .dial-layer{
  transition:none !important;
  transform:none !important;
  filter:none !important;
}

.dcenter{
  position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px;width:70%;
  transition:transform .35s var(--ease-spring);
}
#clock{
  font-size:clamp(38px,11vw,44px);font-weight:250;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);
  transition:opacity .25s ease, transform .35s var(--ease-spring);
}
#capt{
  font-size:12.5px;letter-spacing:.04em;color:var(--muted);min-height:16px;text-align:center;
  transition:opacity .25s ease, transform .35s var(--ease-spring);
}

#noteInput{
  margin-top:20px;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--ink);text-align:center;font-size:15px;padding:7px 4px;width:min(250px,68vw);
  font-family:inherit;outline:none;transition:border-color .3s;
}
#noteInput:focus{border-color:var(--accent)}

#subLine{
  margin-top:10px;font-size:13.5px;color:var(--muted);min-height:20px;text-align:center;
  transition:opacity .25s ease, transform .35s var(--ease-spring);
}
#subLine b{color:var(--ink2);font-weight:500}

/* Pomodoro Süre Hapları - Yaylı Akışkan Açılış */
.durs-wrapper{
  overflow:hidden;
  transition:max-height .45s var(--ease-spring), opacity .35s ease, transform .45s var(--ease-spring);
  width:100%;display:flex;justify-content:center;
}
.durs-wrapper.closed{
  max-height:0;opacity:0;transform:translateY(-8px) scale(0.96);pointer-events:none;
}
.durs-wrapper.open{
  max-height:70px;opacity:1;transform:translateY(0) scale(1);pointer-events:auto;
}

.no-anim .durs-wrapper{
  transition:none !important;
  transform:none !important;
}

.durs{display:flex;gap:8px;padding-top:16px;justify-content:center}
.durs button{
  border:1px solid var(--line);background:none;color:var(--muted);
  border-radius:999px;padding:8px 18px;font-size:13.5px;
  transition:border-color .25s, color .25s, transform .15s var(--ease-spring);
}
.durs button:active{transform:scale(0.95)}
.durs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}

/* Butonlar */
.controls{display:flex;gap:10px;margin-top:20px;justify-content:center;align-items:center}
.btn{
  border:1px solid var(--line);background:transparent;color:var(--ink2);
  padding:15px 36px;border-radius:999px;font-size:16.5px;font-weight:550;
  transition:transform .16s var(--ease-spring),background .3s,color .3s;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--fill);border-color:transparent;color:var(--onFill);padding:17px 52px}
</style>
</head>
<body>

<div id="app">
  <!-- Karşılaştırma Modu Butonu -->
  <div class="demo-banner">
    <div class="info">
      <b id="modeStatusTitle">✨ Akışkan Geçiş (Yeni)</b>
      <span id="modeStatusDesc">Kendi içine eriyen, nefes alan morfoloji</span>
    </div>
    <button class="toggle-chip active" id="btnToggleMode" onclick="toggleComparisonMode()">Eski Haline Al</button>
  </div>

  <!-- Segment Mod Seçici -->
  <div class="modes">
    <div class="seg" id="modeSeg">
      <div class="knob" id="knob"></div>
      <button id="btnStopwatch" data-m="stopwatch" onclick="changeMode('stopwatch')">Kronometre</button>
      <button id="btnPomodoro" data-m="pomodoro" class="on" onclick="changeMode('pomodoro')">Pomodoro</button>
    </div>
  </div>

  <!-- Merkez Sayaç Alanı -->
  <div class="tcenter">
    <div class="eyebrow" id="stateLabel">hazır</div>

    <div class="dialwrap" id="dialWrap">
      <svg id="dial" viewBox="0 0 310 310">
        <!-- İki Ayrı SVG Katmanı: Biri sönerken diğeri merkezden yumuşakça doğar -->
        <g id="layerStopwatch" class="dial-layer hidden"></g>
        <g id="layerPomodoro" class="dial-layer visible"></g>
      </svg>
      <div class="dcenter">
        <div id="clock">00:00</div>
        <div id="capt">25 dakika</div>
      </div>
    </div>

    <input id="noteInput" placeholder="ne çalışıyorsun?" maxlength="60" autocomplete="off">
    <div id="subLine">hazır olduğunda başlat</div>

    <!-- Yaylı Akordeon Süre Hapları -->
    <div class="durs-wrapper open" id="dursWrap">
      <div class="durs" id="durs">
        <button data-d="25" class="on" onclick="setPomoTarget(25)">25dk</button>
        <button data-d="50" onclick="setPomoTarget(50)">50dk</button>
        <button data-d="90" onclick="setPomoTarget(90)">90dk</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="bStart">Başlat</button>
    </div>
  </div>
</div>

<script>
let currentMode = "pomodoro";
let pomoTarget = 25;
let isFluidMode = true;

const NS = "http://www.w3.org/2000/svg";
const CX = 155, CY = 155, R0 = 114;

function mk(tag, a) {
  const e = document.createElementNS(NS, tag);
  for (const k in a) e.setAttribute(k, a[k]);
  return e;
}
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function notch(g, r, angDeg, h, col, w, op) {
  const a = angDeg * Math.PI / 180;
  g.appendChild(mk("line", {
    x1: (CX + (r - h / 2) * Math.cos(a)).toFixed(2), y1: (CY + (r - h / 2) * Math.sin(a)).toFixed(2),
    x2: (CX + (r + h / 2) * Math.cos(a)).toFixed(2), y2: (CY + (r + h / 2) * Math.sin(a)).toFixed(2),
    stroke: col, "stroke-width": w, "stroke-linecap": "round", opacity: op == null ? 1 : op
  }));
}

/* Kadranları Çiz */
function renderDials() {
  const cTrk = css("--track") || "#DCD6C7";
  
  // 1. Kronometre Boş Halka
  const gStop = document.getElementById("layerStopwatch");
  gStop.innerHTML = "";
  gStop.appendChild(mk("circle", { cx: CX, cy: CY, r: R0, fill: "none", stroke: cTrk, "stroke-width": 1.2 }));
  for (let i = 0; i < 60; i += 5) {
    notch(gStop, R0, i * 6 - 90, (i % 15 === 0) ? 11 : 7, cTrk, 1.4, 0.7);
  }

  // 2. Pomodoro Hedef Çentikleri
  const gPomo = document.getElementById("layerPomodoro");
  gPomo.innerHTML = "";
  const r = 118, n = pomoTarget;
  gPomo.appendChild(mk("circle", { cx: CX, cy: CY, r: r, fill: "none", stroke: cTrk, "stroke-width": 1.2 }));
  for (let i = 0; i < n; i++) {
    notch(gPomo, r, i * (360 / n) - 90, (i % 5 === 0) ? 11 : 7, cTrk, 1.4, 0.9);
  }
}

/* Mod Anahtarının Kayan Kapsülünü Konumlandır */
function updateKnob() {
  const onBtn = document.querySelector("#modeSeg button.on");
  const knob = document.getElementById("knob");
  if (onBtn && knob) {
    knob.style.left = onBtn.offsetLeft + "px";
    knob.style.width = onBtn.offsetWidth + "px";
  }
}

/* Metinleri Yumuşakça Değiştir */
function smoothTextChange(elementId, newText) {
  const el = document.getElementById(elementId);
  if (!el) return;
  if (!isFluidMode) {
    el.textContent = newText;
    return;
  }
  el.style.opacity = "0";
  el.style.transform = "translateY(3px) scale(0.98)";
  setTimeout(() => {
    el.textContent = newText;
    el.style.opacity = "1";
    el.style.transform = "translateY(0) scale(1)";
  }, 120);
}

/* Mod Değişimi */
function changeMode(mode) {
  if (currentMode === mode) return;
  currentMode = mode;

  // Segment butonları
  document.querySelectorAll("#modeSeg button").forEach(b => {
    b.classList.toggle("on", b.dataset.m === mode);
  });
  updateKnob();

  const layerStop = document.getElementById("layerStopwatch");
  const layerPomo = document.getElementById("layerPomodoro");
  const dursWrap = document.getElementById("dursWrap");

  if (mode === "pomodoro") {
    // Pomodoro'ya Geçiş
    layerStop.classList.remove("visible");
    layerStop.classList.add("hidden");

    layerPomo.classList.remove("hidden");
    layerPomo.classList.add("visible");

    dursWrap.classList.remove("closed");
    dursWrap.classList.add("open");

    smoothTextChange("capt", pomoTarget + " dakika");
  } else {
    // Kronometreye Geçiş
    layerPomo.classList.remove("visible");
    layerPomo.classList.add("hidden");

    layerStop.classList.remove("hidden");
    layerStop.classList.add("visible");

    dursWrap.classList.remove("open");
    dursWrap.classList.add("closed");

    smoothTextChange("capt", "");
  }
}

/* Pomodoro Süre Hedefi Seç */
function setPomoTarget(min) {
  pomoTarget = min;
  document.querySelectorAll("#durs button").forEach(b => {
    b.classList.toggle("on", Number(b.dataset.d) === min);
  });
  renderDials();
  smoothTextChange("capt", min + " dakika");
}

/* Karşılaştırma Modu Aç/Kapat */
function toggleComparisonMode() {
  isFluidMode = !isFluidMode;
  const app = document.getElementById("app");
  const chip = document.getElementById("btnToggleMode");
  const title = document.getElementById("modeStatusTitle");
  const desc = document.getElementById("modeStatusDesc");

  if (isFluidMode) {
    app.classList.remove("no-anim");
    chip.classList.add("active");
    chip.textContent = "Eski Haline Al";
    title.textContent = "✨ Akışkan Geçiş (Yeni)";
    desc.textContent = "Kendi içine eriyen, nefes alan morfoloji";
  } else {
    app.classList.add("no-anim");
    chip.classList.remove("active");
    chip.textContent = "Akışkan Yap";
    title.textContent = "⚡ Sert Kesilme (Mevcut Durum)";
    desc.textContent = "Ekran bir anda çat diye değişir";
  }
}

// Başlangıç Kurulumu
window.addEventListener("DOMContentLoaded", () => {
  renderDials();
  updateKnob();
});
</script>
</body>
</html>

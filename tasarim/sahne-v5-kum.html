<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kertik kum bahçesi laboratuvarı</title>
<style>
body{margin:0;padding:16px;font:13px system-ui;color:#3D434B;background:#EFEDE6}
.k{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.k.d{background:#101215;color:#B3B5B4;padding:14px;border-radius:6px}
figure{margin:0}figcaption{margin-top:6px}
</style>
<div class="k" id="a"></div><div class="k" id="b"></div><div class="k d" id="c"></div>
<script>
const TAM = Math.PI * 2, hs = (a, b, c) => { const h = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return h - Math.floor(h); };
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function vn(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hs(xi, yi, s), b = hs(xi + 1, yi, s), c = hs(xi, yi + 1, s), d = hs(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function bahce(sd) {
  const n = 1 + Math.floor(hs(1, 1, sd) * 3), tas = [];
  for (let i = 0; i < n; i++) { const a = hs(i, 2, sd) * TAM, r = i ? 28 + hs(i, 3, sd) * 40 : hs(i, 3, sd) * 14;
    tas.push({ x: Math.cos(a) * r * (i ? 1 : .6), y: Math.sin(a) * r * (i ? 1 : .6), r: i ? 9 + hs(i, 4, sd) * 9 : 16 + hs(i, 4, sd) * 10, ph: hs(i, 5, sd) * 6, e: .12 + hs(i, 6, sd) * .16, ac: hs(i, 7, sd) * TAM }); }
  return { sd, tas, lam: 9.5 + hs(2, 2, sd) * 4, dal: 1.2 + hs(3, 3, sd) * 2.2, dalF: .02 + hs(4, 4, sd) * .03 };
}
function cizKum(cv, B, p, ero, koyu) {
  const W = cv.width, H = cv.height, g = cv.getContext("2d"), s = W / 300, cx = W / 2, cy = H / 2, Rc = 143;
  const img = g.createImageData(W, H), D = img.data;
  const zemin = koyu ? [58, 56, 52] : [220, 215, 200], golge = koyu ? .5 : .3, isik = koyu ? .26 : .2;
  let dmax = 0;
  const dist = (x, y) => { let m = 1e9, k = 0; for (let i = 0; i < B.tas.length; i++) { const t = B.tas[i], dx = x - t.x, dy = y - t.y, an = Math.atan2(dy, dx), rr = t.r * (1 + t.e * Math.sin(an * 3 + t.ph) + .08 * Math.sin(an * 5 + t.ph * 2)), d = Math.hypot(dx, dy) - rr; if (d < m) { m = d; k = i; } } return [m, k]; };
  for (let a = 0; a < 360; a += 12) { const rr = Rc * (a % 24 ? .98 : .98), d = dist(Math.cos(a / 57.3) * rr, Math.sin(a / 57.3) * rr)[0]; if (d > dmax) dmax = d; }
  const Rp = p * (dmax + 6) + 2;
  for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
    const x = (px - cx) / s, y = (py - cy) / s, rc = Math.hypot(x, y); if (rc > Rc + 1) continue;
    const o = (py * W + px) * 4, [d0, k] = dist(x, y), t = B.tas[k];
    const w = B.dal * (vn(x * B.dalF * 2, y * B.dalF * 2, B.sd) - .5) * 2 + .6 * (vn(x * .11, y * .11, B.sd + 5) - .5);
    const d = d0 + w, u = d / B.lam, ph = TAM * u;
    const m = sm(Rp + 3, Rp - 5, d) * (1 - ero * sm(.25, .75, vn(x * .045 + 3, y * .045, B.sd + 9)) * .95 - ero * .05);
    const dx = x - t.x, dy = y - t.y, L = Math.hypot(dx, dy) || 1;
    /* oluk: keskin dip, yumuşak sırt */
    const prof = -Math.sin(ph) - .25 * Math.sin(2 * ph), egim = -Math.cos(ph) - .5 * Math.cos(2 * ph);
    const sh = (egim * (dx / L * -.7 + dy / L * -.7)) * m;
    const derin = Math.max(0, -prof) * m;
    let f = 1 + sh * isik * 1.5 - derin * golge * .18 + (prof * m) * .05;
    const gr = (hs(px, py, B.sd) - .5) * .06 + (hs(px >> 1, py >> 1, 3) - .5) * .03;
    f += gr;
    const kenar = sm(Rc + 1, Rc - 1.2, rc), toz = 1 - .1 * sm(Rc - 22, Rc, rc);
    D[o] = Math.min(255, zemin[0] * f * toz); D[o + 1] = Math.min(255, zemin[1] * f * toz); D[o + 2] = Math.min(255, zemin[2] * f * toz); D[o + 3] = 255 * kenar;
  }
  g.fillStyle = koyu ? "#101215" : "#EFEDE6"; g.fillRect(0, 0, W, H); g.putImageData(img, 0, 0);
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.strokeStyle = koyu ? "rgba(232,230,223,.28)" : "rgba(20,23,28,.4)"; g.lineWidth = .8; g.beginPath(); g.arc(0, 0, Rc + .4, 0, TAM); g.stroke();
  B.tas.forEach((t, i) => { const yol = () => { g.beginPath(); for (let a = 0; a <= 64; a++) { const an = a / 64 * TAM, rr = t.r * (1 + t.e * Math.sin(an * 3 + t.ph) + .08 * Math.sin(an * 5 + t.ph * 2)); const px = t.x + Math.cos(an) * rr, py = t.y + Math.sin(an) * rr * .92; a ? g.lineTo(px, py) : g.moveTo(px, py); } g.closePath(); };
    g.save(); g.shadowColor = "rgba(0,0,0," + (koyu ? .6 : .38) + ")"; g.shadowBlur = 9; g.shadowOffsetX = 5; g.shadowOffsetY = 6; g.fillStyle = "#34383D"; yol(); g.fill(); g.restore();
    const gr = g.createRadialGradient(t.x - t.r * .4, t.y - t.r * .45, t.r * .1, t.x, t.y, t.r * 1.15);
    gr.addColorStop(0, koyu ? "#8A8F94" : "#7E848A"); gr.addColorStop(.55, "#4B5056"); gr.addColorStop(1, "#23272B"); g.fillStyle = gr; yol(); g.fill();
    g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = .7; yol(); g.stroke();
    for (let q = 0; q < 14; q++) { g.fillStyle = "rgba(255,255,255," + (.04 + hs(q, i, B.sd) * .05) + ")"; g.beginPath(); g.arc(t.x + (hs(q, 1, i + B.sd) - .5) * t.r * 1.3, t.y + (hs(q, 2, i + B.sd) - .5) * t.r * 1.1, .8 + hs(q, 3, B.sd) * 1.6, 0, TAM); g.fill(); } });
  g.restore();
}
function ekle(kap, bas, B, p, ero, koyu) { const f = document.createElement("figure"), cv = document.createElement("canvas"); cv.width = 600; cv.height = 600; cv.style.width = "300px"; cv.style.height = "300px"; f.append(cv); const c = document.createElement("figcaption"); c.textContent = bas; f.append(c); kap.append(f); cizKum(cv, B, p, ero, koyu); }
[4, 19, 46, 77].forEach(sd => ekle(document.getElementById("a"), "pomodoro 14 / 25, tohum " + sd, bahce(sd), .56, 0, false));
ekle(document.getElementById("b"), "bitti, tohum 4", bahce(4), 1, 0, false);
ekle(document.getElementById("b"), "molada silinme, tohum 19", bahce(19), .56, .55, false);
ekle(document.getElementById("b"), "bitti, tohum 46", bahce(46), 1, 0, false);
ekle(document.getElementById("c"), "koyu tema, tohum 77", bahce(77), .7, 0, true);
ekle(document.getElementById("c"), "koyu tema, tohum 4", bahce(4), .4, 0, true);
</script>

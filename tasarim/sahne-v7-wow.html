<body>
<h1>KERTİK V7: 1) KRONOMETRE SONSUZ UFUK & ZAMAN YOLCULUĞU · 2) POMODORO ÇOKLU KRİSTAL · 3) GECE & KİNTSUGİ</h1>
<div class="grid" id="grid"></div>
<script>
const TAM = Math.PI * 2;
const cl = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smt = (a, b, x) => { const t = cl((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hs = (a, b, c) => { const x = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return x - Math.floor(x); };
function vn(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hs(xi, yi, s), b = hs(xi + 1, yi, s), c = hs(xi, yi + 1, s), d = hs(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// Sırtlı (ridged) ve akışkan fraktal gürültü
function fbm(x, y, s) {
  return 0.52 * vn(x, y, s) + 0.28 * vn(x * 2.07, y * 2.07, s + 11) + 0.14 * vn(x * 4.31, y * 4.31, s + 23) + 0.06 * vn(x * 8.7, y * 8.7, s + 37);
}
function ridge(x, s) {
  const n1 = 1 - Math.abs(2 * vn(x, 0.3, s) - 1);
  const n2 = 1 - Math.abs(2 * vn(x * 2.2, 1.7, s + 7) - 1);
  const n3 = vn(x * 4.8, 3.1, s + 19);
  return (n1 * 0.58 + n2 * 0.29 + n3 * 0.13);
}
const hexRgb = c => { const m = /^#([0-9a-f]{6})$/i.exec((c || "").trim()); return m ? [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)] : [128, 128, 128]; };
const rgba = (c, a) => { const m = hexRgb(c); return "rgba(" + m[0] + "," + m[1] + "," + m[2] + "," + cl(a, 0, 1).toFixed(3) + ")"; };

function palet(koyu) {
  return koyu ? {
    koyu: true,
    bg: "#11100E", bg2: "#191714",
    ink: "#EDE6D8", ink2: "#A8A093",
    acc: "#D96B78", gold: "#D6B060", goldLight: "#F3DFA2",
    cool: "#7A96AA", mist: "#11100E"
  } : {
    koyu: false,
    bg: "#F6F2E8", bg2: "#EAE3D3",
    ink: "#1C1916", ink2: "#5E5549",
    acc: "#8A1F2D", gold: "#B28B3E", goldLight: "#DAB96B",
    cool: "#52697A", mist: "#F6F2E8"
  };
}

function kagitCiz(g, W, H, p) {
  g.fillStyle = p.bg;
  g.fillRect(0, 0, W, H);
  // Sıcak fildişi / gece kadifesi atmosferik ışık
  const gr = g.createRadialGradient(W * 0.5, H * 0.30, 20, W * 0.5, H * 0.45, Math.max(W, H) * 0.78);
  gr.addColorStop(0, p.koyu ? "rgba(214,176,96,0.045)" : "rgba(255,253,247,0.75)");
  gr.addColorStop(0.55, "rgba(0,0,0,0)");
  gr.addColorStop(1, p.koyu ? "rgba(0,0,0,0.48)" : "rgba(65,50,32,0.08)");
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);

  // Çok zarif, göz yormayan mikro parşömen greni
  g.fillStyle = p.koyu ? "rgba(255,245,225,0.014)" : "rgba(40,30,20,0.015)";
  for (let i = 0; i < 1200; i++) {
    g.fillRect(hs(i, 1, 3) * W, hs(i, 2, 3) * H, 0.9, 0.9);
  }
}

/* ============================================================================
   KRONOMETRE: SONSUZ UFUK, ALTIN SIRTLAR, NEHİR YANSIMASI VE GÖK USTURLABI
   - Üst yarı (cy = 265 çevresi): Gökyüzü Kutsal Alanı. Sayaç burada dairesel
     Altın Usturlap & Harmonik Hale içinde tertemiz okunur; her saat yeni bir
     yörünge halkası ve yıldız düğümü ekler.
   - Orta-Alt yarı (y = 370..640): Paralaksla akan 5 katmanlı İpek-Sumi dağ
     silsilesi, altın sırt aydınlatması (gold rim-light), su yansıması ve
     her 15 dakikada dikilen zarif Kertik fenerleri/anıtları.
   - Alt kısım (y = 630..820): Yumuşak vadi sisiyle butonlara pürüzsüz zemin.
   - İleri-geri kaydırıldığında (pan) üstte zarif Zaman Merceği belirir.
   ============================================================================ */
function kronometreUfukCiz(g, W, H, cx, cy, R, p, v, sd, panPx, surukleniyor) {
  const dk = v.bos ? 0 : v.dk;
  const ero = v.ero || 0;
  const SP = 6.5; // dakika başına piksel akışı
  const toplamX = dk * SP;
  const gorunenX = Math.max(0, toplamX - W * 0.45) + panPx;
  const bakilanDk = cl((gorunenX + W * 0.45) / SP, 0, Math.max(0.1, dk));
  const molaMi = dkx => v.molas && v.molas.some(([a, b]) => dkx >= a && dkx < b);

  // 1. GÖKYÜZÜ KUTSAL ALANI & ALTIN USTURLAP HALESİ (cx, cy çevresi)
  g.save();
  g.translate(cx, cy);

  const rAst = R * 0.92;
  // Dış ince altın usturlap çemberi ve derece kertikleri
  g.strokeStyle = rgba(p.gold, p.koyu ? 0.32 : 0.38);
  g.lineWidth = 0.8;
  g.beginPath(); g.arc(0, 0, rAst, 0, TAM); g.stroke();

  g.strokeStyle = rgba(p.ink, p.koyu ? 0.12 : 0.10);
  g.lineWidth = 0.5;
  g.beginPath(); g.arc(0, 0, rAst + 11, 0, TAM); g.stroke();

  // 60 dakika kılcal kertikleri + o anki dakikanın altın yay izi
  const aktifYay = ((dk % 60) / 60) * TAM;
  if (!v.bos) {
    g.strokeStyle = rgba(v.onBreak ? p.cool : p.acc, p.koyu ? 0.65 : 0.58);
    g.lineWidth = 1.6;
    g.beginPath(); g.arc(0, 0, rAst, -Math.PI / 2, -Math.PI / 2 + aktifYay); g.stroke();
  }

  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * TAM - Math.PI / 2;
    const maj = i % 5 === 0;
    const r1 = rAst - (maj ? 6.5 : 3.5), r2 = rAst + (maj ? 3.5 : 1.5);
    g.strokeStyle = maj ? rgba(p.gold, 0.62) : rgba(p.ink, 0.18);
    g.lineWidth = maj ? 0.95 : 0.5;
    g.beginPath();
    g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    g.stroke();
  }

  // Kadranın etrafında nefes alan ince harmonik ipek teller (sayacın içine girmez, rAst..rAst+24 kuşağında)
  const lob = 5 + Math.floor(hs(1, 1, sd) * 4);
  const katmanSayisi = Math.min(18, 4 + Math.floor(dk / 6));
  for (let k = 0; k < katmanSayisi; k++) {
    const faz = k * 0.24 + gorunenX * 0.002;
    g.strokeStyle = k % 3 === 0 ? rgba(p.gold, p.koyu ? 0.26 : 0.28) : rgba(p.ink, p.koyu ? 0.11 : 0.09);
    g.lineWidth = 0.55;
    g.beginPath();
    for (let s = 0; s <= 160; s++) {
      const t = (s / 160) * TAM;
      const rr = rAst + 7 + 11 * (0.5 + 0.5 * Math.sin(lob * t + faz) * Math.cos(2 * t - faz * 0.7));
      const x = Math.cos(t) * rr, y = Math.sin(t) * rr;
      s ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }

  // Tamamlanan her saat için dış yörüngede parlayan Altın Takımyıldız Düğümü
  const tamSaat = Math.floor(dk / 60);
  for (let st = 1; st <= tamSaat; st++) {
    const sa = -Math.PI / 2 + (st * 0.52);
    const sx = Math.cos(sa) * (rAst + 11), sy = Math.sin(sa) * (rAst + 11);
    g.fillStyle = p.goldLight;
    g.beginPath(); g.arc(sx, sy, 3.2, 0, TAM); g.fill();
    g.strokeStyle = rgba(p.gold, 0.45);
    g.lineWidth = 0.8;
    g.beginPath(); g.arc(sx, sy, 6.5, 0, TAM); g.stroke();
  }

  // Canlı yörünge iğnesi (dakika ucu)
  if (!v.bos) {
    const ua = -Math.PI / 2 + aktifYay;
    const ux = Math.cos(ua) * rAst, uy = Math.sin(ua) * rAst;
    g.fillStyle = v.onBreak ? p.cool : p.acc;
    g.beginPath(); g.arc(ux, uy, 3.8, 0, TAM); g.fill();
    g.strokeStyle = p.goldLight;
    g.lineWidth = 1.1;
    g.beginPath(); g.arc(ux, uy, 6.2, 0, TAM); g.stroke();
  }
  g.restore();

  // 2. UFUK & PARALAKS MÜREKKEP-ALTIN DAĞ SİLSİLESİ (y: 382..575)
  // Sayacın alt sınırına (cy + R ~ 370) asla değmez; tam altında sinematik bir ufuk açar!
  const ufukY = 548;
  const katmanlar = [
    { base: 422, amp: 38, fr: 0.0038, spd: 0.18, op: 0.14, rim: 0.25, renk: p.ink },
    { base: 452, amp: 46, fr: 0.0052, spd: 0.35, op: 0.24, rim: 0.42, renk: p.ink },
    { base: 484, amp: 52, fr: 0.0068, spd: 0.60, op: 0.38, rim: 0.65, renk: p.acc },
    { base: 518, amp: 44, fr: 0.0090, spd: 1.00, op: 0.58, rim: 0.88, renk: p.ink }
  ];

  katmanlar.forEach((L, idx) => {
    const off = gorunenX * L.spd + hs(idx, 4, sd) * 500;
    const yFn = x => {
      const rx = (x + off) * L.fr;
      const rVal = ridge(rx, sd + idx * 13);
      // Kadranın tam alt hizasında hafif bir vadi kavislenmesi (merkezde ferahlık)
      const vadi = 1 - 0.18 * Math.exp(-Math.pow((x - cx) / 130, 2));
      return L.base - rVal * L.amp * vadi;
    };

    // Dağ gövdesi (yukarıdan aşağıya ipeksi mürekkep/sis geçişi)
    g.beginPath();
    g.moveTo(0, ufukY);
    for (let x = 0; x <= W; x += 3) g.lineTo(x, yFn(x));
    g.lineTo(W, ufukY);
    g.closePath();

    const dGrad = g.createLinearGradient(0, L.base - L.amp, 0, ufukY);
    const ustRenk = idx === 2 ? p.acc : p.ink;
    dGrad.addColorStop(0, rgba(ustRenk, L.op * (p.koyu ? 0.85 : 0.78)));
    dGrad.addColorStop(0.65, rgba(p.ink, L.op * 0.35));
    dGrad.addColorStop(1, rgba(p.bg, 0.0));
    g.fillStyle = dGrad;
    g.fill();

    // Sırt çizgisi: Sumi mürekkep konturu + Altın Yaldız (Gold Rim-Light) sırt parıltısı!
    g.strokeStyle = rgba(p.ink, L.op * 0.85);
    g.lineWidth = 0.8 + idx * 0.25;
    g.beginPath();
    for (let x = 0; x <= W; x += 3) x ? g.lineTo(x, yFn(x)) : g.moveTo(x, yFn(x));
    g.stroke();

    // Yükselen yamaçlarda altın varak aydınlanması (ışık soldan/üstten vuruyor)
    g.strokeStyle = rgba(p.goldLight, L.rim * (p.koyu ? 0.65 : 0.72));
    g.lineWidth = 0.75 + idx * 0.15;
    g.beginPath();
    let ciziliyor = false;
    for (let x = 3; x <= W; x += 3) {
      const y0 = yFn(x - 3), y1 = yFn(x);
      if (y1 < y0 - 0.15) { // yukarı çıkan yamaç = altın ışık alır
        if (!ciziliyor) { g.moveTo(x - 3, y0 - 0.6); ciziliyor = true; }
        g.lineTo(x, y1 - 0.6);
      } else {
        ciziliyor = false;
      }
    }
    g.stroke();

    // Katmanlar arası nefes alan vadi sisi
    const sisGrad = g.createLinearGradient(0, L.base - 8, 0, L.base + 38);
    sisGrad.addColorStop(0, rgba(p.bg, 0));
    sisGrad.addColorStop(0.5, rgba(p.bg, (0.32 + ero * 0.28)));
    sisGrad.addColorStop(1, rgba(p.bg, 0));
    g.fillStyle = sisGrad;
    g.fillRect(0, L.base - 8, W, 46);
  });

  // 3. ZAMAN NEHRİ, YANSIMA VE ALTIN KIYI İZİ (y: 535..615)
  // Ufuk çizgisinin altında durgun su aynası ve zamanla akan altın-bordo akıntı telleri
  const suUst = 532, suAlt = 615;
  // Su yüzeyinde ince yatay altın/mürekkep yansıma hareleri
  for (let i = 0; i < 28; i++) {
    const u = i / 28;
    const y = lerp(suUst, suAlt, u);
    const dalga = Math.sin(u * 18 + gorunenX * 0.03) * 14;
    const gen = (1 - u * 0.6) * W * 0.36;
    const xMerkez = cx + dalga + Math.sin(i * 1.7 + sd) * 45;
    g.strokeStyle = i % 4 === 0 ? rgba(p.gold, (1 - u) * 0.38) : rgba(p.ink, (1 - u) * 0.14);
    g.lineWidth = 0.6 + (1 - u) * 0.6;
    g.beginPath();
    g.moveTo(xMerkez - gen * 0.5, y);
    g.lineTo(xMerkez + gen * 0.5, y);
    g.stroke();
  }

  // Kıyı Patikası ve Zaman Anıtları (Her dakika gerçek konumunda, sürükledikçe geçmişe gidilir!)
  const X0 = W * 0.18 - gorunenX;
  const yKiyi = xw => 544 + 7 * Math.sin(xw * 0.012 + sd) + 3.5 * Math.cos(xw * 0.027);

  // Çalışılan sürenin altın-bordo nehir kıyısı izi
  g.lineCap = "round";
  for (let xw = 0; xw < toplamX; xw += 4) {
    const xa = X0 + xw, xb = X0 + xw + 4;
    if (xb < -10 || xa > W + 10) continue;
    const dkx = xw / SP;
    const mo = molaMi(dkx);
    const ya = yKiyi(xw), yb = yKiyi(xw + 4);

    if (mo) {
      // Mola aralığı: kesikli soğuk arduvaz iz ve suya düşen yağmur halkası
      if (Math.floor(xw / 8) % 2 === 0) {
        g.strokeStyle = rgba(p.cool, 0.72);
        g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(xa, ya); g.lineTo(xb, yb); g.stroke();
      }
      if (Math.floor(xw) % 36 === 0) {
        g.strokeStyle = rgba(p.cool, 0.28);
        g.lineWidth = 0.7;
        g.beginPath(); g.ellipse(xa, ya + 12, 11, 3.2, 0, 0, TAM); g.stroke();
      }
    } else {
      // Kesintisiz çalışma: üstte parlak altın tel, altta koyu mürekkep kıyı
      g.strokeStyle = rgba(p.ink, 0.78);
      g.lineWidth = 2.2;
      g.beginPath(); g.moveTo(xa, ya); g.lineTo(xb, yb); g.stroke();

      g.strokeStyle = rgba(p.goldLight, 0.85);
      g.lineWidth = 0.95;
      g.beginPath(); g.moveTo(xa, ya - 1.2); g.lineTo(xb, yb - 1.2); g.stroke();
    }
  }

  // Her 15 dakikada bir kıyıya dikilen zarif taş/altın kule (Cairn) ve her 60 dakikada bir Altın Fener Anıtı
  for (let m = 15; m <= dk; m += 15) {
    const xw = m * SP;
    const x = X0 + xw, y = yKiyi(xw);
    if (x < -20 || x > W + 20) continue;
    const saatBasi = (m % 60 === 0);

    if (saatBasi) {
      // Saat Başı Anıtı (Zarif Torii / Altın Dikilitaş + Suda Yansıması)
      g.strokeStyle = rgba(p.goldLight, 0.92);
      g.fillStyle = p.acc;
      g.lineWidth = 1.3;
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x, y - 22);
      g.stroke();
      // Elmas tepe mührü
      g.beginPath();
      g.moveTo(x, y - 28); g.lineTo(x + 4.5, y - 22); g.lineTo(x, y - 16); g.lineTo(x - 4.5, y - 22);
      g.closePath();
      g.fill(); g.stroke();
      // Suda altın yansıması
      g.strokeStyle = rgba(p.gold, 0.35);
      g.lineWidth = 1;
      for (let r = 1; r <= 3; r++) {
        g.beginPath(); g.moveTo(x - 5 + r, y + 4 * r); g.lineTo(x + 5 - r, y + 4 * r); g.stroke();
      }
    } else {
      // 15 dk çentik taşı
      g.fillStyle = rgba(p.ink, 0.82);
      [[0, -1, 4.2, 1.8], [0.2, -4.2, 3.0, 1.4], [-0.1, -6.8, 1.8, 1.1]].forEach(([dx, dy, rx, ry]) => {
        g.beginPath(); g.ellipse(x + dx, y + dy, rx, ry, 0, 0, TAM); g.fill();
      });
    }
  }

  // Şimdi (Canlı Uç): Kıyıda parlayan sıcak altın-bordo fener
  const simdiX = X0 + toplamX, simdiY = yKiyi(toplamX);
  if (simdiX >= -20 && simdiX <= W + 20) {
    const halkaR = g.createRadialGradient(simdiX, simdiY - 2, 1, simdiX, simdiY - 2, 16);
    halkaR.addColorStop(0, rgba(v.onBreak ? p.cool : p.goldLight, 0.55));
    halkaR.addColorStop(1, rgba(p.bg, 0));
    g.fillStyle = halkaR;
    g.beginPath(); g.arc(simdiX, simdiY - 2, 16, 0, TAM); g.fill();

    g.fillStyle = p.bg;
    g.beginPath(); g.arc(simdiX, simdiY - 2, 5.2, 0, TAM); g.fill();
    g.fillStyle = v.onBreak ? p.cool : p.acc;
    g.beginPath(); g.arc(simdiX, simdiY - 2, 3.4, 0, TAM); g.fill();
  }

  // Eğer kullanıcı geçmişe doğru sürüklediyse (Time Scrubbing aktifse), üstte zarif Zaman Merceği göster!
  if (surukleniyor || Math.abs(panPx) > 8) {
    const bSaat = Math.floor(bakilanDk / 60);
    const bDk = Math.floor(bakilanDk % 60);
    const molaDurum = molaMi(bakilanDk) ? " · mola" : " · çalışma";
    const etiket = (bSaat > 0 ? bSaat + " sa " : "") + bDk + ". dakika" + molaDurum;

    g.save();
    const pillW = 168, pillH = 26, px = cx - pillW / 2, py = 392;
    g.fillStyle = rgba(p.bg, 0.92);
    g.strokeStyle = rgba(p.gold, 0.65);
    g.lineWidth = 1;
    g.beginPath();
    g.roundRect(px, py, pillW, pillH, 13);
    g.fill(); g.stroke();

    g.fillStyle = p.ink;
    g.font = "600 11.5px -apple-system, BlinkMacSystemFont, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText("◄  " + etiket + "  ►", cx, py + pillH / 2);
    g.restore();
  }
}

/* ============================================================================
   POMODORO: İPEKSİ KRİSTAL ODAK ROZETİ + ÇOKLU POMODORO TAKIMYILDIZI (CROWN)
   - Tek bir Pomodoro sonludur (0 -> 1): Sayacın etrafında (rIn..rOut) yüzlerce
     kılcal altın, bordo ve sumi kostik/harmonik tel katman katman örülerek
     üç boyutlu, nefes alan bir Kristal Lotus / Usturlap Mücevheri oluşturur.
   - Molada (ero > 0) bu kristal yapı çatlar ve Kintsugi altın damarıyla onarılır!
   - Birden Fazla Pomodoro: Bugün tamamlanan her Pomodoro, kadranın üst
     yörüngesinde (Taç / Takımyıldız kuşağında) kendi benzersiz tohum mührüyle
     dizilir! Kullanıcı kaçıncı Pomodoro'da olduğunu ve önceki Pomodorolarının
     kusursuz mu yoksa Kintsugi onarımlı mı olduğunu tek bakışta görür!
   ============================================================================ */
function pomodoroKristalCiz(g, W, H, cx, cy, R, p, v, sd) {
  const f = v.bos ? 0 : cl(v.f, 0, 1);
  const ero = v.ero || 0;
  const rIn = R * 0.80;
  const rOut = R * 1.36;

  // 1. ÜST TAÇ / ÇOKLU POMODORO TAKIMYILDIZI (Bugünün tamamlanan ve aktif Pomodoroları)
  // Kullanıcının o gün yaptığı her Pomodoro bir mücevher mühür olarak üst kavis boyunca dizilir
  const gecmisPomolar = v.gecmisPomolar || [
    { sd: 14, dk: 25, kirik: false },
    { sd: 29, dk: 25, kirik: true },
    { sd: 53, dk: 25, kirik: false }
  ];
  const toplamYuva = Math.max(4, gecmisPomolar.length + 1);
  const taY = 152; //状态 yazısının ve kadranın üst kavisinde zarif takımyıldız dizisi
  const aralik = 46;
  const basX = cx - ((toplamYuva - 1) * aralik) / 2;

  // İnce altın takımyıldız bağ çizgisi
  g.strokeStyle = rgba(p.gold, 0.28);
  g.lineWidth = 0.75;
  g.beginPath();
  for (let i = 0; i < toplamYuva; i++) {
    const mx = basX + i * aralik;
    const my = taY + Math.abs(i - (toplamYuva - 1) / 2) * 5;
    i ? g.lineTo(mx, my) : g.moveTo(mx, my);
  }
  g.stroke();

  for (let i = 0; i < toplamYuva; i++) {
    const mx = basX + i * aralik;
    const my = taY + Math.abs(i - (toplamYuva - 1) / 2) * 5;
    const mr = 13.5;

    if (i < gecmisPomolar.length) {
      // Tamamlanmış Pomodoro Mührü (kendi tohumuyla çizilmiş minyatür mücevher rozet!)
      const gp = gecmisPomolar[i];
      g.save();
      g.translate(mx, my);

      // Dış altın halka
      g.fillStyle = rgba(p.acc, p.koyu ? 0.22 : 0.12);
      g.strokeStyle = p.gold;
      g.lineWidth = 1.2;
      g.beginPath(); g.arc(0, 0, mr, 0, TAM); g.fill(); g.stroke();

      // Minyatür harmonik rozet (o Pomodoro'nun kendi parmak izi)
      const pLob = 4 + (gp.sd % 5);
      g.strokeStyle = rgba(p.goldLight, 0.85);
      g.lineWidth = 0.65;
      g.beginPath();
      for (let s = 0; s <= 72; s++) {
        const a = (s / 72) * TAM;
        const rr = mr * (0.42 + 0.42 * Math.cos(pLob * a));
        s ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.stroke();

      // Eğer o Pomodoro'da uzun mola verilip çatladıysa üzerinde altın Kintsugi izi vardır
      if (gp.kirik) {
        g.strokeStyle = p.goldLight;
        g.lineWidth = 1.3;
        g.beginPath();
        g.moveTo(-mr * 0.7, -mr * 0.6);
        g.lineTo(-1, 1);
        g.lineTo(mr * 0.75, mr * 0.55);
        g.stroke();
      } else {
        // Kusursuz tamamlanan Pomodoro'nun merkez yakutu
        g.fillStyle = p.acc;
        g.beginPath(); g.arc(0, 0, 2.4, 0, TAM); g.fill();
      }
      g.restore();
    } else if (i === gecmisPomolar.length) {
      // Şu an aktif olan Pomodoro yuvası (canlı nefes alan halka)
      g.save();
      g.translate(mx, my);
      g.strokeStyle = rgba(p.acc, 0.85);
      g.lineWidth = 1.4;
      g.setLineDash([2.5, 2.5]);
      g.beginPath(); g.arc(0, 0, mr, 0, TAM); g.stroke();
      g.setLineDash([]);
      g.fillStyle = p.acc;
      g.beginPath(); g.arc(0, 0, 3.2, 0, TAM); g.fill();
      g.restore();
    } else {
      // Gelecek boş Pomodoro yuvası
      g.strokeStyle = rgba(p.ink, 0.18);
      g.lineWidth = 0.8;
      g.beginPath(); g.arc(mx, my, mr * 0.75, 0, TAM); g.stroke();
    }
  }

  // 2. ANA SAHNE: İPEKSİ KRİSTAL LOTUS & HARMONİK KOSTİK ROZET (cx, cy çevresi)
  g.save();
  g.translate(cx, cy);

  // İç kutsal sınır (sayaç rakamlarını koruyan çift altın-mürekkep halka)
  g.strokeStyle = rgba(p.gold, p.koyu ? 0.42 : 0.48);
  g.lineWidth = 0.9;
  g.beginPath(); g.arc(0, 0, rIn, 0, TAM); g.stroke();

  g.strokeStyle = rgba(p.ink, p.koyu ? 0.16 : 0.14);
  g.lineWidth = 0.5;
  g.beginPath(); g.arc(0, 0, rIn - 5, 0, TAM); g.stroke();

  // Tohumdan gelen kristal simetri parametreleri (her Pomodoro bambaşka bir çiçek/mücevher)
  const yaprakSayisi = [6, 8, 9, 10, 12][Math.floor(hs(1, 1, sd) * 5)];
  const icBukum = 2 + Math.floor(hs(2, 1, sd) * 4);
  const keskinlik = 0.32 + hs(3, 1, sd) * 0.28;

  // Toplam 60 ipeksi kostik katman (f ilerledikçe hem açısal olarak hem katman derinliği olarak açılır)
  const maksKatman = 56;
  const acikKatman = Math.max(2, Math.floor(f * maksKatman));
  const maksAci = f * TAM;

  for (let k = 0; k < acikKatman; k++) {
    const u = k / maksKatman; // 0 (iç) -> 1 (dış)
    const rTaban = lerp(rIn + 4, rOut - 12, u);
    const genlik = (rOut - rIn) * (0.14 + 0.24 * Math.sin(u * Math.PI));
    const faz = u * Math.PI * 1.65 + (sd % 7);

    // Renk geçişi: içte derin bordo, ortada sumi mürekkebi, dış taç uçlarında varak altın!
    let renk = p.ink, alfa = p.koyu ? 0.24 : 0.20, kal = 0.6;
    if (k % 5 === 0) {
      renk = p.goldLight;
      alfa = p.koyu ? 0.55 : 0.52;
      kal = 0.75;
    } else if (u < 0.42) {
      renk = p.acc;
      alfa = p.koyu ? 0.36 : 0.30;
    } else if (u > 0.78) {
      renk = p.gold;
      alfa = p.koyu ? 0.44 : 0.40;
    }

    // Erozyon (uzun mola) varsa dış katmanlar soğur ve soluklaşır
    if (ero > 0 && u > (1 - ero * 0.6)) {
      renk = p.cool;
      alfa *= 0.65;
    }

    g.strokeStyle = rgba(renk, alfa);
    g.lineWidth = kal;
    g.beginPath();

    const adimlar = 240;
    const sonAdim = Math.max(3, Math.floor(adimlar * cl(f * 1.05 - u * 0.15, 0.05, 1)));
    for (let s = 0; s <= sonAdim; s++) {
      const a = (s / adimlar) * TAM - Math.PI / 2;
      // Kristal lotus kostik zarf denklemi
      const w1 = Math.cos(yaprakSayisi * (a + Math.PI / 2) + faz * 0.35);
      const w2 = Math.sin(icBukum * (a + Math.PI / 2) - faz);
      const Zar = Math.pow(Math.abs(w1), keskinlik) * Math.sign(w1) * 0.68 + w2 * 0.32;
      const r = Math.max(rIn + 1.5, rTaban + genlik * Zar);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      s ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }

  // Taç uçlarındaki altın çiğ damlaları (her yaprak tepesinde parlayan mücevher düğümü)
  if (f > 0.15) {
    for (let pIdx = 0; pIdx < yaprakSayisi; pIdx++) {
      const pOran = pIdx / yaprakSayisi;
      if (pOran > f) break;
      const a = pOran * TAM - Math.PI / 2;
      const r = rOut - 4;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;

      g.fillStyle = p.goldLight;
      g.beginPath(); g.arc(px, py, 2.2, 0, TAM); g.fill();
      g.strokeStyle = rgba(p.gold, 0.45);
      g.lineWidth = 0.7;
      g.beginPath(); g.arc(px, py, 5.0, 0, TAM); g.stroke();
    }
  }

  // Molada Bozulma: Kintsugi Altın Onarım Damarları (Pomodoro sırasında mola verildiyse)
  if (ero > 0.02 || (v.molas && v.molas.length > 0)) {
    const molaList = v.molas && v.molas.length ? v.molas : [[12, 20]];
    molaList.forEach(([mBas], idx) => {
      const u = cl(mBas / 25, 0.08, Math.max(0.1, f));
      const ca = u * TAM - Math.PI / 2;
      const nx = -Math.cos(ca), ny = -Math.sin(ca);
      const tx = -ny, ty = nx;
      const x0 = Math.cos(ca) * (rOut + 4), y0 = Math.sin(ca) * (rOut + 4);
      const boy = (rOut - rIn) + 8;

      const pts = [[x0, y0]];
      let s = 0;
      for (let j = 1; j <= 8; j++) {
        const d = (j / 8) * boy;
        s += (hs(idx, j, sd + 31) - 0.5) * 11;
        pts.push([x0 + nx * d + tx * s, y0 + ny * d + ty * s]);
      }

      // Kırık gölgesi
      g.strokeStyle = "rgba(0,0,0,0.5)";
      g.lineWidth = 2.8;
      g.beginPath();
      pts.forEach(([x, y], i) => i ? g.lineTo(x + 1, y + 1) : g.moveTo(x + 1, y + 1));
      g.stroke();

      // Parlak Kintsugi altın damarı
      g.strokeStyle = v.onBreak ? p.cool : p.goldLight;
      g.lineWidth = 1.7;
      g.beginPath();
      pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
      g.stroke();

      // Altın lehim düğümü
      const [kx, ky] = pts[4];
      g.fillStyle = p.goldLight;
      g.beginPath(); g.arc(kx, ky, 2.6, 0, TAM); g.fill();
    });
  }

  // Canlı İlerleme Koru (İç altın yörünge üzerinde süzülen kor başı)
  if (!v.bos && f < 1) {
    const ka = f * TAM - Math.PI / 2;
    const kx = Math.cos(ka) * rIn, ky = Math.sin(ka) * rIn;
    g.fillStyle = p.bg;
    g.beginPath(); g.arc(kx, ky, 5.2, 0, TAM); g.fill();
    g.strokeStyle = p.goldLight;
    g.lineWidth = 1.3;
    g.beginPath(); g.arc(kx, ky, 5.2, 0, TAM); g.stroke();
    g.fillStyle = v.onBreak ? p.cool : p.acc;
    g.beginPath(); g.arc(kx, ky, 2.8, 0, TAM); g.fill();
  }

  g.restore();
}

// YENİ KERTİK LOGOSU (Altın Usturlap & Elmas Kertik Mührü)
function logoSvg(p) {
  return `<svg width="22" height="22" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="28" stroke="${p.gold}" stroke-width="2.2" opacity="0.85"/>
    <circle cx="32" cy="32" r="22" stroke="${p.ink}" stroke-width="1.2" opacity="0.35"/>
    <path d="M32 2 L36.5 13 L32 19 L27.5 13 Z" fill="${p.acc}" stroke="${p.goldLight}" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="3.5" fill="${p.gold}"/>
  </svg>`;
}

    gorev: "Borçlar Hukuku ›", bas: "13:00'te başladın · mola 10dk",
    v: { bos: false, dk: 135, ero: 0.08, onBreak: false, molas: [[45, 55]] }
  },

    durum: "çalışıyor · 4. pomodoro", saat: "06:42", alt: "19 / 25 çentik",
    gorev: "Medeni Usul ›", bas: "bugün 3 pomodoro tamamlandı (75dk)",
    v: {

      ]
    }
  },
  {
    mod: "p", koyu: true, sd: 88, pan: 0, surukleniyor: false,
    durum: "tamamlandı · kintsugi", saat: "+03:18", alt: "fazladan 3dk · altın onarım",
    gorev: "Roma Hukuku ›", bas: "gece seansı · 4. pomodoro mühürlendi",
    v: {
      bos: false, f: 1.0, ero: 0.25, onBreak: false, molas: [[9, 17], [19, 23]],
      gecmisPomolar: [
        { sd: 11, dk: 25, kirik: false },

        { sd: 64, dk: 25, kirik: false },
        { sd: 88, dk: 25, kirik: true }
      ]
    }
  }
];

  const card = document.createElement("div");
  card.className = "card";
  card.style.color = p.ink;
  const cv = document.createElement("canvas");
  cv.width = 390 * 2; cv.height = 820 * 2;
  const g = cv.getContext("2d");
  g.scale(2, 2);

  kagitCiz(g, 390, 820, p);
  const cx = 195, cy = 265, R = 108;
  if (s.mod === "k") kronometreUfukCiz(g, 390, 820, cx, cy, R, p, s.v, s.sd, s.pan, s.surukleniyor);
  else pomodoroKristalCiz(g, 390, 820, cx, cy, R, p, s.v, s.sd);

  card.appendChild(cv);
  const ui = document.createElement("div");
  ui.className = "ui";
  ui.innerHTML = `

  card.appendChild(ui);

/* ============================================================
   ODAK MODU
   Seans sürerken sayaç sayfası tüm ekranı alır, alt gezinti çekilir.
   Bu bir KİLİT DEĞİL — kullanıcı istediği an geri çağırabilir.
   Forest çıkarsan cezalandırır; burada uygulama sadece kendisi çekilir.
   ============================================================ */
let navAcik = false;

function odakGuncelle() {
  const ac = !!activeSession() && tab === "timer" && !navAcik;
  document.documentElement.classList.toggle("odak", ac);
}

/* ============================================================
   STANDBY ZEN (Masaüstü Odak Modu)
   Apple StandBy / Braun estetiğinde tam ekran yaşayan masa saati.
   Kullanıcı çalışırken telefonu masaya bıraktığında açılır.
   ============================================================ */
let standbyAcik = false;

function toggleStandby(force) {
  const yeni = force !== undefined ? !!force : !standbyAcik;
  if (standbyAcik === yeni) return;
  standbyAcik = yeni;
  buzz("sec");
  document.documentElement.classList.toggle("standby-active", standbyAcik);
  const sbLayer = el("standbyZen");
  if (sbLayer) sbLayer.setAttribute("aria-hidden", String(!standbyAcik));
  if (standbyAcik) {
    requestWake();
    guncelleStandby();
  } else {
    if (!S.active) releaseWake();
  }
}

function guncelleStandby() {
  const sbClk = el("sbClock"), sbSt = el("sbStatus"), sbSb = el("sbSub"), sbTk = el("sbTask"), sbHn = el("sbHint");
  if (!sbClk || !sbSt || !sbSb) return;
  if (sbHn) sbHn.textContent = soz("sb_cikis") || (DIL === "tr" ? "çıkmak için dokun" : "tap anywhere to exit");
  const se = activeSession();
  const mode = se ? se.mode : S.settings.mode;
  if (!se) {
    sbSt.textContent = (soz("durum_hazir") || "hazır").toUpperCase();
    sbClk.textContent = "00:00";
    sbClk.classList.remove("over");
    sbSb.textContent = mode === "pomodoro" ? soz("capt_dakika", { n: S.settings.pomoTarget }) : "";
    if (sbTk) sbTk.textContent = "";
    return;
  }
  const st = stats(se);
  if (st.onBreak) {
    sbSt.textContent = (soz("durum_mola") || "mola").toUpperCase();
    sbClk.textContent = clockStr(now() - st.breakStart);
    sbClk.classList.remove("over");
    sbSb.textContent = soz("capt_donduruldu", { s: human(st.net) });
  } else {
    let lTxt = soz("durum_calisiyor") || "çalışıyor";
    if (se.mode === "pomodoro" && se.target > 0 && st.net >= se.target * 60000) {
      lTxt = soz("durum_tamamlandi") || "tamamlandı";
    }
    sbSt.textContent = lTxt.toUpperCase();
    if (se.mode === "pomodoro" && se.target > 0) {
      const left = se.target * 60000 - st.net;
      sbClk.textContent = left >= 0 ? clockStr(left) : "+" + clockStr(-left);
      sbClk.classList.toggle("over", left < 0);
      sbSb.textContent = left >= 0
        ? soz("capt_centik", { a: Math.floor(st.net / 60000), b: se.target })
        : soz("capt_fazladan", { s: human(-left) });
    } else {
      sbClk.textContent = clockStr(st.gross);
      sbClk.classList.remove("over");
      const gm = Math.floor(st.gross / 60000);
      sbSb.textContent = soz("capt_saat_centik", { h: Math.floor(gm / 60) + 1, m: gm % 60 });
    }
  }
  if (sbTk) {
    const t = se.taskId ? S.tasks.find(x => x.id === se.taskId) : null;
    sbTk.textContent = (t ? t.title : se.note) || "";
  }
}

function naviAc() {
  if (navAcik) return;
  navAcik = true;
  buzz("sec");
  odakGuncelle();
  /* gezinti geri gelince kadran/topuz yeni yüksekliğe göre yerleşsin */
  setTimeout(() => { if (tab === "timer") moveKnob(); }, 520);
}

el("centik").onclick = naviAc;

/* Alttan yukarı kaydırma da gezintiyi geri getirir. Çentiğin üstündeki
   ince şeritte başlayan hareketi dinliyoruz; sayfa kaydırmayı bozmuyor. */
(function () {
  const c = el("centik");
  let y0 = null;
  c.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
  c.addEventListener("touchmove", e => {
    if (y0 === null) return;
    if (y0 - e.touches[0].clientY > 22) { y0 = null; naviAc(); }
  }, { passive: true });
  c.addEventListener("touchend", () => { y0 = null; }, { passive: true });
})();

/* Ekran ölçüsü değişince yeniden ölç. Katlanabilir telefonlar açılıp kapanınca
   pencere birden büyüyor: mod anahtarının topuzu ve kadran buna göre yerleşmeli.
   Klavye açılışı da resize üretir, o yüzden gecikmeli ve ucuz tutuluyor. */
let olcTimer = null;
function yenidenOlc() {
  clearTimeout(olcTimer);
  olcTimer = setTimeout(() => {
    if (tab === "timer") moveKnob();
    /* en boy değiştiyse (katlanma, yatay mod) tuval ve akış alanı baştan hesaplanır */
    if (!AK.kapali) {
      const W = Math.max(1, innerWidth), H = Math.max(1, innerHeight);
      const baz = 360;
      const beklenenW = W <= H ? baz : Math.round(baz * (W / H));
      const beklenenH = W <= H ? Math.round(baz * (H / W)) : baz;
      if (Math.abs(beklenenW - AK.w) > 8 || Math.abs(beklenenH - AK.h) > 8) {
        if (activeSession()) {
          AK.sid = null;
        } else if (KUM.tanit) {
          tanitKapat();
        } else if (AK.tanit) {
          akisTuval();
          if (AK.serit && AK.serit.length) {
            AK.tohum = hash32("kertik-tanitim");
            AK.serit = akisAlan(AK.tohum, AK.w, AK.h, (AKMOD[AKSEC] || AKMOD.sade).alan);
            AK.sira = akisSira(AK.serit, AK.w, AK.tohum);
          }
        } else {
          akisTuval();
        }
      }
    }
    render();
  }, 130);
}
window.addEventListener("resize", yenidenOlc);
window.addEventListener("orientationchange", () => setTimeout(yenidenOlc, 220));

/* mod anahtarı */
function moveKnob() {
  const on = document.querySelector("#modeSeg button.on"), k = el("knob");
  k.style.left = on.offsetLeft + "px"; k.style.width = on.offsetWidth + "px";
}
function smoothTextChange(elementId, newText) {
  const e = el(elementId);
  if (!e) return;
  const isHTML = newText.indexOf("<") > -1;
  const old = isHTML ? e.innerHTML : e.textContent;
  if (old === newText) return;
  if (!newText && !old) return;

  e.style.opacity = "0";
  e.style.filter = "blur(4px)";
  if (elementId === "clock") {
    e.style.transform = "scale(0.94)";
    e.style.letterSpacing = "0.05em";
  } else {
    e.style.transform = "scale(0.98)";
  }

  setTimeout(() => {
    if (isHTML) e.innerHTML = newText; else e.textContent = newText;
    e.style.opacity = "1";
    e.style.filter = "blur(0px)";
    e.style.transform = "scale(1)";
    if (elementId === "clock") e.style.letterSpacing = "-.04em";
  }, 140);
}
el("modeSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]"); if (!b || activeSession()) return;
  if (S.settings.mode === b.dataset.m) return;
  clearTimeout(modeTanitTimer);
  modeTanitTimer = null;
  const teaserActive = AK.tanit || (el("tanitYazi") && el("tanitYazi").classList.contains("on"));

  if (AK.tanit) {
    /* Animasyonu durdur ama aktifse yazıyı silip tekrar çıkarma - kesintisiz ve sakin kalsın */
    cancelAnimationFrame(tanitKare);
    if (KUM.tanit) {
      cancelAnimationFrame(KUM.dusAnim);
      KUM.tanit = false; KUM.hazir = false; KUM.dusen = null;
      KUM.imza = ""; KUM.kraterler = []; KUM.taslar = [];
    }
    AK.tanit = false; AK.sid = null; AK.hazir = false; AK.serit = []; AK.sira = null; AK.lastMin = -1;
  } else {
    AK.lastMin = -1;
    if (AK.ctx) { AK.ctx.setTransform(1, 0, 0, 1, 0, 0); AK.ctx.clearRect(0, 0, AK.pw, AK.ph); }
    if (AK.offCtx) { AK.offCtx.setTransform(1, 0, 0, 1, 0, 0); AK.offCtx.clearRect(0, 0, AK.pw, AK.ph); }
  }

  buzz("sec");
  S.settings.mode = b.dataset.m;
  document.querySelectorAll("#modeSeg button[data-m]").forEach(x => x.classList.toggle("on", x === b));
  moveKnob(); save(); render();

  /* Eğer teaser aktifse yeni modun sanatı akıcı şekilde devam eder, yazı silinip baştan çıkmaz */
  if (teaserActive) {
    const y = el("tanitYazi"); if (y) y.classList.add("on");
    modeTanitTimer = setTimeout(akisTanitim, 120);
  }
});

let ctlKey = "";

  } else {

    lStop.classList.remove("hidden"); lStop.classList.add("visible");
  }

  if (!se) {
    root.classList.remove("break");

      () => { el("bStart").onclick = startSession; });
    return;
  }

  const st = stats(se);
  if (st.onBreak) {
    root.classList.add("break");
    smoothTextChange("stateLabel", soz("durum_mola")); lbl.classList.add("live");
    const cStr = clockStr(now() - st.breakStart);
    if (el("clock").textContent === "00:00") smoothTextChange("clock", cStr);

    smoothTextChange("capt", soz("capt_donduruldu", { s: human(st.net) }));
    smoothTextChange("subLine", soz("alt_moladasin", { t: saatY(st.breakStart) }));
    setControls("break",

      () => { el("bRes").onclick = resume; el("bEnd").onclick = () => finish(); });
  } else {
    root.classList.remove("break");
    let lTxt = soz("durum_calisiyor");
    if (se.mode === "pomodoro" && se.target > 0 && st.net >= se.target * 60000) lTxt = soz("durum_tamamlandi");
    smoothTextChange("stateLabel", lTxt);
    lbl.classList.add("live");

    let cTxt = "", cStr = "";
    if (se.mode === "pomodoro" && se.target > 0) {
      const left = se.target * 60000 - st.net;
      if (left >= 0) { cStr = clockStr(left); cTxt = soz("capt_centik", { a: Math.floor(st.net / 60000), b: se.target }); }
      else { cStr = "+" + clockStr(-left); cTxt = soz("capt_fazladan", { s: human(-left) }); }
      if (el("clock").textContent === "00:00") smoothTextChange("clock", cStr);
      setClock(cStr, left < 0);

      const gm = Math.floor(st.gross / 60000);
      cTxt = soz("capt_saat_centik", { h: Math.floor(gm / 60) + 1, m: gm % 60 });
      if (el("clock").textContent === "00:00") smoothTextChange("clock", cStr);
      setClock(cStr);
    }
    smoothTextChange("capt", cTxt);

    let s = soz("alt_basladin", { t: saatY(se.startedAt) });
    if (st.brk > 0) s += " · " + soz("ek_mola", { s: human(st.brk) });
    smoothTextChange("subLine", s);
    if (se.mode === "pomodoro") {
      setControls("run_pomo",
        '<button class="btn ghost" id="bEnd">' + soz("btn_bitir") + '</button>',
        () => { el("bEnd").onclick = () => finish(); });
    } else {
      setControls("run",
        '<button class="btn primary" id="bBrk">' + soz("btn_mola") + '</button><button class="btn ghost" id="bEnd">' + soz("btn_bitir") + '</button>',

/* duvar — son 30 gün. Kısa gün küçük ama eksik değil;
   çalışılmayan gün boş bir çizgi. Ödül yok, seri yok.

   İKİ AYRI DUVAR (19 Ağustos 2026 kararı). Kronometre ve pomodoro tek
   duvarda buluşmuyor: kronometre süreyle, pomodoro sayıyla ölçülüyor;
   ortak eksen aramak pomodoroyu dümdüz bir çizgiye çeviriyordu. Her mod
   kendi duvarında, kendi ölçeğinde, kendi içinde kıyaslanıyor. Bir mod
   hiç kullanılmadıysa duvarı da yok. */
function duvarCiz() {
  const box = el("wallBox"); if (!box) return;
  const kron = {}, pomo = {};
  for (const s of S.sessions) {
    if (!s.endedAt) continue;
    const hedef = s.mode === "pomodoro" ? pomo : kron;
    (hedef[s.dayKey] = hedef[s.dayKey] || []).push(s);
  }
  const varK = !!Object.keys(kron).length, varP = !!Object.keys(pomo).length;
  if (!varK && !varP) { box.innerHTML = ""; return; }

  box.innerHTML = "";
  /* İkisi de varsa başlık gerekiyor — hangi duvarın hangi mod olduğu
     yazmadan anlaşılmaz. Tek mod kullanılıyorsa başlık gürültü. */
  const basliklar = varK && varP;
  if (varK) box.appendChild(birDuvar(kron, "cubuk", basliklar ? soz("mod_kronometre") : ""));
  if (varP) box.appendChild(birDuvar(pomo, "tas", basliklar ? soz("mod_pomodoro") : ""));
}

function birDuvar(gunler, tip, baslik) {
  const wall = document.createElement("div");
  wall.className = "wall wall-" + tip;
  wall.innerHTML = (baslik ? '<div class="walltitle">' + baslik + "</div>" : "") +
    '<div class="wallgrid" id="wallGrid"></div>' +
    /* gösterge yalnız çubuk duvarında: mola ve sayılmayan renkleri
       oraya ait. Taşta mola çizilmiyor, orada gösterge yalan olur. */
    (tip === "cubuk"
      ? '<div class="legend"><span><i></i>' + soz("lgnd_calisma") + '</span><span><i class="b"></i>' + soz("lgnd_mola") + '</span>' +
        '<span><i class="u"></i>' + soz("lgnd_sayilmayan") + "</span></div>"
      : "");
  const grid = wall.querySelector(".wallgrid");
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const bugun = todayKey();

  const svgler = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(t0.getTime() - i * 864e5), k = dayKey(d.getTime());
    const list = gunler[k] || [];
    const div = document.createElement("div");
    div.className = "day" + (k === bugun ? " today" : "") + (list.length ? "" : " void");
    /* patina — eski gün solar. Duvarı bir grafik değil zaman yapan şey bu
       (24-sanat-dili.md). Bugün tam koyu, 30 gün öncesi .45'e iner. */
    div.style.opacity = (1 - (i / 29) * .52).toFixed(3);
    /* boş günde de var: hücre yüksekliği sabit kalsın, ufuk kaymasın. */
    const plot = document.createElement("div"); plot.className = "plot"; div.appendChild(plot);
    if (list.length) {
      const svg = document.createElementNS(NS, "svg"); plot.appendChild(svg);
      if (tip === "tas") cizTas(svg, gunTas(list, k), { taban: 14, maxW: 180, top: 4 });
      else cizCubuk(svg, gunCubuk(list, k), { rp: 2.2, sw: 16, gap: 8, top: 4, maxW: 46 });
      svgler.push(svg);
    }
    const lbl = document.createElement("div"); lbl.className = "d";
    const gun = d.getDate();
    /* otuz rakam gürültü — sadece ayın 1'i, 5'in katları ve bugün; ara günlerde zarif nokta */
    lbl.textContent = (k === bugun || gun === 1 || gun % 5 === 0) ? gun : "·";
    div.appendChild(lbl);
    grid.appendChild(div);
  }
  duvarOlcekle(grid, svgler);
  return wall;
}

function duvarOlcekle(grid, svgler) {
  const kaydir = () => {
    if (grid) grid.scrollLeft = grid.scrollWidth;
  };
  kaydir();
  requestAnimationFrame(kaydir);
  /* 30 gün yatay kayıyor ama bugüne kaydırılmış haliyle geçmiş görünmez —
     kenar solması olmadan kullanıcı kaydırılabildiğini öğrenemiyor.
     scrollLeft'e göre iki kenarı ayrı ayrı aç/kapat. */
  const wall = grid && grid.closest(".wall");
  if (wall) {
    const guncelle = () => {
      const maxScroll = grid.scrollWidth - grid.clientWidth;
      wall.classList.toggle("can-scroll-left", grid.scrollLeft > 2);
      wall.classList.toggle("can-scroll-right", grid.scrollLeft < maxScroll - 2);
    };
    guncelle();
    requestAnimationFrame(guncelle);
    grid.addEventListener("scroll", guncelle, { passive: true });
    window.addEventListener("resize", guncelle);
  }
}

/* ---------------- görevler ---------------- */
const STATUS = {
  bekliyor: { m: "", c: "" }, yapiliyor: { m: "", c: "yapiliyor" },
  bitti: { m: "✓", c: "bitti" }, olmadi: { m: "–", c: "olmadi" },
  tasindi: { m: "→", c: "tasindi" }, iptal: { m: "×", c: "iptal" }
};
/* Anahtarlar veriye yazılıyor (t.reason), metin değil — dil değişince
   eski kayıtlar da yeni dilde okunur. */
const REASON_KEYS = ["zaman", "enerji", "araya", "unuttum", "zorlandi", "fikir"];
const reasonText = k => soz("neden_" + k);

/* ---------------- görev ölçüsü ve hedefi ----------------
   34-gorev-olcusu.md. Ölçü artık seansın değil GÖREVİN özelliği; seans yalnız
   o ölçüye bir katkı yazar (se.taskId). İlerleme HİÇBİR YERDE SAKLANMIYOR,
   seanslardan türetiliyor (08-veri-modeli.md'nin altın kuralı).

   İki ölçünün doğası farklı ve taşınma davranışları da bu yüzden farklı:
   · soru = ADET, günlük kota. Taşınınca hedef aynı kalır, sayaç sıfırdan başlar.
     ("bugün 300 soru" yarın da 300'dür, 100 değil.)
   · sayfa = İMLEÇ, kapsam. Taşınınca imleç zincir boyunca korunur — böylece
     31-seans-ciktisi.md §5'in "s.52'de kaldın" yer imi kalıcı bir iş olmadan
     da çalışır. Kullanıcı hiçbir yerde çıkarma yapmaz. */
function gorevZinciri(t) {
  const ids = [t.id]; let cur = t, guard = 0;
  while (cur && cur.movedFromId && guard++ < 200) {
    cur = S.tasks.find(x => x.id === cur.movedFromId);
    if (!cur || ids.indexOf(cur.id) >= 0) break;
    ids.push(cur.id);
  }
  return ids;
}
function gorevIlerleme(t) {
  if (!t || !t.olcu || t.olcu === "yok") return null;
  if (t.olcu === "soru") {
    let n = 0, var_ = false;
    S.sessions.forEach(se => {
      dilimler(se).forEach(d => {
        if (d.taskId !== t.id || d.olcu !== "soru" || !d.olcuVeri) return;
        const v = d.olcuVeri;
        if (v.correct == null && v.wrong == null && v.blank == null) return;
        n += (v.correct || 0) + (v.wrong || 0) + (v.blank || 0); var_ = true;
      });
    });
    return var_ ? n : null;
  }
  /* sayfa: zincirdeki en son imleç — dilimin BİTİŞ anına göre (dönüş anı) */
  const ids = gorevZinciri(t);
  let son = null, sonAt = -1;
  S.sessions.forEach(se => {
    dilimler(se).forEach(d => {
      if (ids.indexOf(d.taskId) < 0 || d.olcu !== "sayfa" || !d.olcuVeri) return;
      if (d.olcuVeri.page == null) return;
      const at = d.to || se.endedAt || se.startedAt || 0;
      if (at >= sonAt) { sonAt = at; son = d.olcuVeri.page; }
    });
  });
  return son;
}
/* Görev satırının künyesi. Yüzde yok, çubuk yok, renk yok — 31 §3'ün
   kırmızı çizgileri. Hedef varsa yanına sadece sayı yazılır, oran değil. */
/* Hedefe varılmışsa hedef bir daha yazılmaz: "▲300 → 300" gereksiz bir
   yankı, ✓ işareti zaten söylüyor. Hedefsiz işte de yazılacak bir şey yok. */
const varildi = (t, il) => t.hedef == null || (il != null && il >= t.hedef);
/* Aynı ölçünün düz metin hâli: kayıt sekmesindeki geçmiş gün satırı bir
   künye kutusu değil, tek satırlık bir cümlenin parçası. 04-cozum-gorevler.md
   G6'nın tek ekran görünümü ancak bununla tamamlanıyor: ne kadar, ne, oldu mu. */
function gorevOlcuDuz(t) {
  if (!t || !t.olcu || t.olcu === "yok") return "";
  const il = gorevIlerleme(t);
  if (t.olcu === "soru") {
    if (il == null) return t.hedef == null ? "" : soz("hedef_soru_ozet", { n: t.hedef });
    return "▲ " + il + (varildi(t, il) ? "" : " → " + t.hedef);
  }
  if (il == null) return t.hedef == null ? "" : soz("hedef_sayfa_ozet", { n: t.hedef });
  return "s." + il + (varildi(t, il) ? "" : " → " + t.hedef);
}
function gorevKunyeHtml(t) {
  if (!t || !t.olcu || t.olcu === "yok") return "";
  const ilerle = gorevIlerleme(t);
  if (t.olcu === "soru") {
    if (ilerle == null) return t.hedef == null ? "" :
      `<div class="kunye"><span class="nis">${soz("hedef_soru_ozet", { n: t.hedef })}</span></div>`;
    /* Hedef bir puanın paydası değil, bir varış yeri: "200 / 300" bir skor
       gibi okunurdu, "▲200 → 300" bir yol gibi okunuyor. Yüzde asla yok. */
    const sag = varildi(t, ilerle) ? "" : `<span class="nis">→ ${t.hedef}</span>`;
    return `<div class="kunye"><span class="isaret">▲ ${ilerle}</span>${sag}</div>`;
  }
  if (ilerle == null) return t.hedef == null ? "" :
    `<div class="kunye"><span class="nis">${soz("hedef_sayfa_ozet", { n: t.hedef })}</span></div>`;
  const sag = varildi(t, ilerle) ? "" : `<span class="nis">→ ${t.hedef}</span>`;
  return `<div class="kunye"><span>s.${ilerle}</span>${sag}</div>`;
}
/* Durum artık elle seçilmiyor, sayıdan türüyor: hedefe varıldıysa bitti,
   yol alındıysa yapılıyor. Kullanıcı menüden hâlâ üzerine yazabilir —
   türetme bir zorlama değil, bir kolaylık. */
function gorevDurumTazele(t) {
  if (!t || !t.olcu || t.olcu === "yok") return;
  const ilerle = gorevIlerleme(t);
  if (ilerle == null) return;
  if (t.status !== "bekliyor" && t.status !== "yapiliyor") return;
  if (t.hedef != null && ilerle >= t.hedef) { t.status = "bitti"; t.closedAt = now(); }
  else t.status = "yapiliyor";
  touch(t);
}
/* "ölçü ve hedef" — görev menüsünden çağrılır, kendini göstermez.
   Hedef her zaman atlanabilir: ölçüsü olup hedefi olmayan iş meşrudur. */
function askGorevOlcu(t, onDone) {
  sheet(`<h3>${soz("hedef_baslik")}</h3>
    <button class="opt${(!t.olcu || t.olcu === "yok") ? " acc" : ""}" data-g="yok">${soz("olcu_hayir")}</button>
    <button class="opt${t.olcu === "sayfa" ? " acc" : ""}" data-g="sayfa">${soz("olcu_sayfa")}</button>
    <button class="opt${t.olcu === "soru" ? " acc" : ""}" data-g="soru">${soz("olcu_soru")}</button>`, box => {
    box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      const v = b.dataset.g;
      if (v === "yok") { t.olcu = "yok"; t.hedef = null; touch(t); save(); closeSheet(); renderTasks(); if (onDone) setTimeout(onDone, 40); return; }
      askGorevHedef(t, v, onDone);
    });
  });
}
function askGorevHedef(t, tur, onDone) {
  const bas = tur === "soru" ? soz("hedef_kac_soru") : soz("hedef_hangi_sayfa");
  sheet(`<h3>${bas}</h3>
    <div class="editrow"><input type="number" id="hdIn" min="0" step="1" inputmode="numeric" style="width:110px" value="${t.hedef != null && t.olcu === tur ? t.hedef : ""}"></div>
    <button class="opt acc" id="hdOk">${soz("btn_kaydet")}</button>
    <button class="opt" id="hdAtla">${soz("btn_bos_gec")}</button>`, box => {
    const yaz = hedef => {
      t.olcu = tur; t.hedef = hedef; touch(t);
      gorevDurumTazele(t); save(); closeSheet(); renderTasks();
      if (onDone) setTimeout(onDone, 40);
    };
    box.querySelector("#hdOk").onclick = () => {
      const raw = box.querySelector("#hdIn").value, n = Number(raw);
      yaz((raw !== "" && !isNaN(n) && n > 0) ? Math.round(n) : null);
    };
    box.querySelector("#hdAtla").onclick = () => yaz(null);
  });
}
/* Başlat ekranındaki iş seçimi. Bugünün açık işleri yoksa hiçbir şey çizilmez;
   iş hiç kullanmayan kullanıcı bu özelliğin varlığını öğrenmez. */
let seciliGorev = null;
/* Görevi bugüne ekler ve nesneyi döndürür — addTask'ın kutudan bağımsız hâli. */
function gorevOlustur(baslik) {
  const t = { id: uid(), title: baslik, plannedFor: todayKey(), status: "bekliyor", reason: null, movedFromId: null, moveCount: 0, order: S.tasks.length, olcu: "yok", hedef: null, createdAt: now(), closedAt: null, editedAt: now() };
  S.tasks.push(t); save(); return t;
}
/* "+ yeni iş" — görevleri önceden eklememiş kullanıcı, çalıştığı anda adını
   yazabilsin diye. Ad bugünün işi olur (kendi künyesi, kendi soru sayısı),
   hemen ardından bir kez ölçü sorulur, sonra çağıran akış devam eder.
   Başlat ekranı değişmez: bu satır ancak zaten açılmış bir seçim sayfasında
   ya da seans sürerken görünür (35 §5'in "başlangıçta klavye yok" kuralı). */
function yeniIsSor(cb) {
  sheet(`<h3>${soz("ph_ne_yapacaksin")}</h3>
    <div class="editrow"><input type="text" id="yiIn" maxlength="60" autocomplete="off"></div>
    <button class="opt acc" id="yiOk">${soz("btn_ekle")}</button>
    <button class="opt" id="yiVaz">${soz("btn_vazgec")}</button>`, box => {
    const inp = box.querySelector("#yiIn");
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 60);
    const ekle = () => {
      const v = inp.value.trim(); if (!v) return;
      const t = gorevOlustur(v);
      buzz("sec"); closeSheet(); renderTasks();
      setTimeout(() => askGorevOlcu(t, () => cb(t)), 40);
    };
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ekle(); } };
    box.querySelector("#yiOk").onclick = ekle;
    box.querySelector("#yiVaz").onclick = () => closeSheet();
  });
}
function bugunAcikGorevler() {
  const k = todayKey();
  return S.tasks.filter(t => t.plannedFor === k && (t.status === "bekliyor" || t.status === "yapiliyor"))
    .sort((a, b) => a.order - b.order);
}
function renderGorevSec() {
  const box = el("gorevSec"); if (!box) return;
  const se = activeSession();
  if (se) { renderGorevSecAktif(box, se); return; }
  const list = bugunAcikGorevler();
  if (seciliGorev && !list.some(t => t.id === seciliGorev)) seciliGorev = null;
  if (!list.length) { box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "";
  const sec = seciliGorev && list.find(t => t.id === seciliGorev);
  if (sec) {
    const ilerle = sec.olcu === "sayfa" ? gorevIlerleme(sec) : null;
    const ek = ilerle != null ? " · " + soz("gorev_kaldin", { n: ilerle }) : "";
    box.innerHTML = `<button class="on" id="gsAc"><span class="gs-title">${esc(sec.title)}</span>${ek ? `<span class="gs-ek">${ek}</span>` : ""}<span class="gs-close" title="kaldır">×</span></button>`;
  } else {
    box.innerHTML = `<button id="gsAc"><span class="gs-title">${soz("gorev_sec")}</span><span class="gs-arrow">›</span></button>`;
  }
  el("gsAc").onclick = () => {
    if (seciliGorev) { seciliGorev = null; renderGorevSec(); return; }
    sheet(`<h3>${soz("seans_hangi_is")}</h3>
      ${list.map(t => {
        const il = t.olcu === "sayfa" ? gorevIlerleme(t) : null;
        const e2 = il != null ? ` · ${soz("gorev_kaldin", { n: il })}` : "";
        return `<button class="opt" data-p="${t.id}">${esc(t.title)}${e2}</button>`;
      }).join("")}
      <button class="opt optgap" id="gsYeni">${soz("yeni_is")}</button>
      <button class="opt dim" id="gsVaz">${soz("btn_vazgec")}</button>`, box2 => {
      box2.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
        seciliGorev = b.dataset.p; closeSheet(); renderGorevSec();
      });
      box2.querySelector("#gsYeni").onclick = () => {
        closeSheet();
        setTimeout(() => yeniIsSor(t => { seciliGorev = t.id; renderGorevSec(); }), 40);
      };
      box2.querySelector("#gsVaz").onclick = () => { closeSheet(); renderGorevSec(); };
    });
  };
}
/* Seans sürerken: sayacın altındaki satır aktif dilimin işini gösterir ve
   kalıcı kalır (bugün başlangıçta gizleniyordu). Dokununca bugünün açık
   işleri açılır; seçim bir DÖNÜŞtür (35-seans-icinde-is-degisimi.md). */
function renderGorevSecAktif(box, se) {
  const isler = seansIsleri(se);
  const su = isler[isler.length - 1];
  const t = su.taskId ? S.tasks.find(x => x.id === su.taskId) : null;
  const digerAcik = bugunAcikGorevler().filter(x => !t || x.id !== t.id);
  box.style.display = "";
  if (t) {
    const ilerle = t.olcu === "sayfa" ? gorevIlerleme(t) : null;
    const ek = ilerle != null ? " · " + soz("gorev_kaldin", { n: ilerle }) : "";
    const arrow = `<span class="gs-arrow">›</span>`;
    box.innerHTML = `<button class="on" id="gsAc"><span class="gs-title">${esc(t.title)}</span>${ek ? `<span class="gs-ek">${ek}</span>` : ""}${arrow}</button>`;
  } else {
    box.innerHTML = `<button id="gsAc"><span class="gs-title">${soz("gorev_sec")}</span><span class="gs-arrow">›</span></button>`;
  }
  el("gsAc").onclick = () => donusSec(se, t);
}
/* Bugünün açık işlerini gösterir (şu anki iş hariç); seçim dönüş üretir. */
function donusSec(se, mevcut) {
  const acik = bugunAcikGorevler().filter(x => !mevcut || x.id !== mevcut.id);
  sheet(`<h3>${soz("seans_hangi_is")}</h3>
    ${acik.map(t => {
      const il = t.olcu === "sayfa" ? gorevIlerleme(t) : null;
      const e2 = il != null ? ` · ${soz("gorev_kaldin", { n: il })}` : "";
      return `<button class="opt" data-p="${t.id}">${esc(t.title)}${e2}</button>`;
    }).join("")}
    <button class="opt optgap" id="gsYeni">${soz("yeni_is")}</button>
    <button class="opt dim" id="gsVaz">${soz("btn_vazgec")}</button>`, box => {
    box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
      const yeniId = b.dataset.p;
      closeSheet();
      setTimeout(() => donusYap(se, yeniId), 40);
    });
    box.querySelector("#gsYeni").onclick = () => {
      closeSheet();
      setTimeout(() => yeniIsSor(t => donusYap(se, t.id)), 40);
    };
    box.querySelector("#gsVaz").onclick = () => closeSheet();
  });
}

function renderTasks() {
  const k = todayKey();
  const list = S.tasks.filter(t => t.plannedFor === k).sort((a, b) => a.order - b.order);
  const box = el("taskList");
  const d = list.filter(t => t.status === "bitti").length, n = list.filter(t => t.status === "olmadi").length;
  el("taskSub").textContent = !list.length ? fullDate(k)
    : (d || n) ? soz("gorev_ozet_oldu", { n: list.length, d: d }) + (n ? " · " + soz("gorev_ozet_olmadi", { n: n }) : "")
    : soz("gorev_ozet_is", { n: list.length, tarih: fullDate(k) });
  if (!list.length) {
    box.innerHTML = '<div class="empty">' +
      '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' +
      '<div class="empty-lead">' + soz("gorev_bos") + '</div>' +
      '<div class="empty-sub">' + (soz("gorev_bos_alt") || "aklındaki işleri yukarıdan ekleyebilir veya doğrudan sayacı başlatabilirsin.") + '</div>' +
      '</div>';
  } else {
    box.innerHTML = list.map(t => `
      <div class="task ${STATUS[t.status].c}" data-t="${t.id}">
        <button class="mark ${STATUS[t.status].c}">${STATUS[t.status].m}</button>
        <div class="tt">${esc(t.title)}${t.moveCount ? '<span class="rep">↻' + t.moveCount + "</span>" : ""}
          ${t.reason ? '<div class="tiny">' + reasonText(t.reason) + "</div>" : ""}${gorevKunyeHtml(t)}</div>
      </div>`).join("");
    box.querySelectorAll(".task").forEach(x => x.onclick = () => taskMenu(x.dataset.t));
  }
  renderCarry();
}
function addTask() {
  const i = el("taskInput"), v = i.value.trim(); if (!v) return;
  S.tasks.push({ id: uid(), title: v, plannedFor: todayKey(), status: "bekliyor", reason: null, movedFromId: null, moveCount: 0, order: S.tasks.length, olcu: "yok", hedef: null, createdAt: now(), closedAt: null, editedAt: now() });
  i.value = ""; save(); buzz("sec"); renderTasks();
}
function taskMenu(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  sheet(`<h3>${esc(t.title)}</h3><p>${soz("gorev_ne_oldu")}</p>
    <button class="opt acc" data-s="bitti">${soz("st_bitti")}</button>
    <button class="opt" data-s="olmadi">${soz("st_olmadi")}</button>
    <button class="opt" data-s="tasindi">${soz("st_tasindi")}</button>
    <button class="opt dim optgap" data-s="olcu">${soz("gorev_hedef")}</button>
    <button class="opt dim" data-s="iptal">${soz("st_iptal")}</button>
    <button class="opt dim" data-s="bekliyor">${soz("st_geri")}</button>
    <button class="opt del" data-s="sil">${soz("st_sil")}</button>`, box => {
    box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      const s = b.dataset.s;
      if (s === "sil") { tomb("task", id); S.tasks = S.tasks.filter(x => x.id !== id); save(); buzz("sec"); closeSheet(); renderTasks(); return; }
      if (s === "olcu") { closeSheet(); askGorevOlcu(t); return; }
      if (s === "olmadi") { closeSheet(); askReason(t); return; }
      applyStatus(t, s); closeSheet(); renderTasks();
    });
  });
}
function applyStatus(t, s) {
  if (s === "bitti") buzz("kertik");
  else buzz("sec");
  if (s === "tasindi") {
    t.status = "tasindi"; t.closedAt = now(); touch(t);
    const d = new Date(); d.setDate(d.getDate() + 1);
    S.tasks.push({ id: uid(), title: t.title, plannedFor: dayKey(d.getTime()), status: "bekliyor", reason: null, movedFromId: t.id, moveCount: (t.moveCount || 0) + 1, order: S.tasks.length, olcu: t.olcu || "yok", hedef: (t.hedef == null ? null : t.hedef), createdAt: now(), closedAt: null, editedAt: now() });
  } else {
    t.status = s;
    t.closedAt = (s === "bekliyor") ? null : now();
    if (s !== "olmadi") t.reason = null;
    touch(t);
  }
  save();
}
function askReason(t) {
  applyStatus(t, "olmadi");
  sheet(`<h3>${soz("neden_baslik")}</h3>
    <div>${REASON_KEYS.map(k => `<button class="pill" data-r="${k}">${reasonText(k)}</button>`).join("")}</div>
    <button class="opt" id="skip" style="margin-top:16px">${soz("btn_bos_gec")}</button>`, box => {
    box.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { t.reason = b.dataset.r; touch(t); save(); closeSheet(); renderTasks(); });
    box.querySelector("#skip").onclick = () => { closeSheet(); renderTasks(); };
  });
}
function renderCarry() {
  const k = todayKey();
  const open = S.tasks.filter(t => t.plannedFor < k && (t.status === "bekliyor" || t.status === "yapiliyor"));
  const box = el("carryBox");
  if (!open.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<h2>${soz("kalan_baslik", { n: open.length })}</h2>
    ${open.map(t => `<div class="task" data-t="${t.id}"><button class="mark"></button>
      <div class="tt">${esc(t.title)}<div class="tiny">${dayLabel(t.plannedFor)}</div></div></div>`).join("")}
    <div class="editrow"><button class="sbtn" id="allMove">${soz("btn_hepsi_tasi")}</button>
    <button class="sbtn" id="allNot">${soz("btn_hepsi_olmadi")}</button></div>`;
  box.querySelectorAll(".task").forEach(d => d.onclick = () => taskMenu(d.dataset.t));
  el("allMove").onclick = () => {
    open.forEach(t => {
      t.status = "tasindi"; t.closedAt = now(); touch(t);
      S.tasks.push({ id: uid(), title: t.title, plannedFor: k, status: "bekliyor", reason: null, movedFromId: t.id, moveCount: (t.moveCount || 0) + 1, order: S.tasks.length, olcu: t.olcu || "yok", hedef: (t.hedef == null ? null : t.hedef), createdAt: now(), closedAt: null, editedAt: now() });
    });
    save(); renderTasks();
  };
  el("allNot").onclick = () => { open.forEach(t => { t.status = "olmadi"; t.closedAt = now(); touch(t); }); save(); renderTasks(); };
}

/* ============================================================
   S1 — Google Drive senkronu
   Sunucu yok. Veri kullanıcının kendi Drive'ında, appDataFolder
   denen, kullanıcıya bile görünmeyen özel alanda durur.
   Bizim tarafta hiçbir sunucu, hiçbir maliyet, hiçbir kişisel veri yok.
   ============================================================ */

/* --- MERGE:BEGIN ---  (bu blok node ile birebir test edilir) */
/* İki cihazın durumunu birleştirir. Saf fonksiyon: girdileri değiştirmez.
   Kurallar:
     1. Aynı id iki tarafta varsa daha yeni editedAt kazanır.
     2. Silinen kayıt tombstone taşır. Tombstone kaydın son
        düzenlemesinden yeniyse silme kazanır; değilse kayıt geri gelir
        (yani bir cihazda silinip diğerinde düzeltilen kayıt kaybolmaz).
     3. Ayarlar bir bütün olarak son yazan cihazınkidir.
     4. Aktif seans: elindeki cihaz (A) öncelikli. Hiçbir şey uydurulmaz. */
function mergeStates(A, B, opts) {
  opts = opts || {};
  const nowTs = opts.now || Date.now();
  const KEEP_TOMB = 180 * 864e5;   // mezar taşları 6 ay saklanır, sonra temizlenir
  const ADOPT = 12 * 36e5;         // başka cihazın açık seansını en fazla 12 saat sonra devral

  const stampOf = x => x.editedAt || x.closedAt || x.endedAt || x.createdAt || x.startedAt || 0;

  const tombs = new Map();
  for (const t of [].concat(A.tombstones || [], B.tombstones || [])) {
    if (!t || !t.id) continue;
    const p = tombs.get(t.id);
    if (!p || t.at > p.at) tombs.set(t.id, { kind: t.kind, id: t.id, at: t.at });
  }

  function mergeList(a, b) {
    const m = new Map();
    for (const x of a || []) if (x && x.id) m.set(x.id, x);
    for (const x of b || []) {
      if (!x || !x.id) continue;
      const p = m.get(x.id);
      if (!p || stampOf(x) > stampOf(p)) m.set(x.id, x);
    }
    const out = [];
    for (const x of m.values()) {
      const t = tombs.get(x.id);
      if (t && t.at >= stampOf(x)) continue;   // silme kazandı
      if (t) tombs.delete(x.id);               // düzeltme silmeden yeni → kayıt geri geldi
      out.push(x);
    }
    return out;
  }

  const sessions = mergeList(A.sessions, B.sessions).sort((x, y) => x.startedAt - y.startedAt);
  const tasks = mergeList(A.tasks, B.tasks).sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0));

  const aSet = A.settingsEditedAt || 0, bSet = B.settingsEditedAt || 0;
  const settings = (bSet > aSet && B.settings) ? B.settings : (A.settings || B.settings);

  let active = null;
  const openA = A.active ? sessions.find(s => s.id === A.active && !s.endedAt) : null;
  const openB = B.active ? sessions.find(s => s.id === B.active && !s.endedAt) : null;
  if (openA) active = openA.id;
  else if (openB && nowTs - openB.startedAt < ADOPT) active = openB.id;

  const tombstones = Array.from(tombs.values()).filter(t => nowTs - t.at < KEEP_TOMB);

  return { sessions, tasks, settings, active, tombstones, settingsEditedAt: Math.max(aSet, bSet) };
}
/* --- MERGE:END --- */

const GOOGLE = {
  /* Artık burada anahtar yok. Yetki native tarafta Identity.AuthorizationClient
     ile alınıyor (Play Services); kimlik paket adı + imza sertifikasının SHA-1'i
     üzerinden Google Cloud Console'da eşleşiyor. Sayfa yalnız Drive REST uçlarını
     bilir, OAuth uçlarını hiç bilmez. Ayrıntı: 17-google-senkron.md. */
  FILE: "kertik.json",
  FILES: "https://www.googleapis.com/drive/v3/files",
  UPLOAD: "https://www.googleapis.com/upload/drive/v3/files"
};

let gToken = null, gTokenExp = 0, gBusy = false, gLastTry = 0;
let gYetkiBekleyen = null;

/* MainActivity.kt'deki googleYetkiIste()'nin karşılığı. `interaktif=false`
   arka plandır: ekrana hiçbir şey çıkmadan, önceden verilmiş izin varsa
   sessizce tazeler, yoksa sessizce başarısız olur. `interaktif=true` yalnız
   kullanıcı "bağlan"a bastığında, gerekirse Google'ın kendi hesap seçicisini
   açar. */
function nativeYetkiIste(interaktif) {
  if (!NATIVE) return Promise.reject(new Error("yerel köprü yok"));
  return new Promise((resolve, reject) => {
    gYetkiBekleyen = { resolve, reject };
    NATIVE.googleYetkiIste(interaktif);
  });
}
window.kertikYetkiSonuc = function (token, hata) {
  const b = gYetkiBekleyen; gYetkiBekleyen = null;
  if (!b) return;
  if (token) { gToken = token; gTokenExp = now() + 55 * 60000; b.resolve(token); }
  else b.reject(new Error(hata || "yetki alınamadı"));
};

const syncReady = () => !!(SENKRON_ACIK && NATIVE);
const syncOn = () => !!(syncReady() && S.sync && S.sync.connected);

async function gAccessToken() {
  if (gToken && now() < gTokenExp - 60000) return gToken;
  return nativeYetkiIste(false);
}

async function driveFind(tok) {
  const q = encodeURIComponent("name='" + GOOGLE.FILE + "' and trashed=false");
  const r = await fetch(GOOGLE.FILES + "?spaces=appDataFolder&q=" + q + "&fields=files(id)",
    { headers: { Authorization: "Bearer " + tok } });
  if (!r.ok) throw new Error("drive/list " + r.status);
  const j = await r.json();
  return (j.files && j.files[0] && j.files[0].id) || null;
}
async function driveRead(tok, id) {
  const r = await fetch(GOOGLE.FILES + "/" + id + "?alt=media", { headers: { Authorization: "Bearer " + tok } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("drive/read " + r.status);
  try { return await r.json(); } catch (e) { return null; }
}
async function driveWrite(tok, id, data) {
  const body = JSON.stringify(data);
  if (id) {
    const r = await fetch(GOOGLE.UPLOAD + "/" + id + "?uploadType=media&fields=id", {
      method: "PATCH",
      headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" },
      body
    });
    if (r.ok) return id;
    if (r.status !== 404) throw new Error("drive/write " + r.status);
  }
  const B = "kertikSinir";
  const multipart =
    "--" + B + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
    JSON.stringify({ name: GOOGLE.FILE, parents: ["appDataFolder"] }) + "\r\n" +
    "--" + B + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
    body + "\r\n--" + B + "--";
  const r2 = await fetch(GOOGLE.UPLOAD + "?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { Authorization: "Bearer " + tok, "Content-Type": 'multipart/related; boundary="' + B + '"' },
    body: multipart
  });
  if (!r2.ok) throw new Error("drive/create " + r2.status);
  return (await r2.json()).id;
}

/* Drive'a giden paket. Dikkat: S.sync buraya ASLA konmaz —
   içinde yenileme anahtarı var, o cihazda kalır. */
function snapshot() {
  return {
    v: 2, app: "kertik",
    sessions: S.sessions, tasks: S.tasks,
    settings: S.settings, settingsEditedAt: S.settingsEditedAt || 0,
    active: S.active, tombstones: S.tombstones || [],
    savedAt: now()
  };
}
function applyMerged(m) {
  S.sessions = m.sessions;
  S.tasks = m.tasks;
  S.settings = Object.assign({}, DEFAULTS.settings, m.settings || {});
  S.settingsEditedAt = m.settingsEditedAt;
  S.active = m.active;
  S.tombstones = m.tombstones;
}

async function syncNow() {
  if (gBusy || !syncOn()) return { ok: false, err: "kapalı" };
  gBusy = true;
  const before = S.sessions.length + S.tasks.length;
  try {
    const tok = await gAccessToken();
    let fileId = S.sync.fileId;
    if (!fileId) fileId = await driveFind(tok);
    const remote = fileId ? await driveRead(tok, fileId) : null;
    const R = (remote && Array.isArray(remote.sessions)) ? remote : { sessions: [], tasks: [], tombstones: [] };
    applyMerged(mergeStates(snapshot(), R));
    S.sync.fileId = await driveWrite(tok, fileId, snapshot());
    S.sync.lastAt = now(); S.sync.lastErr = null;
    save(); dilKur(); dilUygula(); applyTheme(); ctlKey = ""; render();
    return { ok: true, added: (S.sessions.length + S.tasks.length) - before };
  } catch (e) {
    S.sync.lastErr = String((e && e.message) || e);
    save();
    return { ok: false, err: S.sync.lastErr };
  } finally { gBusy = false; }
}

/* Sessiz otomatik eşitleme. Hata olursa ekranda hiçbir şey olmaz,
   uygulama yerel modda çalışmaya devam eder. */
function autoSync(force) {
  if (!syncOn() || !S.sync.auto) return;
  if (!force && now() - gLastTry < 120000) return;
  gLastTry = now();
  syncNow();
}

/* ---------------- senkron ekranı ---------------- */
function syncLabel() {
  if (!syncReady()) return soz("sy_yok");
  if (!S.sync.connected) return soz("sy_baglan");
  if (!S.sync.lastAt) return soz("sy_bagli");
  const d = now() - S.sync.lastAt;
  if (d < 12e4) return soz("sy_az_once");
  if (d < 36e5) return soz("sy_dk_once", { n: Math.round(d / 6e4) });
  if (d < 864e5) return soz("sy_sa_once", { n: Math.round(d / 36e5) });
  return soz("sy_gun_once", { n: Math.round(d / 864e5) });
}

/* Native tarafın döndürdüğü ham hatayı insan cümlesine çevirir.
   Ekranda kod, sayı, İngilizce görünmez. */
function yetkiHatasi(e) {
  const m = String((e && e.message) || e || "");
  if (m === "izin_gerekli") return soz("hata_izin");
  if (m === "reddedildi") return soz("hata_reddedildi");
  if (m === "baslatilamadi") return soz("hata_baslatilamadi");
  if (m === "yerel köprü yok") return soz("hata_yok");
  if (/DEVELOPER_ERROR|\b10\b/.test(m)) return soz("hata_developer");
  if (/NETWORK|\b7\b/.test(m)) return soz("hata_ag");
  return soz("hata_genel");
}

/* Tek düğme. Kullanıcı hiçbir şey yazmaz, hiçbir kod girmez, hiçbir yere
   gitmez: Google\'un kendi hesap seçicisi açılır, seçer, biter. */
function syncConnect() {
  sheet('<h3>' + soz("sy_baslik") + '</h3>' +
    '<p>' + soz("sy_baglan_metin") + '</p>' +
    '<button class="opt acc" id="go" style="margin-top:14px">' + soz("sy_baglan") + '</button>' +
    '<button class="opt" id="bk">' + soz("btn_geri") + '</button>', box => {

      const g = box.querySelector("#go");
      g.textContent = soz("sy_baglaniliyor"); g.disabled = true;
      try {
        await nativeYetkiIste(true);
      } catch (e) {
        return syncFail(yetkiHatasi(e));
      }
      S.sync.connected = true; S.sync.lastErr = null; save();
      sheet('<h3>' + soz("sy_baglandi") + '</h3><p>' + soz("sy_ilk_esitleme") + '</p>');
      const res = await syncNow();
      sheet('<h3>' + soz(res.ok ? "sy_hazir" : "sy_baglandi") + '</h3>' +
        '<p>' + soz(res.ok ? "sy_acik" : "sy_ilk_olmadi") + '</p>' +
        '<button class="opt" id="ok">' + soz("btn_kapat") + '</button>',
        b2 => { b2.querySelector("#ok").onclick = () => { closeSheet(); render(); }; });
    };
  });
}

function syncFail(msg) {
  sheet('<h3>' + soz("sy_olmadi_baslik") + '</h3><p>' + esc(msg) + '</p>' +
    '<div class="editrow" style="margin-top:12px"><button class="sbtn" id="rt">' + soz("btn_yeniden_dene") + '</button>' +
    '<button class="sbtn" id="bk">' + soz("btn_geri") + '</button></div>', box => {
    box.querySelector("#bk").onclick = openSettings;
    box.querySelector("#rt").onclick = syncConnect;
  });
}

/* ---------------- sheet ---------------- */
function sheet(html, cb) {
  const b = el("sheetBox"); b.innerHTML = html;
  el("sheet").classList.add("on");
  if (cb) cb(b);
}
function closeSheet() { el("sheet").classList.remove("on"); }
el("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };

/* ---------------- döngü ---------------- */
function isDarkTheme() {
  const t = S.settings.theme || "system";
  if (t === "dark") return true;
  if (t === "light") return false;
  if (window.KertikNative && typeof window.KertikNative.sistemKoyuMu === "function") {
    try {
      const k = window.KertikNative.sistemKoyuMu();
      if (typeof k === "boolean") return k;
    } catch (_) {}
  }
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme() {
  const dark = isDarkTheme();
  document.documentElement.classList.toggle("dark", dark);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", dark ? "#111317" : "#F4F2EE");
  if (window.KertikNative && typeof window.KertikNative.temaDegisti === "function") {
    try { window.KertikNative.temaDegisti(dark); } catch (_) {}
  }
  akisYeniden();   /* renkler alana işlenmiş; tema değişince baştan çizilir */
}
window.sistemTemaDegisti = function(koyu) {
  if (!S.settings.theme || S.settings.theme === "system") {
    applyTheme();
    if (tab === "settings") renderSettings();
    else render();
  }
};
if (window.matchMedia) {
  try {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const mqHandler = () => {
      if (!S.settings.theme || S.settings.theme === "system") {
        applyTheme();
        if (tab === "settings") renderSettings();
        else render();
      }
    };
    if (mq.addEventListener) mq.addEventListener("change", mqHandler);
    else if (mq.addListener) mq.addListener(mqHandler);
  } catch (_) {}
}
function render() {
  if (tab === "timer") renderTimer();
  else if (tab === "tasks") renderTasks();
  else if (tab === "log") renderLog();
  else if (tab === "settings") renderSettings();
  akisTazele();
  odakGuncelle();
}
el("resimKapat").onclick = resmiKapat;
el("taskAdd").onclick = addTask;
el("taskInput").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
const snInp = el("sessionNoteInput");
if (snInp) snInp.addEventListener("keydown", e => { if (e.key === "Enter") addSessionNote(); });

const bSb = el("btnStandby");
if (bSb) bSb.onclick = () => toggleStandby();
const clkEl = el("clock");
if (clkEl) clkEl.onclick = () => { if (activeSession()) toggleStandby(true); };
const sbEl = el("standbyZen");
if (sbEl) sbEl.onclick = () => toggleStandby(false);

dilUygula();
applyTheme();
if (S.active) {
  const se = activeSession();
  if (se) {
    lastMilestone = Math.floor(stats(se).net / 60000 / (S.settings.milestone || 1e9));
    pomoDone = se.mode === "pomodoro" && se.target > 0 && stats(se).net >= se.target * 60000;
    requestWake();
    nativeDndBaslat();
  } else S.active = null;
}
render();
nativeBildir(true);
widgetBildir(true);
/* ilk açılış tanıtımı — arayüz oturduktan sonra, bir kez */
setTimeout(akisTanitim, 850);
setInterval(() => {
  if (S.active) { tickChecks(); if (tab === "timer") { renderTimer(); akisTazele(); } }
  nativeBildir();
  widgetBildir();      /* imza değişmediyse köprüden hiç geçmez */
}, 1000);

/* --- senkron kancaları: hepsi sessiz, hata ekrana çıkmaz --- */
autoSync(true);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { autoSync(); akisTanitim(); }
  else if (!S.active) autoSync();
});
window.addEventListener("online", () => autoSync());
</script>

      const a = G[j * gw + i], b = G[j * gw + i + 1], d = G[(j + 1) * gw + i + 1], e = G[(j + 1) * gw + i];
      let k = 0;
      if (a < c) k |= 1; if (b < c) k |= 2; if (d < c) k |= 4; if (e < c) k |= 8;
      if (k === 0 || k === 15) continue;
      const x = i * ST, y = j * ST;
      const U = () => [x + ST * ar(a, b), y];
      const Rr = () => [x + ST, y + ST * ar(b, d)];
      const D = () => [x + ST * ar(e, d), y + ST];
      const L = () => [x, y + ST * ar(a, e)];
      let p = null;
      switch (k) {
        case 1: case 14: p = [L(), U()]; break;
        case 2: case 13: p = [U(), Rr()]; break;
        case 3: case 12: p = [L(), Rr()]; break;
        case 4: case 11: p = [Rr(), D()]; break;
        case 6: case 9: p = [U(), D()]; break;
        case 7: case 8: p = [L(), D()]; break;
        case 5: p = [L(), U()]; seg.push([Rr(), D()]); break;
        case 10: p = [U(), Rr()]; seg.push([L(), D()]); break;
      }
      if (p) seg.push(p);
    }
  }
  if (KUM.kont.size < 420) KUM.kont.set(c, seg);
  return seg;
}

/* --- RENK ---------------------------------------------------------------
   Taşın dibinde sıcak, açık kumda serin. "Tek renk" itirazının cevabı:
   ton kaymasının kaynağı süsleme değil, çizginin taşa olan uzaklığı. */
/* --bg'yi saydamlığı ayarlanabilir hâle getirir: ejekta battaniyesinin
   kenardan sönen gradyanı için gerekiyor (renk kumun kendi rengi, değişen
   yalnız örtünün kalınlığı). */
function kumBgAlfa() {
  const m = /^#([0-9a-f]{6})$/i.exec(css("--bg") || "");
  if (!m) return a => (a > 0 ? css("--bg") : "rgba(0,0,0,0)");
  const n = parseInt(m[1], 16);
  const r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return a => "rgba(" + r + "," + g + "," + b + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")";
}

function kumCizgiRengi(q, koyu) {
  const a = hexHsl(css("--sanat")), c = hexHsl(css("--cool"));
  const t = .10 + .90 * Math.pow(Math.min(1, Math.max(0, q)), .70);
  if (!a || !c) return css("--muted");
  let ha = a[0], hc = c[0];
  if (Math.abs(hc - ha) > 180) { if (hc > ha) hc -= 360; else ha -= 360; }
  const h = (ha + (hc - ha) * t + 720) % 360;
  const s = (a[1] + (c[1] - a[1]) * t) * (koyu ? .30 : .24);
  const l = koyu ? .58 + t * .12 : .47 + t * .09;
  return "hsl(" + h.toFixed(1) + "," + (s * 100).toFixed(1) + "%," + (l * 100).toFixed(1) + "%)";
}

/* --- TAŞ ÇİZİMİ ---------------------------------------------------------
   Taş çizilmiş bir leke değil, ışık alan bir KÜTLE. Üç şey taşıyor:
   1) siluet üç oktavdan geliyor — iri kütle asimetrisi, omuz, faset kırığı.
      Tek oktavlı eski siluet düzgün bir yuvarlaktı, bu yüzden taşa değil
      düğmeye benziyordu.
   2) taş küre değil: dünyada yatık durur. Yerel çizim → dünya dönüşümü
      scale(TAS_SX, TAS_SY·e) ∘ rotate(a); yani dönüş yalnız dokuyu çevirir,
      taşın yattığı yön değişmez — hiçbir taş dikine dikilmiş görünmez.
   3) gövde tek yönlü ışıkla modelleniyor (üst sol): ana hacim, terminatör,
      kumdan dönen sıçrama ışığı, üst kenar parıltısı. Eskiden gövdenin
      içine %88 küçültülmüş İKİNCİ BİR SİLUET çiziliyordu; sert kenarı
      hacim değil "iki katman kâğıt" okunuyordu.
   ------------------------------------------------------------------------ */
const TAS_SX = 1.14, TAS_SY = .80;

/* Siluet noktaları taş başına bir kez hesaplanıp taşın üstünde saklanıyor;
   canlı bahçede kare başına yeniden gürültü örneklemeye gerek yok. */
function kumTasNoktalar(t, N) {
  const anahtar = "_pts" + N;
  if (t[anahtar]) return t[anahtar];
  const P = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const lob  = fbm(c * .85 + 3,  s * .85 + 7,  t.tohum) - .5;
    const orta = fbm(c * 2.4 + 11, s * 2.4 + 5,  t.tohum + 37) - .5;
    const ince = fbm(c * 5.6 + 19, s * 5.6 + 23, t.tohum + 91) - .5;
    let rr = t.r * (1 + lob * .38 + orta * .18 + ince * .05);
    rr *= 1 - .14 * Math.max(0, s);        /* alt yüz basık: taş kuma oturmuş */
    P.push([c * rr, s * rr]);
  }
  /* KIRIK DÜZLEM: siluetin iki yayı düz kirişe indiriliyor. Baştan sona
     yumuşak bir siluet organik okunuyor — taşı taş yapan, aşınmış gövdenin
     arasındaki düz kırık yüzleri. Tek bir düz kenar bile lekeyi mineral
     tarafına çekiyor. */
  const Rf = rng32(((t.tohum | 0) + 1301) >>> 0);
  const kez = t.r < 9 ? 1 : 2;
  const kullanildi = [];
  for (let f = 0; f < kez; f++) {
    const uz = Math.max(3, Math.round(N * (.13 + Rf() * .07)));
    const bas = Math.floor(Rf() * N);
    if (kullanildi.some(k => Math.abs(((bas - k + N * 1.5) % N) - N * .5) > N * .5 - uz - 2)) continue;
    kullanildi.push(bas);
    const A = P[bas], B = P[(bas + uz) % N];
    for (let i = 1; i < uz; i++) {
      const u = i / uz;
      P[(bas + i) % N] = [A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u];
    }
  }
  t[anahtar] = P;
  return P;
}

/* Dünyada sabit ışık (üst sol) taşın yerel eksenine çevrilir. */
function kumTasIsikYonu(t) {
  const sy = TAS_SY * (t.e || 1);
  const dx = -.60 / TAS_SX, dy = -.80 / sy;
  const ca = Math.cos(t.a || 0), sa = Math.sin(t.a || 0);
  const lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
  const n = Math.hypot(lx, ly) || 1;
  return [lx / n, ly / n];
}

function kumTasBasla(g, t, yOfs) {
  g.translate(t.x, t.y + (yOfs || 0));
  g.scale(TAS_SX, TAS_SY * (t.e || 1));
  g.rotate(t.a || 0);
}

function kumTasYolu(g, t, sx, sy) {
  const P = kumTasNoktalar(t, 34), n = P.length;
  sx = sx || 1; sy = sy || 1;
  const orta = (a, b) => [(a[0] + b[0]) / 2 * sx, (a[1] + b[1]) / 2 * sy];
  g.beginPath();
  const b0 = orta(P[n - 1], P[0]);
  g.moveTo(b0[0], b0[1]);
  for (let i = 0; i < n; i++) {
    const c = P[i], d = P[(i + 1) % n], e = orta(c, d);
    g.quadraticCurveTo(c[0] * sx, c[1] * sy, e[0], e[1]);
  }
  g.closePath();
}

/* Gövde boyası — çağıran taraf yolu ÇİZİP clip'lemiş olmalı. Kırık taşın
   iki parçası da aynı boyayı kullanır; böylece parçalar aynı taştan
   kopmuş görünür. */
function kumTasGovde(g, t, lx, ly, alfa, koyu, kucuk) {
  const r = t.r;
  const isik = css("--tas-isik") || (koyu ? "#FAF8F2" : "#3D6BB0");
  const hx = lx * r * .42, hy = ly * r * .42;
  let gr = g.createRadialGradient(hx, hy, r * .05, hx, hy, r * 1.72);
  gr.addColorStop(0, tasRgba(isik, (koyu ? .95 : .88) * alfa));
  gr.addColorStop(.30, tasRgba(isik, (koyu ? .42 : .34) * alfa));
  gr.addColorStop(.62, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(-r * 2.4, -r * 2.4, r * 4.8, r * 4.8);

  gr = g.createRadialGradient(-lx * r * 1.15, -ly * r * 1.15, r * .10, -lx * r * 1.15, -ly * r * 1.15, r * 1.5);
  gr.addColorStop(0, "rgba(" + (koyu ? "0,0,0" : "4,7,12") + "," + ((koyu ? .55 : .50) * alfa).toFixed(3) + ")");
  gr.addColorStop(.75, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(-r * 2.4, -r * 2.4, r * 4.8, r * 4.8);

  /* mineral tanesi — ölü düzlüğü kıran alaca; ışık alan yüzde açık,
     gölgede koyu zerreler */
  const R = rng32(((t.tohum | 0) + 311 + (kucuk ? 40 : 0)) >>> 0);
  const n = Math.min(120, Math.max(18, Math.round(r * (kucuk ? 1.8 : 3.2))));
  const koyuZerre = koyu ? "rgba(37,35,30," : "rgba(5,10,18,";
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, d = Math.sqrt(R()) * r * .98;
    const px = Math.cos(a) * d, py = Math.sin(a) * d;
    const ayd = (px * lx + py * ly) / r;
    g.fillStyle = R() < (.5 - ayd * .5) ? tasRgba(isik, .5) : koyuZerre + ".42)";
    g.globalAlpha = (.20 + R() * .35) * alfa;
    g.fillRect(px, py, .7 + R() * .9, .7 + R() * .8);
  }
  g.globalAlpha = alfa;

  /* damar — yüzeyin eğrisini izleyen bir-iki kılcal */
  if (r > 7 && !kucuk) {
    const Rv = rng32(((t.tohum | 0) + 523) >>> 0);
    for (let v = 0, kez = r > 26 ? 1 : 2; v < kez; v++) {
      const a0 = Rv() * Math.PI * 2, a1 = a0 + Math.PI * (.35 + Rv() * .3), k = .55 + Rv() * .28;
      g.beginPath();
      g.moveTo(Math.cos(a0) * r * k, Math.sin(a0) * r * k);
      g.quadraticCurveTo((Rv() - .5) * r * .7, (Rv() - .5) * r * .7, Math.cos(a1) * r * k, Math.sin(a1) * r * k);
      g.strokeStyle = (koyu ? "rgba(156,149,138," : "rgba(143,169,192,") +
        ((.11 + Rv() * .07) * alfa).toFixed(3) + ")";
      g.lineWidth = Math.max(.5, r * .030);
      g.stroke();
    }
  }
}

/* #rrggbb + alfa → rgba() */
function tasRgba(h, a) {
  h = (h || "").trim();
  if (h.charAt(0) !== "#") return h;
  if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
  return "rgba(" + parseInt(h.slice(1, 3), 16) + "," + parseInt(h.slice(3, 5), 16) + "," +
         parseInt(h.slice(5, 7), 16) + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")";
}

/* Taşın üstüne vuran tırmık çizgileri: 3D kubbe topografik mineral damarları (kertik izleri) */
function kumTasUstuCizgiler(g, t, sx, sy, alfa, cizgiler, B) {
  if (typeof KUM !== "undefined" && KUM.dusen === t) return; /* Düşen taş havadadır, üstünde çizgi olmaz */
  const aktif = cizgiler || (typeof KUM !== "undefined" ? KUM.sonCizgiler : null);
  if (!aktif || !aktif.length) return;
  const W = (typeof KUM !== "undefined" && KUM.W) ? KUM.W : 360;
  const H = (typeof KUM !== "undefined" && KUM.H) ? KUM.H : 780;
  const bicim = B || (typeof KUM !== "undefined" ? KUM.bicim : null);
  if (!bicim) return;

  const isAda = bicim.tur === "ada";
  const sFront = isAda ? 0 : kumCepheMesafe(t.x, t.y, W, H, bicim);
  const r = t.r;
  const koyu = document.documentElement.classList.contains("dark");
  const cizgiRengi = css("--line") || css("--muted");
  const isikRengi = css("--tas-isik") || "#FFFFFF";

  /* Dünya koordinatlarında tırmık yön vektörleri:
     Nw: Tırmığın kumda ilerleme yönü (normali)
     Tw: Tırmık cephesi çizgisi teğeti (tırmık çizgisi doğrultusu) */
  let Nw = [0, 1], Tw = [1, 0];
  if (bicim.tur === "ust") { Nw = [0, 1]; Tw = [1, 0]; }
  else if (bicim.tur === "alt") { Nw = [0, -1]; Tw = [1, 0]; }
  else if (bicim.tur === "sol") { Nw = [1, 0]; Tw = [0, 1]; }
  else if (bicim.tur === "sag") { Nw = [-1, 0]; Tw = [0, 1]; }
  else if (bicim.tur === "capraz") {
    Nw = [Math.cos(bicim.aci), Math.sin(bicim.aci)];
    Tw = [-Math.sin(bicim.aci), Math.cos(bicim.aci)];
  }

  /* Taşın kendi dönüş açısına (t.a) göre yerel eksenlere izdüşüm */
  const ca = Math.cos(t.a || 0), sa = Math.sin(t.a || 0);
  const Nloc = [Nw[0] * ca + Nw[1] * sa, -Nw[0] * sa + Nw[1] * ca];
  const Tloc = [Tw[0] * ca + Tw[1] * sa, -Tw[0] * sa + Tw[1] * ca];

  for (let ci = 0; ci < aktif.length; ci++) {
    const c = aktif[ci];
    if (c.bos) continue;
    const as = c.asinma || 0;
    if (as >= 3) continue;

    /* Bu taş zemine düşmeden ÖNCEKİ seanslarda çekilmiş çizgiler taşın üstünde değil, altında kalır */
    if (t.seansIdx != null && c.seansIdx != null && c.seansIdx < t.seansIdx) continue;

    if (isAda) {
      if (c.c > r * 0.94 || c.c < 1.5) continue;
      const hR = c.c;
      g.save();
      g.beginPath();
      for (let i = 0; i <= 28; i++) {
        const ang = (i / 28) * Math.PI * 2;
        const rad = hR * (0.96 + fbm(Math.cos(ang) * 2, Math.sin(ang) * 2, (t.tohum || 0) + 21) * 0.08);
        const px = Math.cos(ang) * rad * (sx || 1);
        const py = Math.sin(ang) * rad * (sy || 1);
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.strokeStyle = koyu ? isikRengi : cizgiRengi;
      g.lineWidth = Math.max(0.65, 1.1 * Math.pow(0.8, c.k));
      g.globalAlpha = (alfa || 1) * (koyu ? 0.24 : 0.28) * (1 - hR / r) * (as === 0 ? 1 : 0.5);
      g.stroke();
      g.restore();
      continue;
    }

    const distFromFront = c.c - sFront;
    if (Math.abs(distFromFront) > r * 1.05) continue;

    const u = distFromFront / r; /* -0.94 .. +0.94 */
    const chordHalf = Math.sqrt(Math.max(0.01, 1 - u * u)) * r * 0.94;
    const nPts = 16;
    const pts = [];

    for (let pi = 0; pi <= nPts; pi++) {
      const v = (pi / nPts) * 2 - 1; /* -1 .. +1 */
      const wDist = v * chordHalf;
      const zDome = Math.sqrt(Math.max(0, 1 - u * u - v * v * (1 - u * u)));
      const uDisp = (u * r) - (zDome * r * 0.22);

      const lx = (uDisp * Nloc[0] + wDist * Tloc[0]) * (sx || 1);
      const ly = (uDisp * Nloc[1] + wDist * Tloc[1]) * (sy || 1);

      pts.push([lx, ly]);
    }

    if (pts.length < 2) continue;

    g.save();
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) {
      g.lineTo(pts[k][0], pts[k][1]);
    }
    g.lineCap = "round";
    g.lineJoin = "round";
    g.strokeStyle = koyu ? isikRengi : cizgiRengi;
    g.lineWidth = Math.max(0.65, 1.15 * Math.pow(0.78, c.k));
    g.globalAlpha = (alfa || 1) * (koyu ? 0.26 : 0.34) * (as === 0 ? 1 : 0.48);
    g.stroke();

    /* İnce mineral ışıltı sırtı */
    g.lineWidth = Math.max(0.4, 0.65 * Math.pow(0.78, c.k));
    g.strokeStyle = isikRengi;
    g.globalAlpha = (alfa || 1) * (koyu ? 0.18 : 0.22);
    g.stroke();
    g.restore();
  }
}

function kumTasCiz(g, t, yOfs, sx, sy, alfa, cizgiler, B) {
  const koyu = document.documentElement.classList.contains("dark");
  g.save();
  kumTasBasla(g, t, yOfs);
  g.globalAlpha = alfa == null ? 1 : alfa;

  const taban = (alfa == null ? 1 : alfa) * (koyu ? .98 : .96);
  if (!t.kirik) {
    const [lx, ly] = kumTasIsikYonu(t), r = t.r;
    const tasR = css("--tas") || (koyu ? "#E4E0D6" : "#1E365C");
    const isikR = css("--tas-isik") || (koyu ? "#FAF8F2" : "#3D6BB0");

    /* gövde: karanlık taban ton — üstüne ışık modeli biniyor */
    kumTasYolu(g, t, sx, sy);
    g.fillStyle = tasR;
    g.globalAlpha = taban * (koyu ? .86 : .90);
    g.fill();

    g.save();
    kumTasYolu(g, t, sx, sy);
    g.clip();
    kumTasGovde(g, t, lx, ly, taban, koyu, false);
    /* sıçrama ışığı: gölge kenarında kumdan geri dönen soluk hat */
    kumTasYolu(g, t, (sx || 1) * .995, (sy || 1) * .995);
    let bg = g.createLinearGradient(-lx * r, -ly * r, lx * r * .2, ly * r * .2);
    bg.addColorStop(0, koyu ? "rgba(140,136,128,.30)" : "rgba(126,147,168,.22)");
    bg.addColorStop(.55, "rgba(0,0,0,0)");
    g.strokeStyle = bg; g.lineWidth = Math.max(1, r * .13);
    g.globalAlpha = taban; g.stroke();
    g.restore();

    /* üst kenar parıltısı — hacmi bitiren tek çizgi */
    g.save();
    kumTasYolu(g, t, (sx || 1) * .985, (sy || 1) * .985);
    const eg = g.createLinearGradient(lx * r, ly * r, -lx * r * .35, -ly * r * .35);
    eg.addColorStop(0, tasRgba(isikR, koyu ? .95 : .80));
    eg.addColorStop(.45, "rgba(0,0,0,0)");
    g.strokeStyle = eg; g.lineWidth = Math.max(.7, r * .055);
    g.globalAlpha = taban; g.stroke();
    g.restore();
    g.globalAlpha = alfa == null ? 1 : alfa;
  } else {
    kumTasKirikCiz(g, t, sx, sy, taban);
  }

  /* Taşın üzerinden geçen tırmık çizgileri. Taşın yoluna kırpılıyor:
     siluet artık dairesel olmadığı için çizgiler kenardan taşabiliyordu. */
  g.save();
  kumTasYolu(g, t, sx, sy);
  g.clip();
  kumTasUstuCizgiler(g, t, sx, sy, alfa, cizgiler, B);
  g.restore();

  g.restore();
}

/* Kırık taşın canlı bahçedeki hâli — kayıt duvarındaki tasSvg ile AYNI
   geometri: silüet fay hattından ikiye ayrılır, küçük parça kayıp döner. */
function kumTasKirikCiz(g, t, sx, sy, alfa) {
  const kaynak = kumTasNoktalar(t, 34), N = kaynak.length, P = [];
  for (let i = 0; i < N; i++) P.push([kaynak[i][0] * (sx || 1), kaynak[i][1] * (sy || 1)]);
  const R = rng32(((t.tohum | 0) + 991) >>> 0);
  const a0 = Math.floor(R() * N) % N;
  const b0 = (a0 + Math.round(N * .40) + Math.floor(R() * (N * .18))) % N;
  const [ILX, ILY] = kumTasIsikYonu(t);
  const PA = P[a0], PB = P[b0];
  const vx = PB[0] - PA[0], vy = PB[1] - PA[1];
  const L = Math.hypot(vx, vy) || 1, nx = -vy / L, ny = vx / L;
  const K = 5, fay = [PA];
  for (let i = 1; i < K; i++) {
    const u = i / K, zarf = Math.sin(u * Math.PI);
    const j = (R() - .5) * t.r * .38 * zarf;
    fay.push([PA[0] + vx * u + nx * j, PA[1] + vy * u + ny * j]);
  }
  fay.push(PB);
  const arc = (from, to) => { const o = []; let i = from; for (;;) { o.push(P[i]); if (i === to) break; i = (i + 1) % N; } return o; };
  const ic = fay.slice(1, -1);
  const p1 = arc(a0, b0).concat(ic.slice().reverse());
  const p2 = arc(b0, a0).concat(ic);
  const alan = pts => { let a = 0; for (let i = 0; i < pts.length; i++) { const q = pts[(i + 1) % pts.length]; a += pts[i][0] * q[1] - q[0] * pts[i][1]; } return Math.abs(a) / 2; };
  const kucukIlk = alan(p1) < alan(p2);
  const buyuk = kucukIlk ? p2 : p1, kucuk = kucukIlk ? p1 : p2;
  const yol = pts => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); };
  const mrk = pts => { let x = 0, y = 0; pts.forEach(p => { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; };

  const mk2 = mrk(kucuk);
  let ox = mk2[0], oy = mk2[1];
  const on = Math.hypot(ox, oy) || 1; ox /= on; oy /= on;
  const ayrik = t.catlakGap != null ? t.catlakGap : (t.altin ? t.r * .03 : t.r * .15);
  const oran = t.r * .15 > 0 ? Math.min(1, ayrik / (t.r * .15)) : 1;
  const aci = (t.altin ? .9 : 3.6) * Math.PI / 180 * (R() < .5 ? -1 : 1) * oran;
  const mx = (fay[0][0] + fay[K][0]) / 2, my = (fay[0][1] + fay[K][1]) / 2;

  const koyu = document.documentElement.classList.contains("dark");
  const tasRengi = css("--tas") || (koyu ? "#E4E0D6" : "#1E365C");
  const isikRengi = css("--tas-isik") || (koyu ? "#FAF8F2" : "#3D6BB0");
  const altinRengi = css("--altin") || (koyu ? "#D8AF54" : "#D4AF37");
  const altinPRengi = css("--altin-p") || (koyu ? "#F4D98C" : "#F9E29B");

  /* Kırığın içi — parçaların arasından KUM değil, taşın gölgede kalan iç
     yüzü görünmeli. Açık temada aradan zemin sızınca kırık "delik" gibi
     okunuyordu. */
  if (ayrik > .4) {
    g.save();
    kumTasYolu(g, t, sx, sy);
    g.clip();                       /* uçlar siluetin dışına taşmasın */
    g.beginPath();
    fay.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.lineWidth = Math.max(1.2, ayrik * 2.4);
    g.lineCap = "butt"; g.lineJoin = "round";
    g.strokeStyle = koyu ? "rgba(16,15,13,.94)" : "rgba(6,11,20,.94)";
    g.globalAlpha = alfa;
    g.stroke();
    g.restore();
  }

  /* 2a. Büyük Parça Render */
  g.fillStyle = tasRengi;
  g.globalAlpha = alfa * (koyu ? .86 : .90);
  yol(buyuk);
  g.fill();
  g.globalAlpha = alfa;

  g.save();
  yol(buyuk);
  g.clip();
  kumTasGovde(g, t, ILX, ILY, alfa, koyu, false);
  g.restore();

  /* 2b. Küçük Parça Render (Ayrılmış ve dönmüş taze parça) */
  g.save();
  g.translate(ox * ayrik, oy * ayrik);
  g.translate(mx, my); g.rotate(aci); g.translate(-mx, -my);
  g.fillStyle = tasRengi;
  g.globalAlpha = alfa * .94;
  yol(kucuk);
  g.fill();

  g.save();
  yol(kucuk);
  g.clip();
  /* taze kırık yüz: aynı ışık, bir tık daha aydınlık */
  kumTasGovde(g, t, ILX, ILY, alfa * .96, koyu, true);
  g.fillStyle = tasRgba(isikRengi, alfa * (koyu ? .12 : .10));
  g.fillRect(-t.r * 2.4, -t.r * 2.4, t.r * 4.8, t.r * 4.8);
  g.restore();
  g.restore();

  /* Tozlanma / Kum Aşınması (Uzun molada terk edilen taşın rüzgar patinası) */
  if (t.tozlu) {
    const tozRengi = css("--line") || "rgba(190,175,150,0.6)";
    g.beginPath();
    fay.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.lineWidth = Math.max(1.2, t.r * .18);
    g.strokeStyle = tozRengi;
    g.globalAlpha = alfa * .26;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.stroke();

    const Rtoz = rng32(((t.tohum | 0) + 7733) >>> 0);
    const tozSayisi = Math.min(22, Math.max(8, Math.floor(t.r * .9)));
    g.fillStyle = tozRengi;
    for (let i = 0; i < tozSayisi; i++) {
      const fi = Math.floor(Rtoz() * (K - 1));
      const p1 = fay[fi], p2 = fay[fi + 1] || fay[K];
      const sub = Rtoz();
      const px = p1[0] + (p2[0] - p1[0]) * sub + (Rtoz() - .5) * t.r * .38;
      const py = p1[1] + (p2[1] - p1[1]) * sub + (Rtoz() - .5) * t.r * .30;
      const rad = Math.max(.4, .35 + Rtoz() * .55);
      g.beginPath();
      g.arc(px, py, rad, 0, Math.PI * 2);
      g.globalAlpha = alfa * (.35 + Rtoz() * .40);
      g.fill();
    }
  }

  if (!t.altin && t.kintsugiIlerleme == null) return;

  /* KINTSUGI — altın yol uçlardan içeri çekilir, yoksa taşın dışına taşar */
  const iceri = (p, q, k) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
  const af = fay.slice();
  af[0] = iceri(fay[0], fay[1], .16);
  af[K] = iceri(fay[K], fay[K - 1], .16);

  let toplamUzunluk = 0;
  if (t.kintsugiIlerleme != null) {
    for (let i = 1; i < af.length; i++) {
      toplamUzunluk += Math.hypot(af[i][0] - af[i - 1][0], af[i][1] - af[i - 1][1]);
    }
  }

  const ciz = (w, renk, op) => {
    g.beginPath();
    af.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.lineWidth = w; g.strokeStyle = renk; g.globalAlpha = alfa * op;
    g.lineCap = "round"; g.lineJoin = "round";
    if (t.kintsugiIlerleme != null && toplamUzunluk > 0) {
      const gorunen = Math.max(0.01, toplamUzunluk * Math.min(1, t.kintsugiIlerleme));
      g.setLineDash([gorunen, toplamUzunluk * 2]);
    } else {
      g.setLineDash([]);
    }
    g.stroke();
    if (t.kintsugiIlerleme != null) g.setLineDash([]);
  };
  const altin = altinRengi;
  const altinP = altinPRengi;
  g.save();
  kumTasYolu(g, t, sx, sy);
  g.clip();                        /* altın taşın dışına damlamasın */
  ciz(Math.max(1.8, t.r * .32), altin, .30);
  ciz(Math.max(1.2, t.r * .14), altin, .98);
  if (t.r > 14) ciz(Math.max(.6, t.r * .06), altinP, .85);
  g.restore();
  g.globalAlpha = alfa;
}

/* Zemin teması — taş dünyada yatık durduğu için gölge de yatık. Dönüş
   uygulanmıyor: dönen bir gölge taşı havada döndürüyormuş gibi okunuyordu. */
function kumTasGolge(g, t, yukseklik, alfa) {
  g.save();
  g.translate(t.x, t.y);
  const koyu = document.documentElement.classList.contains("dark");
  const rX = t.r * TAS_SX * (1.02 + yukseklik * .90);
  const rY = t.r * TAS_SY * (t.e || 1) * (1.02 + yukseklik * .90);
  const cx = t.r * .12, cy = rY * .40;
  const gr = g.createRadialGradient(cx, cy, t.r * .12, cx, cy, rX * 1.30);
  const c0 = koyu ? "0,0,0" : "12,20,34";
  gr.addColorStop(0, "rgba(" + c0 + "," + (koyu ? ".34" : ".44") + ")");
  gr.addColorStop(.45, "rgba(" + c0 + "," + (koyu ? ".15" : ".20") + ")");
  gr.addColorStop(.78, "rgba(" + c0 + ",.055)");
  gr.addColorStop(1, "rgba(" + c0 + ",0)");
  g.globalAlpha = alfa;
  g.fillStyle = gr;
  g.beginPath();
  g.ellipse(cx, cy, rX * 1.30, rY * 1.20, 0, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

/* --- BAHÇEYİ BOYA ------------------------------------------------------- */
function kumBoya(g, cizgiler, W, H, atlaTas) {
  const koyu = document.documentElement.classList.contains("dark");
  g.save();
  g.fillStyle = css("--bg");
  g.fillRect(0, 0, W, H);

  /* kumun kendi alacası — doku değil, ölü düzlüğü kıran saf mineral titreşimi */
  g.globalAlpha = koyu ? .035 : .022;
  g.fillStyle = css("--line");
  const Rz = rng32(KUM.tohum + 91);
  for (let i = 0, n = (W * H) / 950; i < n; i++) g.fillRect(Rz() * W, Rz() * H, 1.1, 1.1);
  g.globalAlpha = 1;

  /* DARBENİN TAZELİĞİ ---------------------------------------------------
     Taş düştüğü an kum savrulur (guc = 1). O seansın tırmığı bahçeyi
     taradıkça darbe izi kapanır; geçişin %70'inde kum yeniden düzlenmiş
     olur (guc = 0). Krater artık kalıcı bir süs değil, sönen bir olay. */
  const kGuc = KUM.kraterler.length
    ? Math.max(0, 1 - Math.min(1, (KUM.tazeOran || 0) / .70))
    : 0;
  KUM.kirilmaGuc = kGuc;
  KUM.kirilma = kGuc > .02 ? KUM.kraterler[0] : null;

  /* Taşlar tırmıktan ÖNCE: çizgi taşın üstünden geçmez, çevresinden dolanır.
     Canlı ekranda (atlaTas) taşlar kadran maskesinden SONRA çiziliyor —
     maske taşın bir yanını yiyince taş mat bir kütle değil parlak bir
     yumurta gibi görünüyordu. */
  if (!atlaTas) for (const t of KUM.taslar) {
    kumTasGolge(g, t, 0, koyu ? .30 : .46);
    kumTasCiz(g, t, 0, 1, 1, 1);
  }

  /* tırmık izleri */
  g.lineCap = "round"; g.lineJoin = "round";
  const golge = css("--line");
  for (const c of cizgiler) {
    if (c.bos) continue;                       /* MOLA: tırmık geçmedi */
    const as = c.asinma || 0;
    if (as >= 3 && !c.taze) continue;          /* rüzgar sildi — kum düzlendi */
    const seg = kumKontur(c.c);
    if (!seg.length) continue;
    const q = Math.min(1, c.c / Math.max(1, KUM.maxF * .62));
    /* Sıklaşma derinliği inceltir ama YOK ETMEZ: 4. kademe hâlâ okunur bir iz.
       Eski geçişler bahçenin iri oluğu, yeni geçişler üstüne işlenen ince doku. */
    const incel = Math.max(.42, Math.pow(.80, c.k || 0));
    const solma = Math.max(.52, Math.pow(.90, c.k || 0));
    const hayalet = !!c.hayalet;
    /* Kanal kumla doluyor: iz genişliyor, siliniyor, kenarı titriyor. */
    const kal = 1.15 * incel * (hayalet ? 0.92 : (1 + as * .60));
    let op = (koyu ? .58 : .62) * solma * (hayalet ? .20 : (as === 0 ? 1 : as === 1 ? .50 : .23));
    if (c.taze && !hayalet) op = Math.min(.78, op * 1.18);   /* şu an çekilen tırmık taze */
    const jit = .95 * incel * (hayalet ? 1.25 : (1 + as * 1.5));

    /* kumun kabarttığı kenar */
    g.strokeStyle = golge; g.lineWidth = kal * (hayalet ? 1.3 : 2.0); g.globalAlpha = op * (hayalet ? .30 : .50);
    kumYol(g, seg, jit, c.c, 1.05);
    /* izin kendisi */
    g.strokeStyle = hayalet ? (koyu ? "rgba(237,233,224,0.22)" : "rgba(22,24,27,0.18)") : kumCizgiRengi(q, koyu);
    g.lineWidth = kal; g.globalAlpha = op;
    kumYol(g, seg, jit, c.c, 0);
  }
  g.globalAlpha = 1;

  /* KRATER — TIRMIĞIN ÜSTÜNDE ------------------------------------------
     Taş kumu dağıttı; tırmık oraya HENÜZ VARMADI. O yüzden krater tırmıktan
     sonra çiziliyor. Önce savrulan kum izleri gömüyor (bg ile yumuşak dolgu),
     sonra kabaran sırt tırmıkla AYNI kalemle (kumYol'un el titremesi ve
     kumCizgiRengi ile) çekiliyor — iki ayrı dil sorunu buradaydı. */
  if (kGuc > .02) {
    g.lineCap = "round"; g.lineJoin = "round";
    const bgA = kumBgAlfa();
    for (const k of KUM.kraterler) {
      const P = kumTasNoktalar(k, 46), NP = P.length;
      const ca = Math.cos(k.a || 0), sa = Math.sin(k.a || 0);

      /* ASİMETRİ RASTGELE DEĞİL, TAŞIN KENDİ YATIŞINDAN.
         Taş dik düşüyor (kumTasDusur y ekseninde), yani savrulma neredeyse
         simetrik olmalı. Kalan az miktardaki eğrilik siluetin en BASIK
         yanından geliyor: taş oraya gömülüyor, kumu o yana itiyor.
         Tohumdan çekilen rastgele yön hem fiziksiz hem de bahçeyi her gün
         sebepsiz başka gösteriyordu — stabilite bunu kaldırmayı istiyor. */
      let basikIdx = 0, basikR = Infinity;
      for (let i = 0; i < NP; i++) {
        const rl = Math.hypot(P[i][0], P[i][1]);
        if (rl < basikR) { basikR = rl; basikIdx = i; }
      }
      const yon = Math.atan2(P[basikIdx][1], P[basikIdx][0]);
      const asim = a => .96 + .10 * Math.cos(a - yon);   /* ±%10, göze çarpmaz */

      /* KRATER/TAŞ ORANI KÜTLEYLE KÜÇÜLÜR.
         Çarpma enerjisi kütleyle (r³), krater çapı ise enerjinin ~4. köküyle
         büyür → oran r^(-¼) gider. 90 dakikalık kaya, 15 dakikalık çakıldan
         orantısal olarak DAHA KÜÇÜK bir krater açar. */
      const rRef = Math.max(1, KUM.W * .055);
      const olcek = Math.max(.80, Math.min(1.18, Math.pow(rRef / Math.max(1, k.r), .25)));

      /* 1. EJEKTA BATTANİYESİ — halka değil, kenardan sönen uzun kuyruk.
         Kalınlık kabaca r⁻³ ile iniyor: kenarda en kalın, dışarı doğru
         belirsizce kaybolan bir kum tozu. Sert bir yüzük "çıkartma" gibi
         duruyordu; bu şekilde bahçeye karışıyor. */
      const RD = k.r * 3.05;
      const gr = g.createRadialGradient(k.x, k.y, k.r * .95, k.x, k.y, RD);
      const T = u => (u - .95) / 2.10;                   /* u = yarıçap katı */
      gr.addColorStop(0, bgA(0));
      gr.addColorStop(T(1.02), bgA(1));
      gr.addColorStop(T(1.30), bgA(.45));
      gr.addColorStop(T(1.60), bgA(.24));
      gr.addColorStop(T(2.00), bgA(.12));
      gr.addColorStop(T(2.50), bgA(.05));
      gr.addColorStop(1, bgA(0));
      g.save();
      g.globalAlpha = kGuc * (koyu ? .40 : .46);
      g.translate(k.x, k.y); g.scale(1, k.e || 1); g.translate(-k.x, -k.y);
      g.fillStyle = gr;
      g.beginPath(); g.arc(k.x, k.y, RD, 0, Math.PI * 2); g.fill();
      g.restore();

      /* 2. BASMA HATTI VE KUM SIRTI — TIRMIĞIN KALEMİYLE.
         Sırt taşın kendi siluetinden doğuyor; ama detay uzaklaştıkça sönüyor
         (det): çukur duvarı taştan uzaklaştıkça onun biçimini unutur,
         daireselleşir. Halka KOPMUYOR — parça parça çizilip her parçanın
         ağırlığı ayrı veriliyor. Boşluklu yay "yarım kalmış" görünüyordu;
         süreklilik bitmişlik hissinin kendisi. */
      const q = Math.min(1, kumCepheMesafe(k.x, k.y, W, H, KUM.bicim) / Math.max(1, KUM.maxF * .62));
      const izRengi = kumCizgiRengi(q, koyu);
      const nokta = (i, kat, dalga, det) => {
        const p = P[i % NP];
        const rl = Math.hypot(p[0], p[1]) || 1;
        const a = Math.atan2(p[1], p[0]);
        const rs = k.r + (rl - k.r) * det;               /* detay sönmesi */
        const rr = rs * kat * olcek * asim(a)
                 * (1 + (fbm(Math.cos(a) * 2.1 + 1, Math.sin(a) * 2.1 + 5, k.tohum + 13) - .5) * dalga);
        const lx = Math.cos(a) * rr, ly = Math.sin(a) * rr;
        const px = k.x + (lx * ca - ly * sa) * TAS_SX;
        const py = k.y + (lx * sa + ly * ca) * TAS_SY * (k.e || 1);
        /* tırmıkla aynı el titremesi (kumYol'un ham kolu) */
        const j = (vnoise(px * .09, py * .09, KUM.tohum + (k.tohum | 0)) - .5) * .95;
        return [px + j, py + j * .6, a];
      };
      /* TEK SÜREKLİ ÇİZGİ. Parça parça çizip her parçaya ayrı saydamlık
         vermek halkayı boncuklandırıyordu (yuvarlak uçlar üst üste binince
         her ekte koyu bir nokta kalıyor). Asimetri zaten yarıçapta yaşıyor;
         ağırlıkta da yaşatmaya çalışmak bahçeyi kirletiyor. */
      const halka = (kat, dalga, det, kalinlik, opak) => {
        /* Taş siluetiyle aynı kalem: köşeler kiriş değil quadratic yay
           (bkz. kumTasYolu). Küçük yarıçapta düz parçalar fasetleniyor. */
        const Q = []; for (let i = 0; i < NP; i++) Q.push(nokta(i, kat, dalga, det));
        const orta = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        const yol = () => {
          g.beginPath();
          const b0 = orta(Q[NP - 1], Q[0]);
          g.moveTo(b0[0], b0[1]);
          for (let i = 0; i < NP; i++) {
            const c = Q[i], d = Q[(i + 1) % NP], e = orta(c, d);
            g.quadraticCurveTo(c[0], c[1], e[0], e[1]);
          }
          g.closePath(); g.stroke();
        };
        g.save(); g.translate(0, 1.05);
        g.strokeStyle = golge; g.lineWidth = kalinlik * 2.0;
        g.globalAlpha = opak * kGuc * .50; yol();
        g.restore();
        g.strokeStyle = izRengi; g.lineWidth = kalinlik;
        g.globalAlpha = opak * kGuc; yol();
      };
      halka(1.13, .13, .80, 1.00, koyu ? .28 : .25);   /* taşın kuma gömüldüğü iç hat */
      halka(1.48, .17, .32, 1.28, koyu ? .44 : .40);   /* çarpmanın kabarttığı kum sırtı */
    }
    g.globalAlpha = 1;
  }
  g.restore();
}

/* el titremesi + taş darbe dağıtması: çizgi cetvelle değil tırmıkla çekilmiş ve taşların darbelerine fiziksel tepki verir */
function kumYol(g, seg, A, tohum, ofs, ham) {
  g.beginPath();
  const taslar = (!ham && typeof KUM !== "undefined" && KUM.taslar) ? KUM.taslar : [];
  /* En son düşen taşın kırdığı bölge: burada tırmık izleri kopuyor ve kayıyor */
  const K = ham ? null : (KUM.kirilma || null);
  const KG = K ? (KUM.kirilmaGuc || 0) : 0;
  const KE = K ? (K.e || 1) : 1;
  for (const p of seg) {
    let ax = p[0][0], ay = p[0][1];
    let bx = p[1][0], by = p[1][1];

    /* --- YENİ TAŞIN KIRDIĞI ÇİZGİLER --------------------------------
       Alan yeniden kurulduğunda çizgiler yeni taşın etrafından pürüzsüzce
       dolanıyordu: taş çizgileri BOZMUYOR, geçmişi yeniden yazıyordu.
       Burada düştüğü tarafta yerel bir kopukluk ve faz kayması var —
       düşüşün bir bedeli görünsün diye. Bahçenin geri kalanı dokunulmaz. */
    if (K && KG > .02) {
      const mx = (ax + bx) * .5, my = (ay + by) * .5;
      const kdx = mx - K.x, kdy = (my - K.y) / KE;
      const u = Math.hypot(kdx, kdy) / Math.max(1, K.r);
      if (u < 3.2) {
        /* KENARDA EN ŞİDDETLİ, DIŞARI DOĞRU SÖNER.
           Ejekta battaniyesi çukur kenarında en kalın; oradan uzaklaştıkça
           incelir. Görünürlük uğruna tepeyi dışarı kaydırmak fiziği ters
           çeviriyordu — sırtın hemen dibi en bozuk yer olmalı. */
        const w = KG * (u <= 1.12 ? 1 : Math.exp(-Math.pow((u - 1.12) / .92, 2)));
        if (w > .015) {
          /* ÖRTÜNÜN KENARI, SERPİNTİ DEĞİL.
             Eskiden her parça ayrı ayrı zar atarak siliniyordu; iz konfetiye
             dönüyor, bahçe kirli görünüyordu. Oysa kum bir bölgeyi TOPTAN
             örter: eşik alçak frekanslı bir gürültüyle dalgalanıyor, iz
             o dalgalı kenarda bitiyor — kopuk kopuk değil. */
          const esik = .40 + (vnoise(mx * .045, my * .045, KUM.tohum + 733) - .5) * .24;
          if (w > esik) continue;
          /* sürüklenme: örtünün kenarındaki iz dışa doğru çekilmiş */
          const ang = Math.atan2(kdy, kdx);
          const it = K.r * .26 * w;
          const s1 = (vnoise(ax * .13, ay * .13, KUM.tohum + 419) - .5) * 2;
          const s2 = (vnoise(bx * .13, by * .13, KUM.tohum + 419) - .5) * 2;
          ax += Math.cos(ang) * it + s1 * it * .9;
          ay += (Math.sin(ang) * it) * KE + s2 * it * .55;
          bx += Math.cos(ang) * it + s2 * it * .9;
          by += (Math.sin(ang) * it) * KE + s1 * it * .55;
        }
      }
    }

    // Taş darbe deformasyonu (Physical impact displacement)
    let aUnder = false, bUnder = false;
    for (let ti = 0; ti < taslar.length; ti++) {
      const t = taslar[ti];
      const te = t.e || 1;
      const adx = ax - t.x, ady = (ay - t.y) / te;
      const adist = Math.hypot(adx, ady);
      if (adist < t.r * 0.94) { aUnder = true; }
      else if (adist < t.r * 2.35) {
        const apush = Math.exp(-Math.pow((adist - t.r) / (t.r * 0.68), 2)) * (t.r * 0.22);
        const aang = Math.atan2(ady, adx);
        ax += Math.cos(aang) * apush;
        ay += Math.sin(aang) * apush * te;
      }

      const bdx = bx - t.x, bdy = (by - t.y) / te;
      const bdist = Math.hypot(bdx, bdy);
      if (bdist < t.r * 0.94) { bUnder = true; }
      else if (bdist < t.r * 2.35) {
        const bpush = Math.exp(-Math.pow((bdist - t.r) / (t.r * 0.68), 2)) * (t.r * 0.22);
        const bang = Math.atan2(bdy, bdx);
        bx += Math.cos(bang) * bpush;
        by += Math.sin(bang) * bpush * te;
      }
    }

    if (aUnder && bUnder) continue; // Taşın tam altındaki ezilmiş çizgi parçasını gizle

    const j1 = (vnoise(ax * .09, ay * .09, KUM.tohum + (tohum | 0)) - .5) * A;
    const j2 = (vnoise(bx * .09, by * .09, KUM.tohum + (tohum | 0)) - .5) * A;
    g.moveTo(ax + j1, ay + j1 * .6 + ofs);
    g.lineTo(bx + j2, by + j2 * .6 + ofs);
  }
  g.stroke();
}

/* ============================================================
   CANLI EKRAN
   ============================================================ */

function kumMu(se) { return !!(se && se.mode === "pomodoro"); }

/* Bugünün bahçesini (taşlar + alan + plan) kur. Yalnız gün ya da taş sayısı
   değişince çalışır — dakikada bir değil. */
function kumKur(gun, sonTs) {
  const seanslar = kumSeanslar(gun, sonTs);
  const dkList = seanslar.map(se => {
    const target = se.target || 0;
    const netDk = stats(se, sonTs).net / 60000;
    const dk = Math.max(5, target || Math.round(netDk) || 25);
    return { dk, kirik: tasKirikMi(se, sonTs), tozlu: molaKirar(se, sonTs), target };
  });
  /* KINTSUGI: kırık bir taş, aynı gün ONDAN SONRA tamamlanmış bir pomodoro
     varsa altınla onarılır — canlı bahçede de. Uzun moladan çatlayan taş,
     kullanıcı dönüp bir seansı tam bitirdiğinde gözünün önünde onarılır. */
  let bayrak = false;
  for (let i = seanslar.length - 1; i >= 0; i--) {
    dkList[i].altin = dkList[i].kirik && bayrak;
    const se = seanslar[i];
    if (se.endedAt && (se.target || 0) > 0 && !tasKirikMi(se, sonTs)) bayrak = true;
  }
  const imza = gun + "|" + dkList.map(d => d.dk + (d.kirik ? (d.altin ? "a" : (d.tozlu ? "t" : "k")) : "")).join(",") + "|" + KUM.W + "x" + KUM.H;
  if (KUM.hazir && KUM.imza === imza) return false;
  KUM.gun = gun;
  KUM.tohum = hash32("kumbahce|" + gun);
  KUM.bicim = kumBicim(KUM.tohum);
  KUM.taslar = kumTasUret(gun, dkList);
  /* KRATER = ANLIK OLAY, SÜS DEĞİL.
     Darbe izini yalnız EN SON düşen taş taşır; ondan önceki taşların kumunu
     kendi seansının tırmığı çoktan taramıştır. Eskiden her taşa kalıcı krater
     veriliyordu; günün 5. pomodorosunda bahçede 5 taze darbe izi duruyordu. */
  const sonTas = KUM.taslar.length ? KUM.taslar[KUM.taslar.length - 1] : null;
  KUM.kraterler = sonTas
    ? [{ x: sonTas.x, y: sonTas.y, r: sonTas.r, e: sonTas.e, a: sonTas.a, tohum: sonTas.tohum }]
    : [];
  /* birinci geçiş: bahçe ne kadar derin? */
  KUM.ara = 46 * (KUM.H / 780);
  kumAlanKur();
  /* ikinci geçiş: aralığı bahçenin kendi derinliğine göre kur */
  KUM.ara = Math.min(KUMMOD.araMax, Math.max(KUMMOD.araMin, KUM.maxF / KUMMOD.bant))
          * KUM.bicim.araKat * (KUM.H / 780);
  kumAlanKur();
  kumPlanKur();
  KUM.imza = imza;
  KUM.hazir = true;
  return true;
}

/* alanı ekrana bas + kadran halosu ve alt şerit — akisBirlestir'in kum sürümü.
   `ek` verilirse (düşen taş) tuval koordinatlarında araya çizilir. */
function kumBirlestir(ek) {
  const g = AK.ctx; if (!g) return;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, AK.pw, AK.ph);
  g.drawImage(AK.off, 0, 0);

  g.globalCompositeOperation = "destination-out";
  const kx = AK.pw / Math.max(1, innerWidth), ky = AK.ph / Math.max(1, innerHeight);
  const r = el("dial").getBoundingClientRect();
  if (r.width > 4) {
    const cx = (r.left + r.width / 2) * kx, cy = (r.top + r.height / 2) * ky;
    const rad = Math.max((r.width / 2) * kx, (r.height / 2) * ky);
    const ic = Math.max(1, rad * KUMMOD.halo[0]), dis = Math.max(ic + 2, rad * KUMMOD.halo[1]);
    const gr = g.createRadialGradient(cx, cy, ic, cx, cy, dis);
    gr.addColorStop(0, "rgba(0,0,0,0.85)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(cx - dis, cy - dis, dis * 2, dis * 2);
  }
  const yatay = innerWidth > innerHeight;
  const alt = AK.ph * (yatay ? Math.min(KUMMOD.alt, .22) : KUMMOD.alt);
  const gl = g.createLinearGradient(0, AK.ph - alt, 0, AK.ph);
  gl.addColorStop(0, "rgba(0,0,0,0)"); gl.addColorStop(1, "rgba(0,0,0,1)");
  g.fillStyle = gl; g.fillRect(0, AK.ph - alt, AK.pw, alt);
  g.globalCompositeOperation = "source-over";

  if (KUM.hazir) {
    g.setTransform(AK.dpr, 0, 0, AK.dpr, 0, 0);
    kumTaslariCizCanli(g, KUM.dusen);
    if (ek) ek(g);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
}

/* bahçeyi çevrimdışı tuvale boya, sonra ekrana bas */
function kumIsle(sonTs, atlaTas) {
  if (!KUM.hazir || !AK.offCtx) return;
  const cizgiler = kumCizgiler(kumOlaylar(KUM.gun, sonTs));
  KUM.sonCizgiler = cizgiler;
  AK.offCtx.setTransform(1, 0, 0, 1, 0, 0);
  AK.offCtx.clearRect(0, 0, AK.pw, AK.ph);
  AK.offCtx.setTransform(AK.dpr, 0, 0, AK.dpr, 0, 0);
  kumBoya(AK.offCtx, cizgiler, KUM.W, KUM.H, true);
  kumBirlestir();
}

/* --- TAŞIN DÜŞÜŞÜ -------------------------------------------------------
   Pomodoro'ya basıldığı an bir taş düşüyor. Ses ve titreşim ÇARPMA anında —
   düğmeye basılınca değil; kullanıcının fikri buydu. */
function kumTasDusur(t, profil) {
  if (!AK.ctx || !KUM.hazir) return;
  const T1 = 440, T2 = 130, T3 = 190, TOP = T1 + T2 + T3;
  const t0 = performance.now();
  let carpti = false;
  const sicrama = [];

  /* düşen taş henüz kumda yok: bahçe onsuz boyanıyor */
  const eskiKrater = KUM.kraterler;
  KUM.kraterler = eskiKrater.filter(k => k.tohum !== t.tohum);
  kumIsleAtlayarak(t);

  KUM.dusAnim = requestAnimationFrame(function kare() {
    const dt = performance.now() - t0;

    if (dt >= T1 && !carpti) {
      carpti = true;
      try { if (profil) { sesCalKutleDarbe(profil); buzz(profil.haptik); } } catch (e) {}
      KUM.kraterler = eskiKrater;
      const R = rng32(t.tohum + 7);
      const n = Math.round(18 + t.r * 1.3);
      for (let i = 0; i < n; i++) {
        const a = R() * Math.PI * 2, v = (.9 + R() * 2.8);
        sicrama.push({ x: t.x, y: t.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .55 - .95,
                       r: .7 + R() * 1.3, om: 1 });
      }
      kumIsleAtlayarak(t);                     /* krater ve darbe artık kumda */
    }

    kumBirlestir(g => {
      if (dt < T1) {
        const p = dt / T1, e = Math.pow(p, 2.2), yuk = 1 - e;
        kumTasGolge(g, t, yuk, .14 + e * .38);
        kumTasCiz(g, t, -yuk * KUM.H * .30, 1 - yuk * .05, 1 + yuk * .09, 1, null, KUM.bicim);
      } else if (dt < T1 + T2) {
        const p = (dt - T1) / T2, s = Math.sin(p * Math.PI) * .14;
        kumTasGolge(g, t, 0, .46);
        kumTasCiz(g, t, s * 4, 1 + s, 1 - s * .85, 1, KUM.sonCizgiler, KUM.bicim);
      } else {
        const p = Math.min(1, (dt - T1 - T2) / T3);
        kumTasGolge(g, t, 0, .46);
        kumTasCiz(g, t, Math.sin(p * Math.PI) * -1.6 * (1 - p), 1, 1, 1, KUM.sonCizgiler, KUM.bicim);
      }

      /* Darbe şok dalgası (kum üstünde yayılan mikro darbe halkası) */
      if (dt >= T1 && dt < TOP + 100) {
        const pShock = Math.min(1, (dt - T1) / (T2 + T3 + 100));
        const rShock = t.r * (1.0 + pShock * 1.35);
        const aShock = (1 - pShock) * 0.35;
        g.save();
        g.strokeStyle = css("--line");
        g.lineWidth = Math.max(0.8, 1.8 * (1 - pShock));
        g.globalAlpha = aShock;
        g.beginPath();
        g.ellipse(t.x, t.y, rShock, rShock * (t.e || 1), t.a || 0, 0, Math.PI * 2);
        g.stroke();
        g.restore();
      }

      /* sıçrayan kum */
      if (sicrama.length) {
        g.save();
        g.fillStyle = css("--muted");
        for (const s of sicrama) {
          s.x += s.vx; s.y += s.vy; s.vy += .14; s.vx *= .985; s.om -= .028;
          if (s.om <= 0) continue;
          g.globalAlpha = Math.max(0, s.om) * .55;
          g.fillRect(s.x, s.y, s.r, s.r);
        }
        g.restore();
      }
    });

    if (dt < TOP + 320) KUM.dusAnim = requestAnimationFrame(kare);
    else { KUM.dusen = null; kumIsle(); }
  });
}

/* --- TAŞIN KIRILMASI ---------------------------------------------------
   Seans hedef dolmadan bittiğinde düşmüş taşın fay hattından ikiye ayrılması.
   Wabi-sabi: vaat bozuldu, taş çatladı — dürüst kayıt kumda mühürlenir. */
function kumTasKirAnimasyonu(t, cb) {
  if (t) t.kirik = true;
  if (typeof KUM !== "undefined") KUM.dusen = null;
  if (typeof AK === "undefined" || !AK.ctx || typeof KUM === "undefined" || !KUM.hazir) { if (cb) cb(); return; }
  cancelAnimationFrame(KUM.dusAnim);
  t.catlakGap = 0;
  
  const SURE = 280;
  const t0 = performance.now();
  const GAP_FINAL = t.altin ? t.r * .03 : t.r * .15;
  const kiymiklar = [];
  const R = rng32(((t.tohum | 0) + 77) >>> 0);
  const nK = Math.round(6 + t.r * 0.4);
  for (let i = 0; i < nK; i++) {
    const a = R() * Math.PI * 2, v = 0.5 + R() * 1.8;
    kiymiklar.push({
      x: t.x, y: t.y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.6 - 0.4,
      r: 0.8 + R() * 1.2, om: 1
    });
  }

  // Hafif kadran sarsıntısı
  const dial = el("dial");
  if (dial) {
    dial.classList.remove("impact-shake");
    void dial.offsetWidth;
    dial.classList.add("impact-shake");
    setTimeout(() => { if (dial) dial.classList.remove("impact-shake"); }, 240);
  }

  KUM.dusAnim = requestAnimationFrame(function kare() {
    const dt = performance.now() - t0;
    const p = Math.min(1, dt / SURE);
    const ease = 1 - Math.pow(1 - p, 3);
    t.catlakGap = ease * GAP_FINAL;

    kumBirlestir(g => {
      if (kiymiklar.length) {
        g.save();
        g.fillStyle = css("--tas") || css("--ink");
        for (const k of kiymiklar) {
          k.x += k.vx; k.y += k.vy; k.vy += 0.08; k.vx *= 0.96; k.om -= 0.032;
          if (k.om <= 0) continue;
          g.globalAlpha = Math.max(0, k.om) * 0.7;
          g.fillRect(k.x, k.y, k.r, k.r);
        }
        g.restore();
      }
    });

    if (dt < SURE) {
      KUM.dusAnim = requestAnimationFrame(kare);
    } else {
      delete t.catlakGap;
      KUM.dusen = null;
      kumIsle();
      if (cb) cb();
    }
  });
}

/* --- KINTSUGI ONARIMI (Hak Edilmiş Dönüşüm) ---------------------------
   Kırık bir taşın ardından aynı gün tamamlanan pomodoro ile taşın altınla
   onarılması. Wabi-sabi: Kusur gizlenmez, açık edilir ve onurlandırılır.
   Ayrık parçalar sükunetle kavuşur, fay hattına altın vernik çekilir ve
   kumun üstüne mikro altın zerrecikleri (kinpun) siner. Biter ve durur (Seijaku). */
function kumTasKintsugiAnimasyonu(hedefTaslar, cb) {
  if (typeof KUM !== "undefined") KUM.dusen = null;
  if (typeof AK === "undefined" || !AK.ctx || typeof KUM === "undefined" || !KUM.hazir) {
    if (cb) cb();
    return;
  }
  cancelAnimationFrame(KUM.dusAnim);

  const taslar = Array.isArray(hedefTaslar) ? hedefTaslar : (hedefTaslar ? [hedefTaslar] : []);
  if (!taslar.length) { if (cb) cb(); return; }

  const SURE = 480;
  const t0 = performance.now();
  const tozlar = [];

  taslar.forEach(t => {
    t.catlakGap = t.r * 0.15;
    t.kintsugiIlerleme = 0;

    const R = rng32(((t.tohum | 0) + 333) >>> 0);
    const n = Math.round(6 + t.r * 0.35);
    for (let i = 0; i < n; i++) {
      const a = R() * Math.PI * 2, v = 0.25 + R() * 0.75;
      tozlar.push({
        x: t.x + (R() - 0.5) * t.r * 0.3,
        y: t.y + (R() - 0.5) * t.r * 0.3,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v * 0.45 - 0.25,
        r: 0.6 + R() * 0.8,
        om: 1,
        renk: R() > 0.4 ? (css("--altin") || "#A87A2A") : (css("--altin-p") || "#E0BE78")
      });
    }
  });

  KUM.dusAnim = requestAnimationFrame(function kare() {
    const dt = performance.now() - t0;
    const pKapanis = Math.min(1, dt / 220);
    const easeKapanis = 1 - Math.pow(1 - pKapanis, 3);

    const pAltin = dt < 140 ? 0 : Math.min(1, (dt - 140) / 240);
    const easeAltin = 1 - Math.pow(1 - pAltin, 2);

    taslar.forEach(t => {
      t.catlakGap = (t.r * 0.15) - (t.r * 0.12) * easeKapanis;
      t.kintsugiIlerleme = easeAltin;
    });

    kumBirlestir(g => {
      if (tozlar.length) {
        g.save();
        for (const tz of tozlar) {
          tz.x += tz.vx; tz.y += tz.vy; tz.vy += 0.04; tz.vx *= 0.97; tz.om -= 0.022;
          if (tz.om <= 0) continue;
          g.fillStyle = tz.renk;
          g.globalAlpha = Math.max(0, tz.om) * 0.85;
          g.fillRect(tz.x, tz.y, tz.r, tz.r);
        }
        g.restore();
      }
    });

    if (dt < SURE) {
      KUM.dusAnim = requestAnimationFrame(kare);
    } else {
      taslar.forEach(t => {
        delete t.catlakGap;
        delete t.kintsugiIlerleme;
        t.altin = true;
      });
      kumIsle();
      if (cb) cb();
    }
  });
}

/* düşmekte olan taş kumda yokmuş gibi bahçeyi boya */
function kumIsleAtlayarak(dusen) {
  const hepsi = KUM.taslar;
  KUM.taslar = hepsi.filter(x => x !== dusen);
  /* alan düşen taşı zaten içeriyor (halkalar onu bekliyor) — yalnız taşın
     kendisi ve gölgesi çizilmiyor; çizgiler olduğu gibi kalıyor */
  const cizgiler = kumCizgiler(kumOlaylar(KUM.gun));
  KUM.sonCizgiler = cizgiler;
  AK.offCtx.setTransform(1, 0, 0, 1, 0, 0);
  AK.offCtx.clearRect(0, 0, AK.pw, AK.ph);
  AK.offCtx.setTransform(AK.dpr, 0, 0, AK.dpr, 0, 0);
  kumBoya(AK.offCtx, cizgiler, KUM.W, KUM.H, true);
  KUM.taslar = hepsi;
}

/* Canlı ekranda taş katmanı. Kadranın hemen dibindeki taş biraz çekiliyor:
   silinmiyor, yalnız saatin okunmasına karışmıyor. */
function kumTaslariCizCanli(g, atla) {
  const koyu = document.documentElement.classList.contains("dark");
  const r = el("dial").getBoundingClientRect();
  let cx = KUM.W * .5, cy = KUM.H * .5, dr = KUM.W * .33;
  if (r.width > 4) {
    const kx = KUM.W / Math.max(1, innerWidth), ky = KUM.H / Math.max(1, innerHeight);
    cx = (r.left + r.width / 2) * kx; cy = (r.top + r.height / 2) * ky;
    dr = Math.max((r.width / 2) * kx, (r.height / 2) * ky);
  }
  for (const t of KUM.taslar) {
    if (t === atla) continue;
    const d = Math.hypot(t.x - cx, t.y - cy) - t.r;
    const a = Math.max(.62, Math.min(1, .62 + .38 * (d - dr * .95) / (dr * .55)));
    kumTasGolge(g, t, 0, (koyu ? .30 : .46) * a);
    kumTasCiz(g, t, 0, 1, 1, a, KUM.sonCizgiler, KUM.bicim);
  }
}

/* akisTazele'nin kum sürümü */
function kumTazele(se) {
  const cv = el("akis"); if (!cv) return;
  if (!AK.ctx || AK.w !== Math.round(AK.w) || !AK.off) { akisTuval(); }
  if (!AK.ctx) { akisTuval(); }
  KUM.W = AK.w; KUM.H = AK.h;
  const gun = (se && se.dayKey) || todayKey();
  const yeni = kumKur(gun);
  cv.classList.add("on");
  if (KUM.dusen) return;                       /* düşüş sürüyor */

  /* Rüzgar bir kez eser ve DURUR. Sürekli rüzgar seijaku'yu bozar. */
  const damga = ruzgarDamga(se);
  if (yeni) KUM.ruzgarDamga = damga;
  else if (damga !== KUM.ruzgarDamga) {
    const eskiEn = parseInt(KUM.ruzgarDamga) || 0;
    const yeniEn = parseInt(damga) || 0;
    KUM.ruzgarDamga = damga;
    AK.lastMin = -1;
    if (yeniEn > eskiEn) {
      sesCalRuzgar(yeniEn);
      buzz(yeniEn >= 3 ? "ruzgar3" : yeniEn === 2 ? "ruzgar2" : "ruzgar1");
      kumRuzgarAnim(yeniEn);
      return;
    }
  }

  const dm = se ? Math.floor((stats(se).end - se.startedAt) / 60000) : Math.floor(now() / 60000);
  if (!yeni && dm === AK.lastMin) return;
  AK.lastMin = dm;
  kumIsle();
}

/* Seans başlarken çağrılır: bahçeyi kur, yeni taşı düşür. */
function kumSeansBasladi(se) {
  const cv = akisTuval(); if (!cv || KUM.kapali) return false;
  KUM.W = AK.w; KUM.H = AK.h;
  AK.sid = se.id; AK.hazir = false; AK.lastMin = -1;
  AK.serit = []; AK.ek = []; AK.ekKapali = false;
  KUM.ruzgarDamga = ruzgarDamga(se);
  cancelAnimationFrame(KUM.ruzgarAnim);
  const t0 = performance.now();
  kumKur(se.dayKey || todayKey());
  if (performance.now() - t0 > 1600) { KUM.kapali = true; cv.classList.remove("on"); return false; }
  const t = KUM.taslar[KUM.taslar.length - 1];
  const taze = t && (now() - se.startedAt) <= 4000;
  if (taze && !cv.classList.contains("on")) {
    /* Taş düşerken katman ayrıca yavaşça açılmasın — düşüş kahraman,
       geçiş değil. Bir kare için geçiş kapatılıyor. */
    cv.style.transition = "none";
    cv.classList.add("on");
    void cv.offsetWidth;
    cv.style.transition = "";
  } else cv.classList.add("on");
  /* Taş yalnız seans GERÇEKTEN yeni başladıysa düşer. Uygulama sürmekte olan
     bir seansla yeniden açıldığında bahçe olduğu gibi, sessizce belirir. */
  if (!taze) { kumIsle(); return true; }
  KUM.dusen = t;
  cancelAnimationFrame(KUM.dusAnim);
  kumTasDusur(t, getKutleProfili(se.target));
  return true;
}

/* tema değişti → alan yeniden boyanmalı */
function kumYeniden() {
  if (!KUM.hazir) return;
  AK.lastMin = -1;
  kumIsle();
}

/* --- SEANS RESMİ (pomodoro) ---------------------------------------------
   Bir pomodoro'nun resmi = o seans bittiği ANDAKİ günün bahçesi. Kayıtta
   hiçbir görüntü saklanmıyor; gün anahtarından yeniden üretiliyor. */
function kumResmi(se, W, H, dpr, imza) {
  const cv = document.createElement("canvas");
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const yedek = { W: KUM.W, H: KUM.H, imza: KUM.imza, hazir: KUM.hazir };
  KUM.W = W; KUM.H = H; KUM.imza = ""; KUM.hazir = false;
  const son = se.endedAt || stats(se).end;
  const gun = se.dayKey || dayKey(se.startedAt);
  kumKur(gun, son);
  const cizgiler = kumCizgiler(kumOlaylar(gun, son));
  kumBoya(g, cizgiler, W, H, false);

  if (imza) {
    cizSeansKartiKatmani(g, se, W, H);
  }

  KUM.W = yedek.W; KUM.H = yedek.H; KUM.imza = ""; KUM.hazir = false;
  if (yedek.hazir && KUM.W) kumKur(KUM.gun);
  return cv;
}


/* ============================================================
   SEANS RESMİ — kayıtta saklanmayan, her seferinde yeniden üretilen görüntü

   Seans bittikten sonra alanının son hâli. Hiçbir dosya tutulmuyor: desen
   seansın kimliğinden türediği için resim her açılışta aynı çıkıyor. Yer
   kaplayan tek şey kullanıcının "kaydet" dediği PNG.
   ============================================================ */

/* İstenen ölçüde bir tuval döndürür. tam=true ise alan seansın gerçek
   süresine göre değil sonuna kadar doldurulur (kullanılmıyor, elde dursun). */
function seansResmi(se, W, H, dpr, imza) {
  if (se.mode === "pomodoro") return kumResmi(se, W, H, dpr, imza);
  const yon = akisYonu(se), M = AKMOD[yon] || AKMOD.sade;
  const cv = document.createElement("canvas");
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = css("--bg"); g.fillRect(0, 0, W, H);

  const tohum = hash32(se.id);
  const serit = akisAlan(tohum, W, H, M.alan);
  const sira = akisSira(serit, W, tohum);
  const st = stats(se), segs = segments(se);
  const dk = (st.end - se.startedAt) / 60000;
  const top = serit.length;
  const molaSor = (adet, bas, bitis) => i => {
    const ts = se.startedAt + (bas + (i / adet) * (bitis - bas)) * 60000;
    for (const sg of segs) if (ts >= sg.from && ts < sg.to) return sg.type === "break";
    return false;
  };
  const MK = molaKademeleri(se);
  const asinmaSor = (adet, bas, bitis) => i => {
    if (!MK.length) return 0;
    const ts = se.startedAt + (bas + (i / adet) * (bitis - bas)) * 60000;
    let en = 0;
    for (const m of MK) if (m.from >= ts && m.kademe > en) en = m.kademe;
    return en;
  };
  const son = Math.floor(top * Math.min(1, dk / M.dolum));
  akisCiz({ g, serit, sira, mod: yon, tohum, n: 0, incelme: 1, alfaKat: 1,
            asinmaSor: asinmaSor(top, 0, M.dolum) },
          0, son, molaSor(top, 0, M.dolum));

  /* Uzun seansın resmi 80 dakikalık seansla aynı görünmesin: canlı ekrandaki
     kademeli sıklaşma burada da uygulanıyor. Resim seansın kimliğinden
     türediği için aynı seans her açılışta aynı çıkmaya devam ediyor. */
  const KD = M.kademe;
  if (KD && dk > M.dolum) {
    let eskiler = serit;
    for (let n = 1; n < KD.say; n++) {
      const [bas, bitis] = kademeAralik(M, n);
      if (dk <= bas) break;
      const sr = akisAlan(tohum, W, H, M.alan,
                          M.alan.dsep / Math.pow(KD.bol, n),
                          Math.round(M.alan.dene * Math.pow(KD.bol, n * KD.deneUs)),
                          eskiler, n * 977);
      if (!sr.length) break;
      const incelme = Math.pow(KD.incelme, n);
      akisCiz({ g, serit: sr, sira: akisSira(sr, W, tohum + n * 13), mod: yon,
                tohum: tohum + n * 3301, n, incelme,
                alfaKat: Math.min(1, KD.katki * top / Math.max(1, sr.length * incelme)),
                asinmaSor: asinmaSor(sr.length, bas, bitis) },
              0, Math.floor(sr.length * Math.min(1, (dk - bas) / (bitis - bas))),
              molaSor(sr.length, bas, bitis));
      eskiler = eskiler.concat(sr);
      if (dk <= bitis) break;
    }
  }

  /* İmza ve Seans Kartı: Strava-tarzı wabi-sabi kart katmanı */
  if (imza) {
    cizSeansKartiKatmani(g, se, W, H);
  }
  return cv;
}

/* Strava-tarzı Wabi-Sabi Seans Kartı Katmanı */
function cizSeansKartiKatmani(g, se, W, H) {
  const pad = Math.round(W * 0.08);
  const st = stats(se);
  const d = new Date(se.startedAt);

  g.save();

  // 1. Üst Başlık (Marka + Tarih)
  g.textAlign = "left";
  g.fillStyle = css("--muted");
  g.font = "600 " + Math.max(11, Math.round(W * 0.032)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
  if (typeof g.fillText === "function") g.fillText("K E R T İ K", pad, Math.round(H * 0.075));

  const t1 = d.toLocaleDateString(DIL + "-u-nu-latn", { day: "numeric", month: "short", year: "numeric" });
  const tSaat = hhmmHam(se.startedAt) + (se.endedAt ? " – " + hhmmHam(se.endedAt) : "");
  g.textAlign = "right";
  g.fillStyle = css("--faint");
  g.font = "400 " + Math.max(10, Math.round(W * 0.027)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
  if (typeof g.fillText === "function") g.fillText(t1 + " · " + tSaat, W - pad, Math.round(H * 0.075));

  // 2. Wabi-Sabi Geçiş Katmanı (Sanatın metin alanına yumuşak süzülmesi)
  const washY = Math.round(H * 0.44);
  const gradY = Math.round(H * 0.54);
  const grad = g.createLinearGradient(0, washY, 0, gradY);
  const bgVal = css("--bg");
  if (grad && typeof grad.addColorStop === "function") {
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, bgVal);
    g.fillStyle = grad;
    g.fillRect(0, washY, W, gradY - washY);
  }
  g.fillStyle = bgVal;
  g.fillRect(0, gradY, W, H - gradY);

  // 3. Kertik Kalası (Odak ve mola dilimlerinin ahşap zaman çizgisi)
  const barY = Math.round(H * 0.54);
  const barW = W - 2 * pad;
  const barH = Math.max(10, Math.round(W * 0.026));
  const totalMs = Math.max(60000, (se.endedAt || st.end) - se.startedAt);
  const segs = segments(se);

  g.fillStyle = css("--line");
  g.beginPath();
  if (typeof g.roundRect === "function") g.roundRect(pad, barY, barW, barH, barH / 2);
  else g.rect(pad, barY, barW, barH);
  g.fill();

  for (const sg of segs) {
    const x = pad + ((sg.from - se.startedAt) / totalMs) * barW;
    const w = Math.max(2, ((sg.to - sg.from) / totalMs) * barW);
    if (sg.type === "work") {
      g.fillStyle = css("--kopru") || css("--ink");
      g.beginPath();
      if (typeof g.roundRect === "function") g.roundRect(x, barY, w, barH, 2);
      else g.rect(x, barY, w, barH);
      g.fill();
    } else if (sg.type === "break") {
      g.fillStyle = css("--mola1") || css("--muted");
      g.globalAlpha = 0.45;
      g.beginPath();
      if (typeof g.roundRect === "function") g.roundRect(x, barY, w, barH, 2);
      else g.rect(x, barY, w, barH);
      g.fill();
      g.globalAlpha = 1;
    }
  }

  // 4. Ana Metrik: Net Odaklanma Süresi (Strava Ruhu)
  g.textAlign = "left";
  g.fillStyle = css("--ink");
  g.font = "700 " + Math.max(26, Math.round(W * 0.105)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
  const heroSure = human(st.confirmed);
  if (typeof g.fillText === "function") g.fillText(heroSure, pad, Math.round(H * 0.64));

  g.fillStyle = css("--muted");
  g.font = "500 " + Math.max(10, Math.round(W * 0.030)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
  if (typeof g.fillText === "function") g.fillText(soz("kart_odak_suresi") || "odak süresi", pad, Math.round(H * 0.675));

  // 5. İş / Ders Adı
  let isAdi = "";
  if (se.isler && se.isler.length > 0 && se.isler[0].taskId) {
    isAdi = S.tasks.find(t => t.id === se.isler[0].taskId)?.title || "";
  } else if (se.taskId) {
    isAdi = S.tasks.find(t => t.id === se.taskId)?.title || "";
  }
  if (!isAdi) isAdi = (se.mode === "pomodoro" ? soz("mod_pomodoro") : soz("mod_kronometre"));

  g.fillStyle = css("--ink");
  g.font = "600 " + Math.max(14, Math.round(W * 0.046)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
  if (typeof g.fillText === "function") g.fillText(isAdi, pad, Math.round(H * 0.735));

  // 6. İkincil İstatistikler (Mola, Ölçü)
  let colX = pad;
  if (st.brk > 0) {
    g.fillStyle = css("--muted");
    g.font = "400 " + Math.max(11, Math.round(W * 0.032)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
    const molaText = human(st.brk) + " " + (soz("kart_mola") || "mola");
    if (typeof g.fillText === "function") g.fillText(molaText, colX, Math.round(H * 0.79));
    colX += Math.round(W * 0.34);
  }

  if (se.olcu === "sayfa") {
    const ov = se.olcuVeri || {};
    const sfStr = "s." + (ov.nerede ?? ov.sayfa ?? "") + (ov.fark ? " (+" + ov.fark + ")" : "");
    g.fillStyle = css("--ink");
    g.font = "500 " + Math.max(11, Math.round(W * 0.032)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
    if (typeof g.fillText === "function") g.fillText(sfStr, colX, Math.round(H * 0.79));
  } else if (se.olcu === "soru") {
    const ov = se.olcuVeri || {};
    const qStr = "▲ " + (ov.dogru || 0) + "  ▼ " + (ov.yanlis || 0) + "  ○ " + (ov.bos || 0);
    g.fillStyle = css("--ink");
    g.font = "500 " + Math.max(11, Math.round(W * 0.032)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
    if (typeof g.fillText === "function") g.fillText(qStr, colX, Math.round(H * 0.79));
  }

  // 7. Not (varsa)
  if (se.note) {
    g.fillStyle = css("--faint");
    g.font = "italic 400 " + Math.max(10, Math.round(W * 0.029)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
    const kirpNot = se.note.length > 46 ? se.note.slice(0, 46) + "…" : se.note;
    if (typeof g.fillText === "function") g.fillText("“" + kirpNot + "”", pad, Math.round(H * 0.845));
  }

  // 8. Alt Mühür / Zarafet Çizgisi
  g.strokeStyle = css("--line");
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(pad, Math.round(H * 0.925));
  g.lineTo(W - pad, Math.round(H * 0.925));
  g.stroke();

  g.fillStyle = css("--faint");
  g.font = "400 " + Math.max(9, Math.round(W * 0.025)) + "px -apple-system,BlinkMacSystemFont,system-ui,sans-serif";
  g.textAlign = "center";
  if (typeof g.fillText === "function") g.fillText("d ü r ü s t   k a y ı t", W / 2, Math.round(H * 0.955));
  g.restore();
}

/* Tam ekran gösterim ve Strava-tarzı seans kartı önizlemesi. */
function resmiAc(id) {
  const se = S.sessions.find(x => x.id === id); if (!se) return;
  const kutu = el("resimKat"), tuvalYer = el("resimTuval");
  kutu.classList.add("on");
  tuvalYer.innerHTML = "";
  el("resimDurum").textContent = "";
  /* çizim ağır; önce katman açılsın */
  setTimeout(() => {
    const W = innerWidth, H = innerHeight;
    const cv = seansResmi(se, W, H, Math.min(2, devicePixelRatio || 1), true);
    cv.style.width = "100%"; cv.style.height = "100%";
    tuvalYer.innerHTML = ""; tuvalYer.appendChild(cv);
    el("resimPaylas").onclick = () => seansPaylas(se);
    el("resimKaydet").onclick = () => resmiKaydet(se);
  }, 60);
}
function resmiKapat() { el("resimKat").classList.remove("on"); el("resimTuval").innerHTML = ""; }

function seansPaylas(se) {
  const d = el("resimDurum");
  d.textContent = soz("resim_hazirlaniyor");
  setTimeout(() => {
    try {
      /* 9:16 yüksek çözünürlüklü hikaye ve paylaşım standardı */
      const W = 1080, H = 1920;
      const cv = seansResmi(se, W, H, 1, true);
      const b64 = cv.toDataURL("image/png").split(",")[1];
      const ad = "kertik-seans-" + se.dayKey + "-" + hhmmHam(se.startedAt).replace(":", "") + ".png";
      const N = window.KertikNative;
      if (N && N.resimPaylas) {
        const sonuc = N.resimPaylas(b64, ad);
        d.textContent = sonuc === "paylas" ? "" : soz("resim_olmadi");
      } else if (navigator.share && cv.toBlob) {
        cv.toBlob(async blob => {
          try {
            const dosya = new File([blob], ad, { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [dosya] })) {
              await navigator.share({
                files: [dosya],
                title: "Kertik",
                text: human(stats(se).confirmed) + " odak seansı"
              });
              d.textContent = "";
            } else {
              const a = document.createElement("a");
              a.href = cv.toDataURL("image/png"); a.download = ad; a.click();
              d.textContent = soz("resim_indirildi");
            }
          } catch (err) { d.textContent = ""; }
        }, "image/png");
      } else {
        const a = document.createElement("a");
        a.href = cv.toDataURL("image/png"); a.download = ad; a.click();
        d.textContent = soz("resim_indirildi");
      }
    } catch (e) { d.textContent = soz("resim_olmadi"); }
  }, 40);
}

function resmiKaydet(se) {
  const d = el("resimDurum");
  d.textContent = soz("resim_hazirlaniyor");
  setTimeout(() => {
    try {
      /* Yüksek çözünürlüklü kart kaydı: 1080x1920 */
      const W = 1080, H = 1920;
      const cv = seansResmi(se, W, H, 1, true);
      const b64 = cv.toDataURL("image/png").split(",")[1];
      const ad = "kertik-seans-" + se.dayKey + "-" + hhmmHam(se.startedAt).replace(":", "") + ".png";
      const N = window.KertikNative;
      if (N && N.resimKaydet) {
        const sonuc = N.resimKaydet(b64, ad);
        d.textContent = sonuc === "galeri" ? soz("resim_galeri")
                      : sonuc === "paylas" ? "" : soz("resim_olmadi");
      } else {
        const a = document.createElement("a");
        a.href = cv.toDataURL("image/png"); a.download = ad; a.click();
        d.textContent = soz("resim_indirildi");
      }
    } catch (e) { d.textContent = soz("resim_olmadi"); }
  }, 40);
}

/* ============================================================
   İLK AÇILIŞ — akış kendini bir kez gösterir

   Yoksa kullanıcı bu özelliğin varlığından habersiz kalıyor: alan ancak
   seansın 20. dakikasından sonra okunur hâle geliyor ve o sırada zaten
   ekrana bakmıyor. Bir kez, ilk açılışta, boş sayaç ekranında akıp soluyor.

   Kalıcı olarak yalnız bir bayrak yazılıyor — ayarlara girmiyor, Drive'a
   senkronlanmıyor: bu cihazda bir kez görülmesi yeterli.
   ============================================================ */
/* ============================================================
   İLK AÇILIŞ VE MOD TANITIMI (TEASER)
   Sıfır sürtünme, tam kararlılık: Kullanıcı seans başlatmadığı
   veya başka bir etkileşime girmediği sürece arkadaki organik sanatı
   zarifçe önizler. Herhangi bir dokunuşta anında ve temizce çekilir.
   ============================================================ */
const TANIT_ANAHTAR = "kertik.akisTanit";
let tanitKare = 0, tanitTimer = null, modeTanitTimer = null, tanitBitisTimer = null;

function tanitKapat() {
  clearTimeout(tanitTimer);
  clearTimeout(modeTanitTimer);
  clearTimeout(tanitBitisTimer);
  tanitTimer = null; modeTanitTimer = null; tanitBitisTimer = null;
  cancelAnimationFrame(tanitKare);
  if (KUM.tanit) {
    cancelAnimationFrame(KUM.dusAnim);
    KUM.tanit = false; KUM.hazir = false; KUM.dusen = null;
    KUM.imza = ""; KUM.kraterler = []; KUM.taslar = [];
  }
  AK.tanit = false; AK.sid = null; AK.hazir = false; AK.serit = []; AK.sira = null; AK.lastMin = -1;
  const y = el("tanitYazi");
  if (y) y.classList.remove("on");
  const cv = el("akis");
  if (cv) {
    cv.classList.remove("on");
    setTimeout(() => {
      if (!AK.tanit && !KUM.tanit && !activeSession()) {
        if (AK.ctx) { AK.ctx.setTransform(1, 0, 0, 1, 0, 0); AK.ctx.clearRect(0, 0, AK.pw, AK.ph); }
        if (AK.offCtx) { AK.offCtx.setTransform(1, 0, 0, 1, 0, 0); AK.offCtx.clearRect(0, 0, AK.pw, AK.ph); }
      }
    }, 460);
  }
}

function kumTanitBahce() {
  const R = rng32((Math.random() * 4294967295) >>> 0);
  KUM.gun = "__tanit__";
  KUM.tohum = hash32("kertik-kum-tanitim|" + Math.floor(R() * 1e9));
  KUM.bicim = { tur: "ada", eg: 0, aci: 0, gurultu: .78 + R() * .40, araKat: .90 + R() * .24 };
  const W = KUM.W, H = KUM.H;
  let tx = W * .30, ty = H * .105, tr = W * .072;
  for (let d = 0; d < 40; d++) {
    const r = W * (.060 + R() * .028);
    const x = W * (.13 + R() * .74), y = H * (.070 + R() * .085);
    if (y - r * 1.15 < H * .062) continue;                 /* mod anahtarı */
    if (Math.abs(x - W * .5) < W * .23 && y > H * .082) continue;  /* durum yazısı */
    tx = x; ty = y; tr = r; break;
  }
  KUM.taslar = [{ x: tx, y: ty, r: tr,
                  a: R() * Math.PI * 2, e: .78 + R() * .26,
                  tohum: Math.floor(R() * 1e6), dk: 25 }];
  KUM.kraterler = [];
  KUM.ara = 46 * (KUM.H / 780);
  kumAlanKur();
  KUM.ara = Math.min(KUMMOD.araMax, Math.max(KUMMOD.araMin, KUM.maxF / KUMMOD.bant))
          * (KUM.H / 780);
  kumAlanKur();
  kumPlanKur();
  KUM.imza = "";
  KUM.ruzgarDamga = "";
  KUM.hazir = true;
  return KUM.plan.length > 2;
}

function kumTanitim() {
  const cv = akisTuval(); if (!cv || KUM.kapali) return;
  clearTimeout(tanitTimer);
  KUM.W = AK.w; KUM.H = AK.h;
  AK.tanit = true; KUM.tanit = true; AK.sid = "__tanitim__"; AK.hazir = false;
  tanitTimer = setTimeout(() => {
    tanitTimer = null;
    if (!AK.tanit) return;
    const t0 = performance.now();
    if (!kumTanitBahce() || performance.now() - t0 > 1400) {
      KUM.kapali = true; tanitKapat(); return;
    }
    kumTanitOynat();
  }, 60);
}

function kumTanitOynat() {
  const cv = el("akis"), yazi = el("tanitYazi");
  const t = KUM.taslar[0];
  const DUS = 560, HALKA = 2320, BEKLE = 560;
  const plan0 = KUM.plan.filter(p => p.k === 0);
  const N = plan0.length;

  KUM.dusen = t;
  cv.style.transition = "none";
  cv.classList.add("on");
  void cv.offsetWidth;
  cv.style.transition = "";

  let sonK = -1, carpti = false;
  const t0 = performance.now();

  const boya = k => {
    const cizgiler = [];
    for (let i = 0; i < k; i++) cizgiler.push({ c: plan0[i].c, k: plan0[i].k, bos: false });
    AK.offCtx.setTransform(1, 0, 0, 1, 0, 0);
    AK.offCtx.clearRect(0, 0, AK.pw, AK.ph);
    AK.offCtx.setTransform(AK.dpr, 0, 0, AK.dpr, 0, 0);
    kumBoya(AK.offCtx, cizgiler, KUM.W, KUM.H, true);
    sonK = k;
  };

  const adim = () => {
    if (!AK.tanit) return;
    const dt = performance.now() - t0;

    if (dt < DUS) {
      if (sonK !== 0) boya(0);
      const p = dt / DUS, e = Math.pow(p, 2.2), yuk = 1 - e;
      kumBirlestir(g => {
        kumTasGolge(g, t, yuk, .14 + e * .38);
        kumTasCiz(g, t, -yuk * KUM.H * .30, 1 - yuk * .05, 1 + yuk * .09, 1);
      });
      tanitKare = requestAnimationFrame(adim);
      return;
    }

    if (!carpti) {
      carpti = true;
      KUM.dusen = null;
      KUM.kraterler = [{ x: t.x, y: t.y, r: t.r, e: t.e, tohum: t.tohum }];
      sonK = -1;
      if (yazi) yazi.classList.add("on");
    }

    const q = (dt - DUS) / HALKA;
    if (q >= 1) {
      if (sonK !== N) { boya(N); kumBirlestir(); }
      if (dt > DUS + HALKA + BEKLE) {
        if (yazi) yazi.classList.remove("on");
        cv.classList.remove("on");
        clearTimeout(tanitBitisTimer);
        tanitBitisTimer = setTimeout(tanitKapat, 1250);
        return;
      }
      tanitKare = requestAnimationFrame(adim);
      return;
    }

    const k = Math.floor(N * (1 - Math.pow(1 - q, 2.4)));
    if (k !== sonK) { boya(k); kumBirlestir(); }
    tanitKare = requestAnimationFrame(adim);
  };

  boya(0);
  tanitKare = requestAnimationFrame(adim);
}

function akisTanitim() {
  clearTimeout(tanitTimer);
  tanitTimer = null;
  if (AK.tanit || activeSession() || tab !== "timer") return;
  if (S.settings.mode === "pomodoro") {
    if (KUM.kapali) return;
    if (kumSeanslar(todayKey()).length > 0) {
      kumTazele(null);
      return;
    }
    kumTanitim();
    return;
  }
  if (AK.kapali) return;

  const cv = akisTuval(); if (!cv) return;
  AK.tanit = true; AK.sid = "__tanitim__"; AK.hazir = false;

  tanitTimer = setTimeout(() => {
    tanitTimer = null;
    if (!AK.tanit) return;
    const t0 = performance.now();
    AK.tohum = hash32("kertik-tanitim");
    AK.serit = akisAlan(AK.tohum, AK.w, AK.h, (AKMOD[AKSEC] || AKMOD.sade).alan);
    AK.sira = akisSira(AK.serit, AK.w, AK.tohum);
    if (performance.now() - t0 > 1400 || !AK.serit.length) { AK.kapali = true; tanitKapat(); return; }
    tanitOynat();
  }, 60);
}

function tanitOynat() {
  const top = AK.serit.length, SURE = 3400;
  const cv = el("akis"), yazi = el("tanitYazi");
  cv.classList.add("on");
  const t0 = performance.now();
  let ciz = 0;
  const yok = () => false;
  const TK = () => ({ g: AK.offCtx, serit: AK.serit, sira: AK.sira, mod: AKSEC });
  const adim = () => {
    if (!AK.tanit) return;
    const t = (performance.now() - t0) / SURE;
    if (t >= 1) {
      if (ciz < top) akisCiz(TK(), ciz, top, yok);
      akisBirlestir();
      if (yazi) yazi.classList.remove("on");
      cv.classList.remove("on");
      clearTimeout(tanitBitisTimer);
      tanitBitisTimer = setTimeout(tanitKapat, 1250);
      return;
    }
    const hedef = Math.floor(top * (1 - Math.pow(1 - t, 2.4)));
    if (hedef > ciz) { akisCiz(TK(), ciz, hedef, yok); ciz = hedef; akisBirlestir(); }
    if (yazi && (t > .3 || yazi.classList.contains("on"))) yazi.classList.add("on");
    tanitKare = requestAnimationFrame(adim);
  };
  tanitKare = requestAnimationFrame(adim);
}

/* Kullanıcı bir şeye dokunursa (örneğin başlat, not kutusu vb.) tanıtım hemen çekilir */
/* Kullanıcı bir şeye dokunursa tanıtım hemen çekilir: yolu tıkamasın. */
document.addEventListener("pointerdown", () => { if (AK.tanit || KUM.tanit) tanitKapat(); }, true);

function akisTazele() {
  const cv = el("akis"); if (!cv) return;
  if (AK.tanit) return;                          /* tanıtım sürerken karışma */
  const se = (tab === "timer") ? activeSession() : null;
  if (!se) {
    if (tab === "timer" && S.settings.mode === "pomodoro" && !KUM.kapali && kumSeanslar(todayKey()).length > 0) {
      kumTazele(null);
      return;
    }
    cv.classList.remove("on");
    return;
  }
  if (AK.kapali) { cv.classList.remove("on"); return; }
  /* pomodoro'nun sanatı kum havuzu; kronometreninki ebru (27-sanat-ayrisimi.md) */
  if (kumMu(se)) {
    if (KUM.kapali) { cv.classList.remove("on"); return; }
    if (AK.sid !== se.id) { if (!kumSeansBasladi(se)) { cv.classList.remove("on"); return; } }
    kumTazele(se);
    return;
  }
  if (AK.sid !== se.id) { akisBaslat(se); AK.ruzgarDamga = ruzgarDamga(se); }
  cv.classList.add("on");
  if (!AK.hazir) return;
  /* Difüzyon şeritlere işlenmiş; kademe değişince alan baştan boyanmalı.
     Ebruda ses ve titreşim YOK — difüzyon kendiliğinden ve sessizdir. */
  const damga = ruzgarDamga(se);
  if (damga !== AK.ruzgarDamga) { AK.ruzgarDamga = damga; AK.lastMin = -1; akisYeniden(); return; }
  const dm = Math.floor((stats(se).end - se.startedAt) / 60000);
  if (dm === AK.lastMin) return;
  AK.lastMin = dm; akisIsle();
}

let tab = "timer";

function setTab(t) {
  if (typeof toggleStandby === "function" && standbyAcik) toggleStandby(false);

<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F2EA">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cstyle%3E:root%7B--bg:%23F5F1E6;--ink:%231A1B1E;--acc:%23B4432B%7D@media(prefers-color-scheme:dark)%7B:root%7B--bg:%23131417;--ink:%23EDE8DC;--acc:%23D3785A%7D%7D.bg%7Bfill:var(--bg)%7D.ring%7Bstroke:var(--ink)%7D.tick%7Bfill:var(--acc)%7D.core%7Bfill:var(--ink)%7D%3C/style%3E%3Crect class='bg' width='512' height='512'/%3E%3Ccircle class='ring' cx='256' cy='256' r='196' fill='none' stroke-width='4.4' opacity='0.22'/%3E%3Cpath class='tick' d='M248.35,44L248.93,49.11L249.5,54.22L250.06,59.33L250.61,64.44L251.13,69.56L251.64,74.67L252.13,79.78L252.57,84.89L252.94,90L259.06,90L259.43,84.89L259.87,79.78L260.36,74.67L260.87,69.56L261.39,64.44L261.94,59.33L262.5,54.22L263.07,49.11L263.65,44Z' opacity='0.95'/%3E%3Ccircle class='core' cx='256' cy='256' r='11.9' opacity='0.55'/%3E%3C/svg%3E">
<title>Kertik</title>
<style>
/* Kertik palet v3.1 — sumi mürekkep · washi kâğıt · aizome çivit (--sanat, canlı sanat)
   · ahşap+zincifre (--is1/2/3, kayıt) · shu-iro mühür (--accent) · kintsugi altın */
:root{
  --bg:#F5F1E6; --bg2:#EBE5D6; --ink:#1A1B1E; --ink2:#3C3E44;
  --muted:#6E6A61; --faint:#A09A8C; --line:#DCD5C4; --track:#DCD5C4;
  --accent:#B4432B; --sanat:#2C5473; --cool:#7A8791; --warn:#9A7526; --ok:#4E6B4A; --danger:#9C3F33;
  --fill:#1A1B1E; --onFill:#F5F1E6;
  --segsel:#FBF9F3; --knob:#FFFDF7;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --pad:24px;
  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
  /* ahşap & zincifre — çentik/çubuk paleti (kayıt, statik) */
  --is1:#8E3F2B; --is2:#A9614A; --is3:#C08D75;
  --kopru:#8A6A4F; --mola1:#8E9AA3; --mola2:#B4BEC5;
  /* kintsugi — altın onarım */
  --altin:#C9A227; --altin-p:#EBD48A;
  /* taş — aizome çivit (canlı sanat ailesi, --sanat ile aynı kütle) */
  --tas:#22374F; --tas-golge:#131E2B; --tas-golge-o:.24;
  --tas-isik:#5B87A8; --tas-isik-o:.55; --tas-parca-o:.88;
}
:root.dark{
  --bg:#131417; --bg2:#1B1D22; --ink:#EDE8DC; --ink2:#BAB4A7;
  --muted:#8F8A7E; --faint:#65605A; --line:#292B31; --track:#292B31;
  --accent:#D3785A; --sanat:#6E9BB5; --cool:#7E8B96; --warn:#C0994C; --ok:#7C9B77; --danger:#D08A7E;
  --fill:#EDE8DC; --onFill:#131417;
  --segsel:#4A4B52; --knob:#F1EDE4;
  --is1:#B45C40; --is2:#D0785B; --is3:#E3A88C;
  --kopru:#A98A6C; --mola1:#5E6A75; --mola2:#8A959E;
  --altin:#DFBB63; --altin-p:#F2DDA0;
  /* koyu temada taş saf fildişi Ay Taşı (Shiro-Ishi): yüksek kontrast ve ay parıltısı */
  --tas:#E6E1D5; --tas-golge:#000000; --tas-golge-o:.65;
  --tas-isik:#FBF8F1; --tas-isik-o:.85; --tas-parca-o:1;
}
:root.break{ --accent:var(--cool) }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}

/* ---------- akış alanı ----------
   Arka plan katmanı: dokunmaz, tıklanmaz, hiçbir şeyi kaydırmaz. */
#akis{
  position:fixed;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none;opacity:0;
  transition:opacity 1.1s cubic-bezier(.4,0,.2,1)
}
#akis.on{opacity:1}
/* ilk açılışta bir kez görünen tek satır; yer kaplamıyor, yalnız beliriyor */
#tanitYazi{
  height:0;overflow:hidden;text-align:center;font-size:15px;color:var(--muted);
  opacity:0;pointer-events:none;
  transform:translateY(4px);
  transition:opacity .5s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.4,0,.2,1), height .45s var(--ease-spring), margin .45s var(--ease-spring);
  margin-top:0;margin-bottom:0;line-height:22px;
}
#tanitYazi.on{
  opacity:1;
  height:22px;
  margin-top:10px;
  margin-bottom:14px;
  transform:translateY(0);
}


/* ---------- seans resmi: tam ekran ---------- */
#resimKat{
  position:fixed;inset:0;z-index:60;display:none;background:var(--bg);
  animation:resimGir .32s cubic-bezier(.4,0,.2,1)
}
#resimKat.on{display:block}
@keyframes resimGir{from{opacity:0}to{opacity:1}}
#resimTuval{position:absolute;inset:0}
#resimTuval canvas{display:block}
/* Düğmeler resmin üstünde duruyor; imzayı ve deseni okunur bırakmak için
   altta yumuşak bir perde var. Perde resme işlenmiyor, sadece ekranda. */
#resimUst{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;gap:10px;align-items:flex-end;justify-content:center;
  padding:52px var(--pad) calc(var(--safe-b) + 26px);
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 72%)
}
#resimDurum{
  position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 88px);z-index:3;
  text-align:center;font-size:14px;color:var(--muted);pointer-events:none
}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:17px; line-height:1.5;
  transition:background .55s cubic-bezier(.4,0,.2,1), color .55s cubic-bezier(.4,0,.2,1);
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  -webkit-font-smoothing:antialiased;
}
button{cursor:pointer;font-family:inherit}
#app{
  display:flex;flex-direction:column;height:100%;padding-top:var(--safe-t);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  position:relative;z-index:1
}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:0 var(--pad) 40px}
.page.on{display:block}

/* ---------- alt gezinti ---------- */
nav{
  display:flex;border-top:1px solid var(--line);background:var(--bg);
  padding-bottom:var(--safe-b);flex-shrink:0;
  max-height:200px;overflow:hidden;
  transition:background .55s,
             max-height .5s cubic-bezier(.4,0,.2,1),
             opacity .38s cubic-bezier(.4,0,.2,1),
             padding-bottom .5s cubic-bezier(.4,0,.2,1),
             border-top-color .5s
}

/* ---------- odak: seans sürerken gezinti çekilir ----------
   Kilit DEĞİL. Kullanıcıyı tutmuyoruz, uygulama kendisi çekiliyor.
   Geri getirmek için alttaki çentiğe dokun ya da yukarı kaydır. */
html.odak nav{
  max-height:0;opacity:0;padding-bottom:0;
  pointer-events:none;border-top-color:transparent
}
#centik{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--safe-b) + 26px);
  display:none;align-items:flex-end;justify-content:center;
  padding-bottom:calc(var(--safe-b) + 9px);
  background:none;border:0;
  opacity:0;transition:opacity .5s cubic-bezier(.4,0,.2,1) .25s
}
html.odak #centik{display:flex;opacity:1}
#centik i{
  display:block;width:20px;height:2px;border-radius:2px;
  background:var(--muted);opacity:.5;transition:opacity .3s,width .3s
}
#centik:active i{opacity:.9;width:26px}
nav button{
  flex:1;background:none;border:0;color:var(--muted);font-size:15.5px;font-weight:450;
  letter-spacing:.005em;padding:15px 4px 17px;transition:color .3s
}
nav button.on{color:var(--ink);font-weight:600}

/* ---------- sayaç ---------- */
#timerPage{display:none;flex-direction:column;align-items:center;padding:0 var(--pad)}
#timerPage.on{display:flex}

.modes{padding:10px 0 0;flex-shrink:0}
.modes .seg{display:flex;background:var(--track);border-radius:999px;padding:3px;position:relative;transition:opacity .3s}
.modes .seg.locked{opacity:0;pointer-events:none}
.modes button{
  border:0;background:none;color:var(--muted);font-size:15px;font-weight:500;
  padding:9px clamp(14px,5.5vw,24px);border-radius:999px;position:relative;z-index:2;
  transition:color .35s;white-space:nowrap
}
.modes button.on{color:var(--onFill)}
.modes .knob{
  position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--fill);z-index:1;
  transition:left .42s var(--ease-spring),width .42s var(--ease-spring)
}

.tcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:14px}
.tdial,.tside{display:flex;flex-direction:column;align-items:center;width:100%}
.eyebrow-row{
  display:flex;align-items:center;justify-content:center;position:relative;width:100%;height:22px;margin-bottom:20px;
}
.eyebrow{
  font-size:11.5px;letter-spacing:.08em;color:var(--muted);
  font-weight:500;height:17px;
  transition:color .55s, opacity .3s ease, transform .35s var(--ease-spring);
}
.eyebrow.live{color:var(--accent)}
.btn-standby{
  position:absolute;right:clamp(8px,5vw,24px);background:none;border:none;padding:6px;border-radius:999px;
  color:var(--faint);display:flex;align-items:center;justify-content:center;opacity:.55;cursor:pointer;
  transition:opacity .25s ease,color .25s ease,transform .2s ease;
}
.btn-standby:hover{opacity:1;color:var(--ink)}
.btn-standby:active{transform:scale(.92)}

.dialwrap{position:relative;width:min(330px,84vw,42vh);aspect-ratio:1;display:grid;place-items:center}
.dialwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* Kadran Morfoloji Katmanları */
.dial-layer{
  transform-origin:155px 155px;
  transition:opacity .45s var(--ease-spring), transform .48s var(--ease-spring), filter .45s ease;
}
.dial-layer.hidden{
  opacity:0;pointer-events:none;
  transform:scale(0.92);
  filter:blur(2px);
}
.dial-layer.visible{
  opacity:1;pointer-events:auto;
  transform:scale(1);
  filter:blur(0px);
}

.dcenter{
  position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;
  justify-content:center;width:72%;height:80px;pointer-events:none;
}
#clock{
  font-size:clamp(42px,13vw,50px);font-weight:250;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);
  transition:color .55s, opacity .35s ease, transform .45s var(--ease-spring), filter .35s ease, letter-spacing .45s var(--ease-spring);
}
#clock.long{font-size:clamp(34px,10.5vw,40px)}
#clock .over{color:var(--accent)}
#capt{
  font-size:13px;letter-spacing:.02em;color:var(--muted);text-align:center;
  margin-top:9px;min-height:18px;line-height:18px;
  transition:opacity .35s ease, transform .45s var(--ease-spring), filter .35s ease;
}
.head-dot{animation:blip 3.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
.impact-shake{animation:impactShake .24s cubic-bezier(.36,.07,.19,.97) both}
@keyframes impactShake{0%,100%{transform:translate(0,0) scale(1)}20%{transform:translate(-2.5px,1.5px) scale(.995)}40%{transform:translate(2px,-1.5px) scale(1.002)}60%{transform:translate(-1px,1px) scale(.998)}80%{transform:translate(1px,-.5px) scale(1)}}

#noteShow{margin-top:20px;font-size:17px;color:var(--ink2);min-height:24px;text-align:center;transition:opacity .25s ease, transform .35s var(--ease-spring)}
#subLine{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px;text-align:center;transition:opacity .25s ease, transform .35s var(--ease-spring)}

/* boş satır yer kaplamasın — küçük ekranda o boşluk kadranın hakkı */
#noteShow:empty,#subLine:empty{min-height:0;margin-top:0}
#subLine b{color:var(--ink2);font-weight:500}

.durs-wrapper{
  overflow:hidden;
  transition:max-height .45s var(--ease-spring), opacity .35s ease, transform .45s var(--ease-spring);
  width:100%;display:flex;justify-content:center;
}
.durs-wrapper.closed{
  max-height:0;opacity:0;transform:translateY(-8px) scale(0.96);pointer-events:none;
}
.durs-wrapper.open{
  max-height:70px;opacity:1;transform:translateY(0) scale(1);pointer-events:auto;
}

.durs{display:flex;gap:9px;margin-top:20px;justify-content:center}
.durs button{
  border:1px solid var(--line);background:none;color:var(--muted);
  border-radius:999px;padding:10px 18px;font-size:15px;transition:.25s
}
.durs button.on{border-color:var(--ink);color:var(--ink)}

.controls{display:flex;gap:12px;margin:32px 0 34px;justify-content:center;align-items:center}
.btn{
  border:1px solid var(--line);background:transparent;color:var(--ink2);
  padding:15px 28px;border-radius:999px;font-size:17px;font-weight:450;
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),background .3s,color .3s,border-color .3s
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--fill);border-color:transparent;color:var(--onFill);font-weight:550;padding:17px 42px}
.btn.big{font-size:19px;padding:20px 58px}
.btn.ghost{border-color:transparent;color:var(--muted);padding:15px 18px}

/* ---------- STANDBY ZEN (Masaüstü Odak Ekranı) ---------- */
.standby-layer{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:transparent;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .55s cubic-bezier(.16,1,.3,1),visibility .55s;user-select:none;-webkit-user-select:none;
}
html.standby-active .standby-layer{
  opacity:1;visibility:visible;pointer-events:auto;cursor:pointer;
}
html.standby-active #app{
  opacity:0;pointer-events:none;transition:opacity .45s ease;
}
html.standby-active #centik{
  display:none !important;
}
.standby-content{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  transform:scale(.95);transition:transform .55s cubic-bezier(.16,1,.3,1);
}
html.standby-active .standby-content{transform:scale(1)}
.standby-status{
  font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;
  transition:color .4s ease;
}
html.break .standby-status{color:var(--cool)}
.standby-clock{
  font-size:clamp(64px,19vw,128px);font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;
  color:var(--ink);transition:color .4s ease;
}
.standby-clock.over{color:var(--accent)}
.standby-sub{
  font-size:clamp(14px,4.2vw,19px);color:var(--muted);font-weight:400;margin-top:14px;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
.standby-task{
  font-size:14.5px;color:var(--ink2);margin-top:8px;max-width:82vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.standby-task:empty{display:none}
.standby-hint{
  position:absolute;bottom:calc(var(--safe-b,16px) + 20px);font-size:12px;letter-spacing:.06em;color:var(--faint);
  opacity:.45;transition:opacity .3s ease;
}
@media (orientation: landscape) and (max-height: 520px){
  .standby-content{padding:10px}
  .standby-clock{font-size:clamp(52px,17vh,94px)}
  .standby-status{margin-bottom:6px;font-size:11px}
  .standby-sub{margin-top:8px;font-size:13px}
  .standby-hint{bottom:10px}
}

/* ---------- ortak ---------- */
h2{
  font-size:13px;letter-spacing:.04em;
  color:var(--muted);font-weight:500;margin:34px 0 11px
}
.pagetitle{font-size:34px;font-weight:400;letter-spacing:-.032em;margin:22px 0 4px;line-height:1.15}
.pagesub{font-size:15px;color:var(--muted);margin-bottom:22px}
.card{border-bottom:1px solid var(--line);padding:17px 2px;transition:border-color .55s}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.muted{color:var(--muted);font-size:14.5px}
.tiny{color:var(--muted);font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.pill{
  display:inline-block;border:1px solid var(--line);border-radius:999px;
  padding:10px 17px;font-size:14.5px;color:var(--muted);margin:5px 7px 5px 0;background:none
}
.pill.sel{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);font-size:16.5px;text-align:center;padding:76px 12px;line-height:1.7}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 6px}
.dayhead .d{font-size:18px}
.dayhead .t{font-size:13.5px;color:var(--muted);text-align:right;padding-left:14px}
.timeline{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;display:none}
.timeline.on{display:block}
.ev{display:flex;gap:14px;font-size:14.5px;color:var(--muted);padding:4px 0}
.ev .h{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:50px}
.ev.b .h{color:var(--accent)}
/* ---------- çubuk ve duvar ---------- */
@keyframes carve{ to{ stroke-dashoffset:0 } }
.carve{ stroke-dasharray:1;stroke-dashoffset:1;
  animation:carve .42s cubic-bezier(.25,.9,.3,1) forwards }
.cubukwrap{display:grid;place-items:center;margin:4px 0 14px}
.cubukwrap svg{overflow:visible;max-width:100%}
/* künye — kalasın dibine kazınmış tek satır. Kutu yok, ikon yok, renk kodu
   yok: doğru/yanlış ayrımı yeşil/kırmızıyla değil işaretle (▲▼○) yapılıyor. */
.kunye{display:flex;justify-content:center;align-items:baseline;gap:10px;
  margin:-6px 0 14px;font-size:13.5px;color:var(--kopru);letter-spacing:.01em}
.kunye .isaret{font-size:12px;letter-spacing:.1em}
/* görev satırının dibindeki künye: aynı malzeme, daha alçak sesle.
   Sola yaslı, çizgisiz, kutusuz — 31-seans-ciktisi.md §3'ün kuralları aynen. */
.task .kunye{justify-content:flex-start;margin:5px 0 0;font-size:12.5px;gap:9px}
.task .kunye .isaret{font-size:11.5px}
.task .kunye .nis{color:var(--muted)}
/* seans sonu defteri — iki (veya daha çok) işli seansta künyenin yerini
   alır: iş adı + dilim süresi + o dilimin künyesi, alt alta.
   35-seans-icinde-is-degisimi.md §7. Kutu yok, çubuk yok, renk yok. */
.defter{display:flex;flex-direction:column;gap:8px;margin:-4px 0 16px;padding:4px 0}
.defterSatir{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;
  gap:10px 14px;font-size:13.5px;color:var(--kopru);line-height:1.35}
.defterSatir .ad{min-width:0;text-align:left;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-weight:500}
.defterSatir .sure{flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:.02em}
.dkunye{flex-shrink:0;font-size:12px;letter-spacing:.02em;text-align:right;white-space:nowrap}
.dkunye .isaret{font-size:11px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.dkunye.empty{display:inline-block;min-width:4px}
/* başlat ekranındaki iş seçimi — görev yoksa hiç görünmez (anne yolu) */
/* Başlat ekranındaki iş bağı TEK SATIR. Çip şeridi denendi ve bırakıldı:
   üç işte ekranın dikey ritmi bozuluyor, beşte sayaç ekranı çip bulutuna
   dönüyordu — CLAUDE.md'nin "stabil görünsün" kuralının ihlali. Şimdi kaç iş
   olursa olsun buradaki yükseklik değişmiyor; liste çağrıldığında geliyor. */
.gorevsec{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.3;
  min-height:26px;text-align:center;width:100%;align-self:stretch;display:flex;justify-content:center;align-items:center}
.gorevsec button{background:transparent;border:1px solid transparent;padding:3px 10px;font:inherit;
  color:var(--muted);cursor:pointer;max-width:92%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  gap:4px;border-radius:14px;transition:background .25s var(--ease-soft),border-color .25s var(--ease-soft),color .25s var(--ease-soft),transform .15s var(--ease-spring);
  -webkit-tap-highlight-color:transparent}
.gorevsec button:active{transform:scale(0.96);opacity:.85}
.gorevsec button.on{color:var(--ink2);background:var(--bg2);border-color:var(--line);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,0.02)}
:root.dark .gorevsec button.on{color:var(--ink);background:var(--bg2);border-color:var(--line);box-shadow:none}
.gorevsec .gs-title{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gorevsec .gs-ek{color:var(--kopru);font-weight:400;opacity:.9;font-size:12px}
.gorevsec .gs-arrow{font-size:13px;line-height:1;color:var(--muted);opacity:.7;font-weight:400;margin-left:3px;transform:translateY(-0.5px)}
.gorevsec .gs-close{font-size:14px;line-height:1;color:var(--muted);opacity:.6;margin-left:3px;transition:opacity .2s ease}
.gorevsec button:hover .gs-close{opacity:1;color:var(--accent)}
.wall{
  border:1px solid var(--line);border-radius:20px;
  background:rgba(235,229,214,.38);
  padding:18px 14px 14px;margin-bottom:16px;transition:border-color .55s,background .55s;
  overflow:hidden;position:relative;
}
:root.dark .wall{background:rgba(27,29,34,.50)}
.wall + .wall{margin-top:16px}
.walltitle{font-size:11px;color:var(--muted);margin:0 0 12px 2px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;opacity:.8}
.wallgrid{
  display:flex;gap:8px;align-items:flex-end;overflow-x:auto;
  padding:6px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.wallgrid::-webkit-scrollbar{display:none}
/* kaydırma ipucu — 30 gün yatay kayıyor, kesik kenar bunu görünür kılar.
   Yalnız kayacak yön varsa belirir (duvarOlcekle scrollLeft'e göre açar/kapar). */
.wall::before,.wall::after{
  content:"";position:absolute;top:20px;bottom:16px;width:26px;
  pointer-events:none;z-index:2;opacity:0;transition:opacity .35s ease;
}
.wall::before{left:0;background:linear-gradient(to right, var(--bg2), transparent)}
.wall::after{right:0;background:linear-gradient(to left, var(--bg2), transparent)}
.wall.can-scroll-left::before{opacity:1}
.wall.can-scroll-right::after{opacity:1}
[dir="rtl"] .wall::before{left:auto;right:0;background:linear-gradient(to left, var(--bg2), transparent)}
[dir="rtl"] .wall::after{right:auto;left:0;background:linear-gradient(to right, var(--bg2), transparent)}
.day{
  position:relative;display:flex;flex-direction:column;align-items:center;
  gap:8px;flex:0 0 54px;min-width:54px;cursor:pointer;
}
.day .plot{
  height:var(--wallplot,96px);width:100%;
  display:flex;align-items:flex-end;justify-content:center;
}
.wall-tas .day .plot{height:56px}
.day svg{overflow:visible;display:block}
.day::after{
  content:"";position:absolute;left:-4px;right:-4px;bottom:20px;height:1.5px;
  background:var(--line);opacity:.8;pointer-events:none;
}
.day.today::after{
  background:var(--accent);opacity:1;height:2.5px;
}
.day.void .plot::before{
  content:"";width:16px;height:1.5px;border-radius:999px;background:var(--line);opacity:.6;margin-bottom:3px;
}
.day .d{
  font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;
  line-height:1;height:13px;font-weight:500;
}
.day.today .d{color:var(--accent);font-weight:800;font-size:13px}
.legend{
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  margin-top:14px;font-size:11.5px;color:var(--muted);opacity:.82;letter-spacing:.01em;
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{
  display:inline-block;width:12px;height:0;border-top:2px solid var(--accent);
  border-radius:1px;vertical-align:middle;margin-right:0;
}
.legend i.b{border-top-color:var(--cool)}
.legend i.u{border-top-style:dashed;opacity:.7}

.editrow{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.tgroup{display:flex;align-items:center;gap:8px;white-space:nowrap}
.olcu-soru-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 20px;width:100%}
.olcu-col{display:flex;flex-direction:column;align-items:center;gap:7px}
.olcu-lbl{font-size:12.5px;color:var(--muted);font-weight:450;letter-spacing:-.01em}
.olcu-inp{width:100%;text-align:center;padding:12px 0;font-size:18px;font-weight:500;border-radius:14px}
input[type=time],input[type=text],input[type=number],textarea{
  background:var(--bg2);border:1px solid var(--line);color:var(--ink);
  border-radius:14px;padding:12px 14px;font-family:inherit;font-size:17px;
  -webkit-user-select:text;user-select:text
}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.sbtn{
  background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:11px 18px;font-size:15px;transition:.2s
}
.sbtn:active{transform:scale(.96)}
.sbtn.danger{color:var(--danger);border-color:var(--danger)}

/* ---------- görevler ---------- */
.taskadd{
  display:flex;align-items:center;gap:12px;margin:16px 0 10px;padding:0 2px;
  border-bottom:1.5px solid var(--line);transition:border-color .3s var(--ease-soft);
}
.taskadd:focus-within{border-bottom-color:var(--accent)}
.taskadd input{
  flex:1;background:transparent !important;border:none !important;border-radius:0 !important;
  padding:10px 0 !important;font-family:inherit;font-size:16.5px;color:var(--ink);outline:none !important;
  box-shadow:none !important;
}
.taskadd input::placeholder{color:var(--muted);opacity:.70;font-weight:350}
#taskAdd{
  background:transparent !important;color:var(--accent) !important;border:1px solid var(--line) !important;
  border-radius:999px;padding:7px 18px !important;font-size:14px;font-weight:500;
  letter-spacing:.02em;transition:all .2s var(--ease-soft);cursor:pointer;flex-shrink:0;
}
#taskAdd:active{
  background:var(--accent) !important;color:var(--onFill) !important;border-color:var(--accent) !important;
  transform:scale(.95);
}
#tasksPage .empty{
  padding:72px 16px 60px;display:flex;flex-direction:column;align-items:center;
  gap:12px;color:var(--muted);line-height:1.5;text-align:center;
}
#tasksPage .empty-icon{
  width:36px;height:36px;opacity:.35;color:var(--muted);margin-bottom:2px;
}
#tasksPage .empty-lead{
  font-size:16.5px;font-weight:450;color:var(--ink2);letter-spacing:-.01em;
}
#tasksPage .empty-sub{
  font-size:13.5px;color:var(--muted);max-width:260px;opacity:.82;line-height:1.5;
}
.session-notes-box{
  margin:4px auto 0;
  width:100%;
  max-width:280px;
  display:none;
  flex-direction:column;
  align-items:center;
  opacity:0.65;
  transition:opacity .3s ease;
}
.session-notes-box:focus-within{
  opacity:1;
}
.session-note-input-row{
  width:100%;
  display:flex;
  justify-content:center;
}
.session-note-input-row input{
  width:100%;
  max-width:220px;
  background:transparent;
  border:none;
  border-bottom:1px dashed var(--line);
  padding:4px 6px;
  font-size:13px;
  color:var(--ink2);
  text-align:center;
  outline:none;
  font-family:inherit;
  transition:border-color .25s,color .25s;
}
.session-note-input-row input::placeholder{
  color:var(--muted);
  font-size:12px;
  font-weight:350;
  opacity:0.8;
}
.session-note-input-row input:focus{
  border-bottom-style:solid;
  border-bottom-color:var(--accent);
}
.task{display:flex;align-items:flex-start;gap:15px;padding:17px 2px;border-bottom:1px solid var(--line)}
.task .tt{flex:1;font-size:17px;line-height:1.4}
.task.bitti .tt{color:var(--muted)}
.task.iptal .tt{text-decoration:line-through;color:var(--muted)}
.task.olmadi .tt{color:var(--muted)}
/* kayıt sekmesindeki geçmiş gün görevleri — salt okunur, görevler panelinden sessiz */
.logtasks{margin:4px 0 2px;display:flex;flex-direction:column;gap:8px}
.logtask{display:flex;align-items:baseline;gap:11px;font-size:14.5px;line-height:1.45;color:var(--muted)}
.logtask .g{width:14px;flex:none;text-align:center;font-size:12.5px;opacity:.9}
.logtask.bitti .g{color:var(--ok)}
.logtask.tasindi .g{color:var(--accent)}
.logtask.iptal .n{text-decoration:line-through}
.logtask .rep{font-size:11px;padding:0 5px;margin-left:6px;vertical-align:0}
/* geçmiş gün satırındaki ölçü: künyeyle aynı ahşap ton, kutusuz, salt okunur */
.logtask .lk{color:var(--kopru);font-size:13px;white-space:nowrap}
.mark{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--onFill);background:none;line-height:1;padding:0
}
.mark.bitti{background:var(--ok);border-color:var(--ok)}
.mark.olmadi{background:var(--faint);border-color:var(--faint)}
.mark.tasindi{border-color:var(--accent);color:var(--accent);font-size:13px}
.mark.iptal{border-color:var(--faint);color:var(--muted)}
.mark.yapiliyor{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--accent)}
.rep{
  font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:1px
}

/* ---------- ayarlar ---------- */
.grp{background:var(--bg2);border-radius:20px;padding:0 18px;transition:background .55s}
.set{padding:19px 0;border-bottom:1px solid var(--line);transition:border-color .55s}
.grp .set:last-child{border-bottom:0}
.set .lbl{font-size:17px;line-height:1.35}
.set .lbl small{display:block;color:var(--muted);font-size:13.5px;margin-top:5px;line-height:1.5}
.set.side{display:flex;justify-content:space-between;align-items:center;gap:18px}
.set.side .lbl{flex:1}
.seg3{display:flex;background:var(--track);border-radius:13px;padding:3px;margin-top:14px;transition:background .55s}
.seg3 button{
  flex:1;border:0;background:none;color:var(--muted);font-size:clamp(12.5px,3.6vw,14.5px);
  padding:10px 2px;border-radius:10px;transition:.22s;white-space:nowrap
}
.seg3 button.on{background:var(--segsel);color:var(--ink);font-weight:550;box-shadow:0 1px 2px rgba(0,0,0,.10)}
.sidebtns{display:flex;gap:8px;flex-shrink:0}

/* ---------- sheet ---------- */
#sheet{
  position:fixed;inset:0;background:rgba(19,20,23,.28);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-end;z-index:40;animation:fade .25s ease
}
#sheet.on{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheetbox{
  background:var(--bg);width:100%;border-radius:28px 28px 0 0;
  padding:14px 24px calc(28px + var(--safe-b));
  max-height:88vh;overflow-y:auto;animation:up .34s cubic-bezier(.2,.8,.3,1)
}
@keyframes up{from{transform:translateY(34px)}to{transform:translateY(0)}}
.sheetbox::before{
  content:"";display:block;width:38px;height:4px;border-radius:999px;
  background:var(--track);margin:0 auto 18px
}
.sheetbox h3{margin:0 0 8px;font-size:23px;font-weight:450;letter-spacing:-.02em;line-height:1.25}
.sheetbox p{margin:0 0 20px;color:var(--muted);font-size:15.5px;line-height:1.55}
.opt{
  display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);
  color:var(--ink);border-radius:15px;padding:17px 18px;margin-bottom:10px;font-size:16.5px;
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),border-color .25s
}
.opt:active{transform:scale(.985)}
.opt.acc{border-color:var(--accent);color:var(--accent)}
.opt.dim{color:var(--muted)}
.opt.del{color:var(--danger)}
.optgap{margin-top:16px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);gap:16px}
.setrow:last-of-type{border-bottom:0}
.setrow .lbl{font-size:17px}
.setrow .lbl small{display:block;color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.5}
.sw{width:51px;height:31px;border-radius:999px;background:var(--track);border:0;position:relative;flex-shrink:0;transition:background .25s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--knob);transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}

/* --- sağdan-sola diller (Arapça) ---
   Yazı aynalanır, ÖLÇÜ aynalanmaz. Kadran, çubuk, kronometre ve saat
   aralıkları kendi yönünü korur: bunlar cümle değil, gösterge. Düzenin
   geri kalanı mantıksal özelliklerle zaten kendiliğinden dönüyor. */
[dir="rtl"] #clock,
[dir="rtl"] .cubukwrap,
[dir="rtl"] .dialwrap,
[dir="rtl"] input[type="time"],
[dir="rtl"] input[type="number"],
[dir="rtl"] textarea{direction:ltr}
[dir="rtl"] .wall .legend i{transform:scaleX(-1)}
/* Süre satırları Arapça okunacak: sayı+birim doğal yönünde kalır.
   Yalnız saat damgaları yalıtılır (bkz. aralik / saatY). */
.seg2{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg2 button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:9px 15px;font-size:14.5px}
.seg2 button.on{border-color:var(--accent);color:var(--accent)}
.hint{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:22px}

/* ---------- apple tarzı kart ve künye ---------- */
.apple-card{
  background:var(--bg2);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;margin:18px 0;transition:border-color .55s,background .55s
}
.apple-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--line);gap:14px
}
.apple-row:last-child{border-bottom:0}
.apple-row .k{font-size:15.5px;font-weight:450;color:var(--ink)}
.apple-row .v{font-size:15px;color:var(--muted);text-align:right}
.apple-row.ithaf .v{
  font-style:italic;color:var(--accent);font-weight:450;
  font-family:-apple-system,BlinkMacSystemFont,"New York",Georgia,serif;
}
.apple-link{
  display:flex;justify-content:space-between;align-items:center;
  text-decoration:none;color:var(--ink);width:100%;
}
.apple-link .chev{font-size:18px;color:var(--faint);font-weight:300;margin-left:8px}
.apple-btn-main{
  display:block;width:100%;background:var(--fill);color:var(--onFill);
  border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:550;
  text-align:center;transition:transform .16s cubic-bezier(.3,1.4,.5,1),opacity .2s;
  margin-top:6px;cursor:pointer;
}
.apple-btn-main:active{transform:scale(.98);opacity:.9}

/* ============================================================
   EKRANA UYUM
   Küçük telefon, Pixel gibi uzun ekran, katlanabilir (açık/kapalı),
   tablet ve yatay mod. Katlanma anında yeniden ölçülür (resize kancası).
   ============================================================ */

/* --- dar telefonlar / kapalı katlanabilir kapak ekranı --- */
@media (max-width:360px){
  :root{--pad:18px}
  body{font-size:16px}
  .pagetitle{font-size:30px}
  .task .tt,.set .lbl,.setrow .lbl{font-size:16px}
  .btn.big{font-size:18px;padding:18px 42px}
  .sbtn{padding:10px 14px;font-size:14px}
  nav button{font-size:14.5px}
}

/* --- alçak ekranlar: dikey ritmi sıkıştır, kaydırmaya bırakma --- */
@media (max-height:680px){
  .tcenter{gap:8px}
  .eyebrow{margin-bottom:12px}
  #noteShow{margin-top:12px}
  .durs{margin-top:14px}
  .controls{margin:20px 0 22px}
  .modes{padding:6px 0 0}
}

/* --- yatay mod ve açık katlanabilirin yatayı: sayaç iki sütun --- */
@media (orientation:landscape) and (max-height:620px){
  #timerPage.on{padding-bottom:6px}
  .modes{padding:6px 0 0}
  .eyebrow{margin-bottom:10px}
  .tcenter{flex-direction:row;justify-content:center;align-items:center;gap:clamp(20px,5vw,52px)}
  .tdial,.tside{width:auto}
  .tside{min-width:min(300px,42vw);max-width:340px}
  .dialwrap{width:min(300px,40vw,66vh)}
  .controls{margin:22px 0 0}
  #noteShow:empty,#subLine:empty{min-height:0}
}

/* --- geniş ekran: açık katlanabilir, tablet --- */
@media (min-width:600px){
  .page{
    padding-left:max(var(--pad),calc((100% - 520px)/2));
    padding-right:max(var(--pad),calc((100% - 520px)/2))
  }
  #timerPage{padding-left:var(--pad);padding-right:var(--pad)}
  nav{justify-content:center}
  nav button{flex:0 1 150px}
  .sheetbox{max-width:600px;margin:0 auto;border-radius:28px 28px 0 0}
  .taskadd input{max-width:none}
}

/* --- çok geniş: içeriği ortada tut, kenarlara yayma --- */
@media (min-width:900px){
  .page{
    padding-left:max(var(--pad),calc((100% - 560px)/2));
    padding-right:max(var(--pad),calc((100% - 560px)/2))
  }
}
</style>
</head>
<body>
<canvas id="akis"></canvas>

<!-- STANDBY ZEN (Masaüstü Odak Modu) -->
<div id="standbyZen" class="standby-layer" aria-hidden="true">
  <div class="standby-content">
    <div class="standby-status" id="sbStatus">ÇALIŞIYOR</div>
    <div class="standby-clock" id="sbClock">00:00</div>
    <div class="standby-sub" id="sbSub"></div>
    <div class="standby-task" id="sbTask"></div>
  </div>
  <div class="standby-hint" id="sbHint">çıkmak için dokun</div>
</div>

<div id="app">
  <!-- SAYAÇ -->
  <section id="timerPage" class="page on">
    <div class="modes">
      <div class="seg" id="modeSeg">
        <div class="knob" id="knob"></div>
        <button data-m="stopwatch" class="on">kronometre</button>
        <button data-m="pomodoro">pomodoro</button>
      </div>
    </div>

    <div class="tcenter">
      <div class="tdial">
        <div class="eyebrow-row">
          <div class="eyebrow" id="stateLabel">hazır</div>
          <button id="btnStandby" class="btn-standby" aria-label="Masaüstü Odak Modu" title="Masaüstü Odak Modu">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
            </svg>
          </button>
        </div>
        <div class="dialwrap">
          <svg id="dial" viewBox="0 0 310 310">
            <g id="layerStopwatch" class="dial-layer hidden"></g>
            <g id="layerPomodoro" class="dial-layer hidden"></g>
          </svg>
          <div class="dcenter">
            <div id="clock">00:00</div>
            <div id="capt"></div>
          </div>
        </div>
      </div>
      <div class="tside">
        <div id="noteShow"></div>
        <div class="gorevsec" id="gorevSec"></div>
        <div id="subLine"></div>
        <div id="tanitYazi">çalıştıkça bir şeyler oluyor</div>
        <div class="durs-wrapper" id="dursWrap">
          <div class="durs" id="durs"></div>
        </div>
        <div class="controls" id="controls"></div>

        <!-- Seans İçi Silik Karalama (Aşağıda, Ekranda Yığılmayan Posta Kutusu) -->
        <div id="sessionNotesBox" class="session-notes-box">
          <div class="session-note-input-row">
            <input type="text" id="sessionNoteInput" placeholder="aklına bir şey gelirse yaz…" maxlength="240" autocomplete="off">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- GÖREVLER -->
  <section id="tasksPage" class="page">
    <div class="pagetitle" id="taskHead">bugün</div>
    <div class="pagesub" id="taskSub"></div>
    <div class="taskadd">
      <input type="text" id="taskInput" placeholder="ne yapacaksın?" maxlength="90" autocomplete="off">
      <button class="sbtn" id="taskAdd">ekle</button>
    </div>
    <div id="taskList"></div>
    <div id="carryBox"></div>
  </section>

  <!-- KAYIT -->
  <section id="logPage" class="page">

/* ============================================================
   DİL — motor
   Tek giriş noktası: soz("anahtar", {yer: tutucu}).
   Ekranda görünen hiçbir metin koda gömülü değil.
   Etkin dil = ayarlardaki seçim; "auto" ise cihazın dili.
   ============================================================ */
let DIL = "en";
let COGUL = null, SAYIB = null, SAATB = null, TARIHB = null, GORECELI = null;

/* "pt_BR", "zh-Hant-TW", "de-AT" gibi her etiketi elimizdeki dillerden
   birine indirger; karşılığı yoksa null. */
function dilEsle(ham) {
  if (!ham) return null;
  const s = String(ham).replace(/_/g, "-");
  if (SOZLUK[s]) return s;
  const p = s.toLowerCase().split("-"), ana = p[0];
  if (ana === "zh") {
    /* Çince'de belirleyici olan bölge değil yazı sistemi. */
    if (p.indexOf("hant") >= 0 || p.indexOf("tw") >= 0 || p.indexOf("hk") >= 0 || p.indexOf("mo") >= 0) return "zh-Hant";
    return "zh-Hans";
  }
  if (ana === "pt") return "pt-BR";
  for (const k in SOZLUK) if (k.toLowerCase().split("-")[0] === ana) return k;
  return null;
}

function dilSec(istek) {
  if (istek && istek !== "auto") { const k = dilEsle(istek); if (k) return k; }
  const liste = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language];
  for (const x of liste) { const k = dilEsle(x); if (k) return k; }
  return "en";
}

/* Biçimlendiriciler dil başına bir kez kurulur — her çağrıda Intl nesnesi
   yaratmak sayaç ekranında saniyede bir dönen döngüde pahalıya geliyor.
   Rakamlar her dilde latin tutuluyor: kadrandaki saat ASCII, karışığı çirkin. */
function dilKur() {
  DIL = dilSec(S && S.settings ? S.settings.lang : "auto");
  const b = DIL + "-u-nu-latn";
  try { COGUL = new Intl.PluralRules(DIL); } catch (e) { COGUL = null; }
  try { SAYIB = new Intl.NumberFormat(b, { maximumFractionDigits: 1 }); } catch (e) { SAYIB = null; }
  try { SAATB = new Intl.DateTimeFormat(b, { hour: "numeric", minute: "2-digit" }); } catch (e) { SAATB = null; }
  try { TARIHB = new Intl.DateTimeFormat(b, { day: "numeric", month: "long", weekday: "long" }); } catch (e) { TARIHB = null; }
  try { GORECELI = new Intl.RelativeTimeFormat(DIL, { numeric: "auto" }); } catch (e) { GORECELI = null; }
}

function soz(anahtar, p) {
  let v = SOZLUK[DIL] && SOZLUK[DIL][anahtar];
  if (v === undefined) v = SOZLUK.en[anahtar];
  if (v === undefined) v = SOZLUK.tr[anahtar];
  if (v === undefined) return anahtar;
  if (typeof v === "object") {
    let kat = "other";
    try { kat = COGUL.select(Number(p && p.n)); } catch (e) {}
    v = v[kat] || v.other;
  }
  if (!p) return v;
  return v.replace(/\{(\w+)\}/g, (m, a) => (p[a] === undefined ? m : p[a]));
}

/* ---------------- zaman yardımcıları ---------------- */
const pad = n => String(n).padStart(2, "0");
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayKey() { return dayKey(now()); }
/* Ham 24 saat biçimi: <input type="time"> ve dosya adları bunu ister. */
function hhmmHam(ts) { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
/* Ekranda görünen saat: dilin kendi biçimi (12 ya da 24 saat). */
function hhmm(ts) { return SAATB ? SAATB.format(new Date(ts)) : hhmmHam(ts); }
/* Sağdan-sola dilde "3:31 م" gibi bir damga, cümlenin geri kalanıyla
   karışıp parçalanıyor. Her damga kendi yalıtımına alınır. */
function saatY(ts) { return yon(hhmm(ts)); }
/* İki saat arası: uçlar da, ikisinin sırası da yerinde kalsın diye
   iç içe iki yalıtım gerekiyor. Soldan-sağda hiçbir işaret eklenmez. */
function aralik(a, b) { return yon(saatY(a) + " – " + saatY(b)); }
function clockStr(ms) {
  if (ms < 0) ms = 0;
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
}
function human(ms) {
  const dk = Math.round(ms / 60000), h = Math.floor(dk / 60), m = dk % 60;
  if (h && m) return soz("sure_sd", { s: h, d: m });
  if (h) return soz("sure_s", { s: h });
  return soz("sure_d", { d: m });
}
const AYLAR = ["ocak","şubat","mart","nisan","mayıs","haziran","temmuz","ağustos","eylül","ekim","kasım","aralık"];
const GUNLER = ["pazar","pazartesi","salı","çarşamba","perşembe","cuma","cumartesi"];
function fullDate(k) {
  const [Y, M, D] = k.split("-").map(Number);
  const t = new Date(Y, M - 1, D);
  if (!TARIHB) return k;
  const s = TARIHB.format(t);
  /* Türkçe tasarım dili küçük harf; Intl büyük harfle veriyor. Diğer
     dillerde büyük harf gerekli (Almanca'da ad, İngilizce'de gün adı). */
  return DIL === "tr" ? s.toLocaleLowerCase("tr") : s;
}
function dayLabel(k) {
  if (GORECELI) {
    if (k === todayKey()) return GORECELI.format(0, "day");
    if (k === dayKey(now() - 864e5)) return GORECELI.format(-1, "day");
  }
  return fullDate(k);
}
function timeToTs(v, near) {
  if (!v) return near;
  const [h, m] = v.split(":").map(Number);
  const d = new Date(near); d.setHours(h, m, 0, 0);
  let t = d.getTime();
  if (t < near - 12 * 36e5) t += 864e5;
  return t;
}
const esc = t => String(t).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

/* ---------------- seans hesabı (tek doğruluk kaynağı) ---------------- */
function stats(se, ref) {
  const end = se.endedAt || ref || now();
  let brk = 0, bs = null, breaks = 0, legacy = 0, ping = null;
  for (const e of se.events) {
    if (e.type === "break_start") { bs = e.at; breaks++; }
    else if (e.type === "break_end" && bs != null) { brk += e.at - bs; bs = null; }
    else if (e.type === "presence_ping") { if (ping == null) ping = e.at; }        // eski sürüm verisi
    else if (e.type === "presence_ack") { if (ping != null) { legacy += e.at - ping; ping = null; } }
  }
  if (bs != null) brk += end - bs;
  if (ping != null) legacy += end - ping;
  const gross = end - se.startedAt;
  const net = Math.max(0, gross - brk);
  let un = legacy + (se.awayMs || 0);
  if (se.unconfirmedOk) un = 0;
  un = Math.min(un, net);
  if (un < 60000) un = 0;
  return {
    gross, brk, net, breaks,
    unconfirmed: un, confirmed: Math.max(0, net - un),
    onBreak: bs != null, breakStart: bs, end
  };
}
const activeSession = () => S.active ? S.sessions.find(x => x.id === S.active) : null;
function push(se, type, at) { se.events.push({ type, at: at || now() }); }

/* senkron damgası: her değişiklikte kaydın yaşı güncellenir.
   Birleştirmede "aynı id iki tarafta farklıysa yeni olan kazanır" kuralı buna dayanır. */
function touch(x) { if (x) x.editedAt = now(); return x; }
/* silinen kayıt mezar taşı bırakır, yoksa diğer cihazdan geri dirilir */
function tomb(kind, id) {
  if (!Array.isArray(S.tombstones)) S.tombstones = [];
  const i = S.tombstones.findIndex(t => t.id === id);
  if (i >= 0) S.tombstones[i].at = now();
  else S.tombstones.push({ kind, id, at: now() });
}

/* seansı çalışma/mola parçalarına ayır (kadran için) */
function segments(se, ref) {
  const end = se.endedAt || ref || now();
  const out = []; let cur = { type: "work", from: se.startedAt };
  for (const e of se.events) {
    if (e.type === "break_start" && cur.type === "work") { out.push({ type: "work", from: cur.from, to: e.at }); cur = { type: "break", from: e.at }; }
    else if (e.type === "break_end" && cur.type === "break") { out.push({ type: "break", from: cur.from, to: e.at }); cur = { type: "work", from: e.at }; }
  }
  out.push({ type: cur.type, from: cur.from, to: end });
  return out;
}

/* ---------------- eylemler ---------------- */
function startSession() {
  const t = now();
  const se = {
    id: uid(), startedAt: t, endedAt: null, dayKey: dayKey(t),
    /* 35-seans-icinde-is-degisimi.md: seans bölünmez, içi bölünür.
       se.isler dilimlerin listesi; se.taskId/olcu/olcuVeri isler[0]'ın
       AYNASI — eski koda ve senkron birleşimine geriye dönük uyum için. */
    isler: [{ taskId: seciliGorev || null, at: t }],
    taskId: seciliGorev || null,
    /* Not artık başta doldurulmuyor: iş adı zaten gorevSec satırında
       görünüyor, ikinci kez tekrarı yankı olurdu. Ad isteyen sonradan
       askSessionNote ile verir (35 §5). */
    note: "",
    mode: S.settings.mode,
    target: S.settings.mode === "pomodoro" ? S.settings.pomoTarget : 0,
    events: [{ type: "start", at: t }],
    awayMs: 0, unconfirmedOk: false, edited: false, editedAt: t,
    /* Seansın resmi hiçbir yerde saklanmıyor, kimliğinden yeniden üretiliyor.
       O yüzden çizim algoritması değişirse eski seansların resmi de değişirdi.
       Bu damga onu engelliyor: seans hangi sürümle yaşandıysa hep onunla
       çizilir. Damgasız (bu alandan önceki) seanslar AKIS_SURUM[1]'e düşer. */
    akisV: AKIS_GUNCEL
  };
  S.sessions.push(se); S.active = se.id;
  seciliGorev = null;
  lastMilestone = 0; pomoDone = false;

  if (se.mode === "pomodoro") {
    /* Kum havuzu açıksa darbe sesi/titreşimi taş KUMA ÇARPTIĞI an gelir
       (bkz. kumTasDusur); değilse düğmeye basıldığı an. */
    if (KUM.kapali || AK.kapali) {
      const prof = getKutleProfili(se.target);
      sesCalKutleDarbe(prof);
      buzz(prof.haptik);
    }
  } else {
    sesCalMaddi("baslat");
    buzz("baslat");
  }

  if (typeof tanitKapat === "function" && (AK.tanit || KUM.tanit)) tanitKapat(true);
  save(); requestWake(); if (S.settings.dnd) nativeDndBaslat(); render();
  /* Bildirim izni ilk seansta isteniyor — açılışta değil. İzin verilmezse
     uygulama aynen çalışır, sadece bildirim çubuğunda sayaç olmaz. */
  if (NATIVE) {
    try { if (!NATIVE.bildirimIzniVar()) NATIVE.bildirimIzniIste(); } catch (e) {}
  }
  nativeBildir(true);
  widgetBildir(true);
}
function takeBreak() {
  const se = activeSession(); if (!se) return;
  if (stats(se).onBreak) return;
  push(se, "break_start"); touch(se); sesCalMaddi("mola"); buzz("mola"); save(); render();
}
function resume() {
  const se = activeSession(); if (!se) return;
  const st = stats(se); if (!st.onBreak) return;
  const len = now() - st.breakStart;
  const ask = S.settings.longBreakAsk;
  if (ask > 0 && len > ask * 60000) { askLongBreak(se, st.breakStart, len); return; }
  doResume(se);
}
function doResume(se, at) {
  push(se, "break_end", at); touch(se);
  lastMilestone = Math.floor(stats(se).net / 60000 / (S.settings.milestone || 1e9));
  sesCalMaddi("devam"); buzz("devam"); save(); render();
}
function finish(at) {
  const se = activeSession(); if (!se) return;
  if (stats(se).onBreak) push(se, "break_end", at);
  push(se, "end", at);
  se.endedAt = at || now(); touch(se);
  const st = stats(se);
  const isPomoKirik = se.mode === "pomodoro" && se.target > 0 && st.net < (se.target * 60000 - 15000);

  const bitisiTamamla = () => {
    if (typeof toggleStandby === "function" && standbyAcik) toggleStandby(false);
    S.active = null; releaseWake();
    nativeDndBitir();
    save(); render();
    const thr = S.settings.longSessionAsk;
    if (thr > 0 && st.net >= thr * 60000) askAway(se);
    else showSummary(se);
    setTimeout(() => autoSync(true), 1200);
  };

  if (isPomoKirik) {
    se.kirik = true;
    buzz("kirik");
    sesCalTasKirilma();

    // Canlı kum bahçesinde aktif taş varsa kırılma animasyonunu oynat
    if (typeof KUM !== "undefined" && KUM.hazir && KUM.taslar && KUM.taslar.length > 0) {
      const t = KUM.taslar[KUM.taslar.length - 1];
      if (t) {
        kumTasKirAnimasyonu(t, bitisiTamamla);
        return;
      }
    }
  } else {
    // Başarılı Pomodoro: Eğer bu seans ile onarılacak (Kintsugi hakkı kazanan) kırık taş(lar) varsa
    if (se.mode === "pomodoro" && (se.target || 0) > 0 && typeof KUM !== "undefined" && KUM.hazir && KUM.taslar && KUM.taslar.length > 0) {
      const onarilacak = KUM.taslar.filter(t => t.kirik && !t.altin);
      if (onarilacak.length > 0) {
        buzz("kintsugi");
        sesCalKintsugi();
        kumTasKintsugiAnimasyonu(onarilacak, bitisiTamamla);
        return;
      }
    }
    sesCalMaddi("bitir");
    buzz("bitir");
  }

  bitisiTamamla();
}

/* ---------------- uzun mola sorusu (Ç4) ---------------- */
function askLongBreak(se, bStart, len) {
  sheet(`

}

/* ---------------- ölçü (künye): seans sonunda bir kez sorulur ----------------
   31-seans-ciktisi.md'nin kalıcı-ders sürümü henüz kurulmadığı için (görevler
   günlük, "subject" nesnesi yok) ölçü doğrudan seansa takılıyor: kalıcı bir
   yer imi yok, yalnız o seansın kendi künyesi. "Hayır" da bir cevaptır —
   sorulduktan sonra bir daha sorulmaz. Kaydet/atla ayrımı yalnız değer girme
   adımında var; tür seçiminde "hayır" zaten tek dokunuşluk çıkış. */
/* Yönlendirici. Üç yol var ve hiçbiri iki soru sormaz:
   1) Seans bir işe bağlıysa ve o işin ölçüsü varsa → tür sorusu ATLANIR,
      doğrudan sayı istenir. (Kullanıcının kazandığı asıl dokunuş burası.)
   2) Seans işe bağlı değilse ama bugünün açık işleri varsa → tek dokunuşluk
      "hangi işe?" sorulur, atlanabilir.
   3) Hiçbiri yoksa → bugünkü davranış birebir aynı. */
/* ---------------- seans içinde iş değişimi (dönüş) ----------------
   35-seans-icinde-is-degisimi.md. se.isler dilimlerin listesi:
   [{ taskId, at, olcu, olcuVeri }]. se.taskId/olcu/olcuVeri her zaman
   isler[0]'ın AYNASI (geriye dönük uyum + senkron birleşimi için).
   Süre HİÇBİR YERDE saklanmıyor, dilim aralığından türetiliyor. */
function seansIsleri(se) {
  if (Array.isArray(se.isler) && se.isler.length) return se.isler;
  return [{ taskId: se.taskId || null, at: se.startedAt, olcu: se.olcu, olcuVeri: se.olcuVeri }];
}
/* [a,b) aralığının, molalar düşülmüş net çalışma süresi. */
function dilimSuresi(se, a, b, ref) {
  let net = 0;
  for (const sg of segments(se, ref)) {
    if (sg.type !== "work") continue;
    const from = Math.max(sg.from, a), to = Math.min(sg.to, b);
    if (to > from) net += to - from;
  }
  return net;
}
/* Dilimler + her birinin bitiş anı ve süresi. Son dilimin bitişi seans
   bitişi (ya da hâlâ sürüyorsa ref/now). */
function dilimler(se, ref) {
  const isler = seansIsleri(se);
  const end = se.endedAt || ref || now();
  return isler.map((it, i) => {
    const to = (i + 1 < isler.length) ? isler[i + 1].at : end;
    return Object.assign({}, it, { to, sureMs: dilimSuresi(se, it.at, to, ref) });
  });
}
function askOlcu(se) {
  const isler = seansIsleri(se);
  const su = isler[isler.length - 1];
  const t = su.taskId ? S.tasks.find(x => x.id === su.taskId) : null;
  if (t && t.olcu && t.olcu !== "yok") { askOlcuDetay(se, t.olcu); return; }
  if (!su.taskId && isler.length === 1 && se.dayKey === todayKey()) {
    askSeansGorev(se, bugunAcikGorevler()); return;
  }
  askOlcuTur(se);
}
function askSeansGorev(se, acik) {
  sheet(`<h3>${soz("seans_hangi_is")}</h3>
    ${acik.map(t => `<button class="opt" data-i="${t.id}">${esc(t.title)}</button>`).join("")}
    <button class="opt optgap" id="isYeni">${soz("yeni_is")}</button>
    <button class="opt dim" id="isAtla">${soz("btn_olcu_atla")}</button>`, box => {
    const bagla = id => {
      const isler = seansIsleri(se);
      if (!Array.isArray(se.isler)) se.isler = isler;
      se.isler[0].taskId = id;
      se.taskId = id; touch(se); save(); closeSheet();
      setTimeout(() => askOlcu(se), 40);
    };
    box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => bagla(b.dataset.i));
    box.querySelector("#isYeni").onclick = () => {
      closeSheet();
      setTimeout(() => yeniIsSor(t => bagla(t.id)), 40);
    };
    box.querySelector("#isAtla").onclick = () => { closeSheet(); setTimeout(() => askOlcuTur(se), 40); };
  });
}
function askOlcuTur(se) {
  sheet(`
    <h3>${soz("olcu_baslik")}</h3>
    <button class="opt acc" data-o="yok">${soz("olcu_hayir")}</button>
    <button class="opt" data-o="sayfa">${soz("olcu_sayfa")}</button>
    <button class="opt" data-o="soru">${soz("olcu_soru")}</button>
  `, box => {
    box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      const v = b.dataset.o;
      if (v === "yok") { setOlcu(se, "yok", null); return; }
      askOlcuDetay(se, v);
    });
  });
}
/* Bir ölçü türü için giriş sayfası — SAF arayüz, hiçbir seans/görev
   bağlamı bilmez, sonucu cb(veri) ile döndürür. Hem seans sonu akışı
   (askOlcuDetay) hem seans içi dönüş (askDonusOlcu) bunu paylaşır. */
function askOlcuDetayIcin(gt, onceki, tur, cb, mevcut) {
  /* `mevcut` yalnız DÜZELTME akışında dolu gelir: kullanıcının kendi yazdığı
     sayıyı geri gösterir — uydurma değil, kendi kaydı. Seans sonu akışında
     çağrı beş değil dört argümanla geldiği için alanlar yine boş açılır. */
  const dv = v => (mevcut && v != null ? v : "");
  if (tur === "sayfa") {
    /* İpucu satırı: alan ÖNCEDEN DOLDURULMAZ (uydurma yok), yalnız nerede
       kalındığı hatırlatılır. 31-seans-ciktisi.md §5'in yer imi. */
    const ipucu = onceki != null ? `<p class="tiny">${soz("gorev_kaldin", { n: onceki })}</p>` : "";
    sheet(`
      <h3>${soz("olcu_sayfa_soru")}</h3>${ipucu}
      <div class="editrow"><input type="number" id="olSayfa" min="0" step="1" inputmode="numeric" style="width:110px" value="${dv(mevcut && mevcut.page)}"></div>
      <button class="opt acc" id="olSayfaOk">${soz("btn_kaydet")}</button>
      <button class="opt" id="olSayfaAtla">${soz("btn_olcu_atla")}</button>
    `, box => {
      box.querySelector("#olSayfaOk").onclick = () => {
        const raw = box.querySelector("#olSayfa").value;
        const n = Number(raw);
        cb((raw !== "" && !isNaN(n) && n >= 0) ? { page: Math.round(n) } : null);
      };
      box.querySelector("#olSayfaAtla").onclick = () => cb(null);
    });
  } else {
    const kalanIp = (gt && gt.hedef != null && gt.olcu === "soru")
      ? `<p class="tiny">${soz("hedef_soru_ozet", { n: gt.hedef })}</p>` : "";
    const mevcutToplam = (mevcut && (mevcut.correct != null || mevcut.wrong != null || mevcut.blank != null))
      ? ((mevcut.correct || 0) + (mevcut.wrong || 0) + (mevcut.blank || 0)) : "";
    sheet(`
      <h3>${soz("olcu_soru_baslik")}</h3>${kalanIp}
      <div class="olcu-soru-grid">
        <div class="olcu-col"><span class="olcu-lbl">${soz("olcu_soru_toplam")}</span><input type="number" id="olT" min="0" step="1" inputmode="numeric" class="olcu-inp" value="${mevcutToplam}"></div>
        <div class="olcu-col"><span class="olcu-lbl">${soz("olcu_soru_dogru")}</span><input type="number" id="olD" min="0" step="1" inputmode="numeric" class="olcu-inp" value="${dv(mevcut && mevcut.correct)}"></div>
        <div class="olcu-col"><span class="olcu-lbl">${soz("olcu_soru_yanlis")}</span><input type="number" id="olY" min="0" step="1" inputmode="numeric" class="olcu-inp" value="${dv(mevcut && mevcut.wrong)}"></div>
        <div class="olcu-col"><span class="olcu-lbl">${soz("olcu_soru_bos")}</span><input type="number" id="olB" min="0" step="1" inputmode="numeric" class="olcu-inp" value="${dv(mevcut && mevcut.blank)}"></div>
      </div>
      <button class="opt acc" id="olSoruOk">${soz("btn_kaydet")}</button>
      <button class="opt" id="olSoruAtla">${soz("btn_olcu_atla")}</button>
    `, box => {
      const inT = box.querySelector("#olT");
      const inD = box.querySelector("#olD");
      const inY = box.querySelector("#olY");
      const inB = box.querySelector("#olB");

      const numVal = el => {
        const v = el.value.trim();
        if (v === "") return null;
        const n = Number(v);
        return (isNaN(n) || n < 0) ? null : Math.round(n);
      };

      let kaynak = (mevcut && mevcut.correct != null) ? "toplam" : null;

      const hesaplaDogru = () => {
        const t = numVal(inT);
        if (t == null) return;
        const y = numVal(inY) || 0;
        const b = numVal(inB) || 0;
        inD.value = Math.max(0, t - y - b);
      };

      const hesaplaToplam = () => {
        const d = numVal(inD);
        const y = numVal(inY);
        const b = numVal(inB);
        if (d != null || y != null || b != null) {
          inT.value = (d || 0) + (y || 0) + (b || 0);
        } else {
          inT.value = "";
        }
      };

      inT.onfocus = () => { kaynak = "toplam"; };
      inT.oninput = () => {
        kaynak = "toplam";
        if (inT.value.trim() === "") {
          inD.value = "";
        } else {
          hesaplaDogru();
        }
      };

      inD.onfocus = () => { kaynak = "dogru"; };
      inD.oninput = () => {
        kaynak = "dogru";
        hesaplaToplam();
      };

      inY.onfocus = () => {
        if (!kaynak) {
          if (inT.value.trim() !== "") kaynak = "toplam";
          else if (inD.value.trim() !== "") kaynak = "dogru";
          else kaynak = "toplam";
        }
      };
      inY.oninput = () => {
        if (kaynak === "dogru") {
          hesaplaToplam();
        } else if (inT.value.trim() !== "" || kaynak === "toplam") {
          hesaplaDogru();
        } else if (inD.value.trim() !== "") {
          hesaplaToplam();
        }
      };

      inB.onfocus = () => {
        if (!kaynak) {
          if (inT.value.trim() !== "") kaynak = "toplam";
          else if (inD.value.trim() !== "") kaynak = "dogru";
          else kaynak = "toplam";
        }
      };
      inB.oninput = () => {
        if (kaynak === "dogru") {
          hesaplaToplam();
        } else if (inT.value.trim() !== "" || kaynak === "toplam") {
          hesaplaDogru();
        } else if (inD.value.trim() !== "") {
          hesaplaToplam();
        }
      };

      const oku = sel => {
        const raw = box.querySelector(sel).value.trim();
        if (raw === "") return null;
        const n = Number(raw);
        return (isNaN(n) || n < 0) ? null : Math.round(n);
      };
      box.querySelector("#olSoruOk").onclick = () => {
        let d = oku("#olD"), y = oku("#olY"), b = oku("#olB");
        const t = oku("#olT");
        if (t != null && d == null && (y != null || b != null)) {
          d = Math.max(0, t - (y || 0) - (b || 0));
        } else if (t != null && d == null && y == null && b == null) {
          d = t;
        }
        cb((d != null || y != null || b != null) ? { correct: d, wrong: y, blank: b } : null);
      };
      box.querySelector("#olSoruAtla").onclick = () => cb(null);
    });
  }
}
function askOlcuDetay(se, tur) {
  const isler = seansIsleri(se);
  const su = isler[isler.length - 1];
  const gt = su.taskId ? S.tasks.find(x => x.id === su.taskId) : null;
  const onceki = (tur === "sayfa" && gt) ? gorevIlerleme(gt) : null;
  askOlcuDetayIcin(gt, onceki, tur, veri => setOlcu(se, tur, veri));
}
/* Dönüşte bırakılan işin ölçüsünü sorar (35 §4). */
function askDonusOlcu(t, cb) {
  const onceki = t.olcu === "sayfa" ? gorevIlerleme(t) : null;
  askOlcuDetayIcin(t, onceki, t.olcu, veri => cb(veri));
}
/* Bir dilime ölçü uygular, görevin durumunu tazeler ve — hedefe TAM O AN
   varıldıysa — tek kertik (haptik+ses) + olgu cümlesi verir. Kutlama değil:
   32-haptik-dili.md'nin "bitir" dokusunun tek vuruşluk hâli, tek kez. */
function uygulaOlcu(su, tur, veri, t) {
  su.olcu = tur; su.olcuVeri = veri;
  if (!t) return;
  const oncekiDurum = t.status;
  if ((!t.olcu || t.olcu === "yok") && tur !== "yok") { t.olcu = tur; touch(t); }
  gorevDurumTazele(t);
  if (oncekiDurum !== "bitti" && t.status === "bitti") {
    buzz("kertik"); sesCalKertikCentik();
    flash(soz("flash_hedefe_vardin", { n: t.hedef }));
  }
}
function setOlcu(se, tur, veri) {
  const isler = seansIsleri(se);
  if (!Array.isArray(se.isler)) se.isler = isler;
  const su = se.isler[se.isler.length - 1];

   soru sorulmadan doğrudan uygulanır: (a) seans işsiz başladı ve ilk kez

function donusYap(se, yeniTaskId) {
  const isler = seansIsleri(se);
  if (!Array.isArray(se.isler)) se.isler = isler;
  const su = se.isler[se.isler.length - 1];
  const ilkVeIssiz = se.isler.length === 1 && !su.taskId;

/* ---------------- haptik sozlugu: dokunulan malzeme ----------------
   24-sanat-dili.md 6.5 — haptik bir bildirim degil, bir YUZEYDIR.
   Her dokunun kendi genlik zarfi var:  t[] sureler (ms), a[] genlikler (1-255).
   Cift indisler vurus, tek indisler sessizliktir (a[i] === 0).
   Sonumlenen zarf = maddenin yerine oturmasi; artan zarf = onarim. */
const DOKU = {
  /* --- elle hissedilenler: parmak ekranda, 6-14 ms, aninda --- */
  baslat:   { t: [14],                          a: [120] },
  mola:     { t: [10, 20, 8],                   a: [75, 0, 30] },
  devam:    { t: [11],                          a: [95] },
  bitir:    { t: [12, 40, 9],                   a: [110, 0, 60] },
  sec:      { t: [6],                           a: [40] },
  not:      { t: [7],                           a: [55] },
  donum:    { t: [8],                           a: [45] },
  /* 35-seans-icinde-is-degisimi.md §4: hedefe varış — "bitir"in tek
     vuruşluk hâli. Kutlama değil, tek kertik. */
  kertik:   { t: [12],                          a: [110] },

  /* --- maddi olaylar: sanatin kendi dili --- */
  /* pomodoro: tek olay ki telefon elde degil. Tasin kuma oturmasi:
     net bir darbe, ardindan iki zayiflayan yanki. Cepte hissedilir,
     alarm gibi hissedilmez. Toplam 103 ms. */
  pomodoro: { t: [22, 26, 12, 34, 9],           a: [190, 0, 95, 0, 45], komp: "tas_oturma" },
  kirik:    { t: [17, 12, 7, 9, 5],             a: [205, 0, 90, 0, 45] },
  kintsugi: { t: [8, 20, 14],                   a: [50, 0, 125] },
  ruzgar1:  { t: [10, 40, 8],                   a: [45, 0, 30] },
  ruzgar2:  { t: [12, 40, 14, 50, 8],           a: [55, 0, 60, 0, 35] },
  ruzgar3:  { t: [18, 45, 24, 60, 16, 40, 10],  a: [60, 0, 80, 0, 55, 0, 30] }
};

function buzz(x) {
  try {
    if (!S.settings.vibrate) return;
    const d = (typeof x === "string") ? DOKU[x]
            : (x && Array.isArray(x.t)) ? x
            : (typeof x === "number") ? { t: [x], a: [Math.max(1, Math.min(255, x * 9))] }
            : Array.isArray(x) ? { t: x, a: x.map((v, i) => (i % 2 ? 0 : 150)) }
            : null;
    if (!d || !d.t || !d.t.length) return;

    const nat = (typeof KertikNative !== "undefined") ? KertikNative
              : (typeof window !== "undefined" && window.KertikNative) ? window.KertikNative
              : (typeof NATIVE !== "undefined" ? NATIVE : null);

    /* 1. tercih: genlik zarfli doku. Zarf burada korunur. */
    if (nat && typeof nat.titretDoku === "function") {
      nat.titretDoku(d.t.join(","), (d.a || []).join(","), d.komp || "");
      return;
    }
    /* 2. tercih: eski kopru (eski APK). Zarf kaybolur ama titrer. */
    if (nat && typeof nat.titretPattern === "function" && d.t.length > 1) { nat.titretPattern(d.t.join(",")); return; }
    if (nat && typeof nat.titretHassas === "function") { nat.titretHassas(d.t[0], (d.a && d.a[0]) || 150); return; }
    if (nat && typeof nat.titret === "function") { nat.titret(d.t[0]); return; }
    /* 3. tercih: tarayici (simulator). Native varsa buraya ASLA dusmez —
       eskiden ikisi birden calisiyordu, yani her titresim ciftti. */
    if (navigator.vibrate) navigator.vibrate(d.t.length > 1 ? d.t : d.t[0]);
  } catch (e) {}
}

let audioCtx = null;

function getAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!audioCtx) {
    // Donanımın kendi yerel örnekleme hızını (genellikle Android'de 48000 Hz) kullan.

    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === "suspended") {

/**
 * Ses kanalı (AudioTrack/AAudio) YALNIZCA uygulama arka plana atıldığında kapanır
 * (bkz. aşağıdaki "visibilitychange" — audioCtx.suspend() orada çağrılıyor).
 *
 * Eskiden her sesin bitiminden ~200ms sonra da kapatılıyordu (donanım kanalını
 * boşta tutmamak için). Ama bir seans içinde arka arkaya gelen sesler
 * (başlat/mola/devam/bitir/pomodoro), aralarında 200ms'den uzun boşluk olduğunda
 * kanalı her seferinde sıfırdan yeniden açtırıyordu — Android'de yeni bir ses
 * oturumu açmak, aynı anda çalan arkaplan müziğinde (Spotify, Apple Music vb.)
 * mikserin kısaca yeniden ayarlanmasına, yani tam da önlenmek istenen
 * cızırtıya/parazite yol açabiliyor. Kanalı seans boyunca (uygulama önde
 * olduğu sürece) açık tutmak bu tekrar tekrar açılışı ortadan kaldırıyor:
 * küçük bir pil/CPU maliyeti karşılığında, her ses efektinde tekrarlanan bir
 * parazit yerine yalnızca uygulama öne/arkaya geçerken tek seferlik bir maliyet.
 */

/**
 * 4. Derece Sıcak IIR Alçak Geçiren Filtre (Cascaded 2x Biquad)
 * Tüm tiz parazitleri ve dijital sertlikleri 24 dB/oktav eğimle süzer.
 */
function applyIIRLowpass(data, sr, cutoff = 280.0) {
  const omega = 2.0 * Math.PI * cutoff / sr;
  const sn = Math.sin(omega);
  const cs = Math.cos(omega);
  const alpha = sn / (2.0 * 0.707);
  const b0_n = ((1.0 - cs) / 2.0) / (1.0 + alpha);
  const b1_n = (1.0 - cs) / (1.0 + alpha);
  const b2_n = ((1.0 - cs) / 2.0) / (1.0 + alpha);
  const a1_n = (-2.0 * cs) / (1.0 + alpha);
  const a2_n = (1.0 - alpha) / (1.0 + alpha);

  const len = data.length;
  // 1. Kademe (12 dB/oct)
  const pass1 = new Float32Array(len);
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < len; i++) {
    const x0 = data[i];
    const y0 = b0_n * x0 + b1_n * x1 + b2_n * x2 - a1_n * y1 - a2_n * y2;
    x2 = x1; x1 = x0; y2 = y1; y1 = y0;
    pass1[i] = y0;
  }
  // 2. Kademe (Toplam 24 dB/oct - Sıfır Tiz Cızırtısı)
  const pass2 = new Float32Array(len);
  x1 = 0; x2 = 0; y1 = 0; y2 = 0;
  for (let i = 0; i < len; i++) {
    const x0 = pass1[i];
    const y0 = b0_n * x0 + b1_n * x1 + b2_n * x2 - a1_n * y1 - a2_n * y2;
    x2 = x1; x1 = x0; y2 = y1; y1 = y0;
    pass2[i] = y0;
  }
  return pass2;
}

/**
 * Hann/Cosine Yumuşak Pencereleme (Zero Boundary Discontinuity)
 * Başta 1.5ms ve sonda 4ms sönümleme uygulayarak DC hoparlör patlamasını (pop/click) sıfırlar.
 */
function applyAudioWindow(data, sr) {
  const len = data.length;
  const inSamples = Math.min(len, Math.floor(sr * 0.0015));
  const outSamples = Math.min(len, Math.floor(sr * 0.004));

  for (let i = 0; i < inSamples; i++) {
    data[i] *= 0.5 * (1.0 - Math.cos((Math.PI * i) / inSamples));
  }
  for (let i = 0; i < outSamples; i++) {
    const idx = len - 1 - i;
    data[idx] *= 0.5 * (1.0 - Math.cos((Math.PI * i) / outSamples));
  }
}

/**
 * Güvenli Tampon Çalıcı
 * Ses kaynağını başlatır ve bitişte kaynağı temizler. Ses kanalının kendisi
 * burada kapanmıyor — bkz. getAudioContext'in üstündeki not.
 */
function sesCalTampon(ctx, buffer, dur) {
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  let ended = false;
  const onEnd = () => {
    if (ended) return;
    ended = true;
    try { src.disconnect(); } catch (e) {}
  };
  src.onended = onEnd;
  src.start();
  // Güvenlik zamanlayıcısı (onended tetiklenmezse kaynak bağlı kalmasın)
  setTimeout(onEnd, Math.round(dur * 1000) + 120);
}

/* Kayıpsız Gerçek Taş & Kum Çarpışma Sentezi (Transient + Modal Body + Sand Granules) */
function sesCalKutleDarbe(profil) {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const sr = ctx.sampleRate || 48000;
    const p = profil || KUTLE_PROFILLERI[25];
    const dur = Math.max(0.22, (p.decay || 0.14) * 1.5);
    const numSamples = Math.floor(sr * dur);
    const buffer = ctx.createBuffer(1, numSamples, sr);
    const data = buffer.getChannelData(0);
    const raw = new Float32Array(numSamples);

    const f0 = p.freqBasla || 115;
    const fEnd = p.freqBitis || 35;
    const isHeavy = (p.tanecikAdet || 32) >= 40;
    const grit = isHeavy ? 0.20 : 0.12;
    const subGain = isHeavy ? 0.40 : 0.18;

    let phase = 0;
    let b0 = 0, b1 = 0;

    for (let i = 0; i < numSamples; i++) {
      const t = i / sr;
      const white = (Math.random() * 2.0 - 1.0);
      b1 = 0.70 * b1 + 0.30 * white;
      const trans = Math.exp(-t * 600.0) * b1 * 0.40;

      const freqT = fEnd + (f0 - fEnd) * Math.exp(-t * 38.0);
      phase += (2.0 * Math.PI * freqT) / sr;
      const decay = p.decay || 0.14;
      const body = Math.sin(phase) * Math.exp(-t / decay);
      const sub = Math.sin(phase * 0.5) * Math.exp(-t / (decay * 1.35)) * subGain;

      b0 = 0.85 * b0 + 0.15 * white;
      const sandGrit = b0 * Math.exp(-t * 45.0) * grit;

      raw[i] = (trans * 0.35 + body * 0.65 + sub * 0.45 + sandGrit * 0.35) * (p.gain || 0.5) * 1.6;
    }

    const cutoff = Math.min(380.0, p.filterFreq || 350.0);
    const filtered = applyIIRLowpass(raw, sr, cutoff);
    for (let i = 0; i < numSamples; i++) {
      data[i] = Math.tanh(filtered[i] * 1.45);
    }
    applyAudioWindow(data, sr);
    sesCalTampon(ctx, buffer, dur);
  } catch (e) {}
}

/* ---------------- 5 temel maddi etkileşim sesi (24-sanat-dili.md §6.5) ----------------
   Müzikal nota/çan/jingle YOK. Yalnızca maddi ses: tahtaya çentik, kum sönümlenmesi, avuçta taş, sandık kapağı.
   320 Hz üzeri tüm tiz frekanslar 4. derece çift kademeli filtreyle elenmiştir. */
function sesCalMaddi(olay) {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const sr = ctx.sampleRate || 48000;

    let dur = 0.095;
    if (olay === "mola") dur = 0.14;
    else if (olay === "devam") dur = 0.09;
    else if (olay === "pomodoro") dur = 0.26;
    else if (olay === "bitir") dur = 0.28;

    const numSamples = Math.floor(sr * dur);
    const buffer = ctx.createBuffer(1, numSamples, sr);
    const data = buffer.getChannelData(0);
    const raw = new Float32Array(numSamples);

    if (olay === "baslat") {
      // 1. Başlat: Kuru Ceviz Kütüğüne İlk Kertik (Mikro Lif Transient + 118 Hz Gövde + 186 Hz Rezonans - 95ms)
      let bNoise = 0.0;
      for (let i = 0; i < numSamples; i++) {
        const t = i / sr;
        const w = Math.random() * 2.0 - 1.0;
        bNoise = 0.75 * bNoise + 0.25 * w;
        const grainTrans = bNoise * Math.exp(-t * 450.0) * 0.45;

        const attack1 = 1.0 - Math.exp(-t * 600.0);
        const mode1 = Math.sin(2.0 * Math.PI * 118.0 * t) * Math.exp(-t / 0.028) * attack1 * 1.25;

        const attack2 = 1.0 - Math.exp(-t * 500.0);
        const mode2 = Math.sin(2.0 * Math.PI * 186.0 * t) * Math.exp(-t / 0.019) * attack2 * 0.35;

        const mode3 = Math.sin(2.0 * Math.PI * 265.0 * t) * Math.exp(-t / 0.012) * attack1 * 0.15;

        raw[i] = grainTrans + mode1 + mode2 + mode3;
      }
    } else if (olay === "mola") {
      // 2. Mola: Kum & kütle sönümlenmesi (110ms)
      for (let i = 0; i < numSamples; i++) {
        const t = i / sr;
        const attack = 1.0 - Math.exp(-t * 180.0);
        const freq = 65.0 + 45.0 * Math.exp(-t * 35.0);
        raw[i] = Math.sin(2.0 * Math.PI * freq * t) * Math.exp(-t / 0.065) * attack * 1.1;
      }
    } else if (olay === "devam") {
      // 3. Devam: Hafif ahşap temas (70ms)
      for (let i = 0; i < numSamples; i++) {
        const t = i / sr;
        const attack = 1.0 - Math.exp(-t * 400.0);
        const freq = 110.0 + 60.0 * Math.exp(-t * 60.0);
        raw[i] = Math.sin(2.0 * Math.PI * freq * t) * Math.exp(-t / 0.025) * attack * 1.1;
      }
    } else if (olay === "pomodoro") {
      // 4. Pomodoro Bitiş: Avuç içi tok nehir taşı oturması (200ms)
      for (let i = 0; i < numSamples; i++) {
        const t = i / sr;
        const a1 = 1.0 - Math.exp(-t * 220.0);
        const f1 = 80.0 + 65.0 * Math.exp(-t * 35.0);
        let s = Math.sin(2.0 * Math.PI * f1 * t) * Math.exp(-t / 0.075) * a1 * 1.2;
        if (t >= 0.045) {
          const t2 = t - 0.045;
          const a2 = 1.0 - Math.exp(-t2 * 280.0);
          const f2 = 110.0 + 40.0 * Math.exp(-t2 * 40.0);
          s += Math.sin(2.0 * Math.PI * f2 * t2) * Math.exp(-t2 / 0.055) * a2 * 0.75;
        }
        raw[i] = s;
      }
    } else if (olay === "bitir") {
      // 5. Bitir: Sandık kapağı / kapanış mührü (180ms çift vuruş)
      for (let i = 0; i < numSamples; i++) {
        const t = i / sr;
        const a1 = 1.0 - Math.exp(-t * 300.0);
        let s = Math.sin(2.0 * Math.PI * 140.0 * t) * Math.exp(-t / 0.030) * a1 * 0.7;
        if (t >= 0.038) {
          const t2 = t - 0.038;
          const a2 = 1.0 - Math.exp(-t2 * 180.0);
          const f2 = 70.0 + 55.0 * Math.exp(-t2 * 30.0);
          s += Math.sin(2.0 * Math.PI * f2 * t2) * Math.exp(-t2 / 0.090) * a2 * 1.4;
        }
        raw[i] = s;
      }
    }

    const cutoff = olay === "pomodoro" ? 220.0 : olay === "mola" ? 240.0 : 320.0;
    const filtered = applyIIRLowpass(raw, sr, cutoff);
    for (let i = 0; i < numSamples; i++) {
      data[i] = Math.tanh(filtered[i] * 1.5);
    }
    applyAudioWindow(data, sr);
    sesCalTampon(ctx, buffer, dur);
  } catch (e) {}
}

/* Geriye dönük uyumluluk takma adları */
function sesCalZenCani() { sesCalMaddi("pomodoro"); }

/* Kırık Taş Akustiği (Vaat Bozulma / Kumda Tok Mineral Çatlama - 240ms, Sıfır Tiz) */
function sesCalTasKirilma() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const sr = ctx.sampleRate || 48000;
    const dur = 0.24;
    const numSamples = Math.floor(sr * dur);
    const buffer = ctx.createBuffer(1, numSamples, sr);
    const data = buffer.getChannelData(0);
    const raw = new Float32Array(numSamples);
    let b0 = 0;

    for (let i = 0; i < numSamples; i++) {
      const t = i / sr;
      // 1. Ana fay hattı yarılma bası (45-85 Hz)
      const attack1 = 1.0 - Math.exp(-t * 220.0);
      const f1 = 45.0 + 40.0 * Math.exp(-t * 35.0);
      const s1 = Math.sin(2.0 * Math.PI * f1 * t) * Math.exp(-t / 0.080) * attack1 * 1.2;

      // 2. Kum tanecikleri kayması (filtrelenmiş sürtünme)
      const white = Math.random() * 2.0 - 1.0;
      b0 = 0.88 * b0 + 0.12 * white;
      const sandShift = b0 * Math.exp(-t / 0.090) * 0.35;

      // 3. İkiye ayrılan parçanın kuma oturması (35ms sonra)
      let s2 = 0.0;
      if (t >= 0.035) {
        const t2 = t - 0.035;
        const attack2 = 1.0 - Math.exp(-t2 * 250.0);
        const f2 = 60.0 + 30.0 * Math.exp(-t2 * 40.0);
        s2 = Math.sin(2.0 * Math.PI * f2 * t2) * Math.exp(-t2 / 0.060) * attack2 * 0.70;
      }

      raw[i] = s1 + sandShift + s2;
    }

    const filtered = applyIIRLowpass(raw, sr, 200.0);
    for (let i = 0; i < numSamples; i++) {
      data[i] = Math.tanh(filtered[i] * 1.5);
    }
    applyAudioWindow(data, sr);
    sesCalTampon(ctx, buffer, dur);
  } catch (e) {}
}

/* Kintsugi Onarım Akustiği (Maddi Kenetlenme / Urushi ve Altın Tozu Teması - 280ms, Sıfır Melodi)
   Wabi-sabi kuralı: Melodi/akor/çan yok. Yalnız iki mineral yüzeyin kuma oturup
   birbirine kenetlenmesi (tok mineral rezonansı) ve reçinenin kuru sürtünme sesi. */
function sesCalKintsugi() {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const sr = ctx.sampleRate || 48000;
    const dur = 0.28;
    const numSamples = Math.floor(sr * dur);
    const buffer = ctx.createBuffer(1, numSamples, sr);
    const data = buffer.getChannelData(0);
    const raw = new Float32Array(numSamples);
    let b0 = 0, b1 = 0;

    for (let i = 0; i < numSamples; i++) {
      const t = i / sr;
      // 1. Taş parçalarının birbirine kavuşup kenetlenmesi (75-95 Hz yumuşak mineral oturma)
      const attack1 = 1.0 - Math.exp(-t * 260.0);
      const f1 = 88.0 - 18.0 * Math.exp(-t * 25.0);
      const s1 = Math.sin(2.0 * Math.PI * f1 * t) * Math.exp(-t / 0.095) * attack1 * 0.95;

      // 2. Kuru altın tozu ve urushi reçinesinin çatlak boyunca çekiliş dokusu (kısa ve kadifemsi sürtünme)
      const white = Math.random() * 2.0 - 1.0;
      b0 = 0.82 * b0 + 0.18 * white;
      b1 = 0.82 * b1 + 0.18 * b0;
      const urushiFriction = b1 * Math.exp(-t / 0.120) * 0.40;

      // 3. Altının taşa mühürlendiği mikro mineral kapanış tıkırtısı (60ms sonra, tok)
      let s2 = 0.0;
      if (t >= 0.060) {
        const t2 = t - 0.060;
        const attack2 = 1.0 - Math.exp(-t2 * 300.0);
        const f2 = 110.0 - 25.0 * Math.exp(-t2 * 45.0);
        s2 = Math.sin(2.0 * Math.PI * f2 * t2) * Math.exp(-t2 / 0.075) * attack2 * 0.55;
      }

      raw[i] = s1 + urushiFriction + s2;
    }

    const filtered = applyIIRLowpass(raw, sr, 280.0);
    for (let i = 0; i < numSamples; i++) {
      data[i] = Math.tanh(filtered[i] * 1.4);
    }
    applyAudioWindow(data, sr);
    sesCalTampon(ctx, buffer, dur);
  } catch (e) {}
}

/* ---------------- native köprü ----------------
   Uygulama native kabuğun içinde çalışıyorsa KertikNative tanımlıdır.
   Tarayıcıda açıldığında yoktur ve her şey eskisi gibi çalışır. */
const NATIVE = (typeof KertikNative !== "undefined") ? KertikNative : null;

/* Google yedeklemesi (Bulut Senkronizasyonu).
   Veri kullanıcının kendi Google Drive'ında, appDataFolder
   özel alanında durur. Bizim tarafta sunucu veya hesap yoktur. */
const SENKRON_ACIK = true;

/* ---------------- ekranı açık tut ---------------- */
async function requestWake() {
  if (!S.settings.keepAwake) return;
  if (NATIVE) { try { NATIVE.ekraniAcikTut(true); return; } catch (e) {} }
  if (!("wakeLock" in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseWake() {
  if (NATIVE) { try { NATIVE.ekraniAcikTut(false); } catch (e) {} }
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}

/* ---------------- rahatsız etmeyin (DND) ---------------- */
function nativeDndBaslat() {
  if (!S.settings.dnd) return;
  const nat = (typeof KertikNative !== "undefined") ? KertikNative : (typeof window !== "undefined" && window.KertikNative) ? window.KertikNative : (typeof NATIVE !== "undefined" ? NATIVE : null);
  if (nat && typeof nat.dndBaslat === "function") {
    try { nat.dndBaslat(); } catch (e) {}
  }
}
function nativeDndBitir() {
  const nat = (typeof KertikNative !== "undefined") ? KertikNative : (typeof window !== "undefined" && window.KertikNative) ? window.KertikNative : (typeof NATIVE !== "undefined" ? NATIVE : null);
  if (nat && typeof nat.dndBitir === "function") {
    try { nat.dndBitir(); } catch (e) {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (S.active) {
      requestWake();
      if (S.settings.dnd) nativeDndBaslat();
    }
    render();
  } else {
    // Ses kanalının kapatıldığı tek yer burası — bkz. getAudioContext'in üstündeki not.

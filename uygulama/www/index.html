    if (audioCtx && audioCtx.state === "running") {
      audioCtx.suspend().catch(() => {});
    }
  }
});
window.addEventListener("pointerdown", () => {
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().catch(() => {});
  }
}, { passive: true });

/* ---------------- bildirim çubuğundaki canlı sayaç ----------------
   Bildirim yalnızca bir GÖSTERGE. Süre hâlâ olay damgalarından hesaplanıyor;
   burada hiçbir şey sayılmıyor, saklanmıyor. Android kronometreyi kendisi
   işlettiği için sadece metin değiştiğinde haber veriyoruz. */
let nativeSonImza = "";
function nativeBildir(zorla) {
  if (!NATIVE) return;
  const se = activeSession();
  if (!se) {
    if (nativeSonImza !== "yok") { try { NATIVE.gizle(); } catch (e) {} nativeSonImza = "yok"; }
    return;
  }
  const st = stats(se);
  let baslik, alt, temel, geri = false;

  if (st.onBreak) {
    baslik = soz("durum_mola");
    alt = soz("capt_donduruldu", { s: human(st.net) });
    temel = st.breakStart;
  } else if (se.mode === "pomodoro" && se.target > 0) {
    const kalan = se.target * 60000 - st.net;
    baslik = kalan >= 0 ? soz("durum_calisiyor") : soz("bld_hedef_doldu");
    alt = soz("capt_centik", { a: Math.floor(st.net / 60000), b: se.target });
    temel = now() + kalan;          // kalan<0 ise geçmiş bir an: yukarı sayar
    geri = kalan >= 0;
  } else {
    baslik = soz("durum_calisiyor");
    alt = soz("alt_basladin", { t: saatY(se.startedAt) }) + (st.brk ? " · " + soz("ek_mola", { s: human(st.brk) }) : "");
    temel = se.startedAt;
  }

  const imza = baslik + "|" + alt + "|" + Math.round(temel / 1000) + "|" + geri;
  if (!zorla && imza === nativeSonImza) return;
  nativeSonImza = imza;
  try { NATIVE.goster(baslik, alt, String(temel), geri, st.onBreak); } catch (e) {}
}
window.nativeBildir = nativeBildir;

/* ---------------- ana ekran widget'ı ----------------
   Widget ayrı bir süreçte çizilir ve buradaki localStorage'a erişemez.
   O yüzden durum her değiştiğinde küçük bir JSON bırakıyoruz; widget
   yalnız onu okuyor.

   Ayna TÜREVDİR: burada hiçbir şey saklanmıyor, hakikat hâlâ olay
   damgalarında. Ayna bozulsa ya da eskisi kalsa uygulamanın verisi
   etkilenmez — en fazla widget bir süre eski görünür.

   İmza karşılaştırması sayesinde saniyede bir çağrılsa bile köprüden
   yalnızca gerçekten bir şey değiştiğinde geçiyor. */
let widgetSonImza = "";
function widgetBildir(zorla) {
  if (!NATIVE || typeof NATIVE.widgetDurum !== "function") return;
  const se = activeSession();
  const st = se ? stats(se) : null;

  /* --- bugünün toplamı --- */
  const bugun = todayKey();
  let bugunNet = 0;
  for (const x of S.sessions) {
    if (x.dayKey !== bugun) continue;
    bugunNet += stats(x).confirmed;
  }

  const paketMod = se ? se.mode : S.settings.mode;

  let durum = "bos", temel = 0, geri = false;
  if (se && st) {
    if (st.onBreak) { durum = "molada"; temel = st.breakStart; }
    else if (se.mode === "pomodoro" && se.target > 0) {
      durum = "calisiyor";
      const kalan = se.target * 60000 - st.net;
      temel = now() + kalan;                 /* kalan<0 ise geçmiş an: yukarı sayar */
      geri = kalan >= 0;
    } else { durum = "calisiyor"; temel = se.startedAt; }
  }

  /* --- duvar: son 30 gün, YALNIZ YÜRÜRLÜKTEKİ MODUN GÜNLERİ ---
     İki ayrı duvar kararı (19 Ağustos 2026) widget'ta da geçerli: dar bir
     şeritte iki ölçek yan yana gelemez. Widget tek duvar gösteriyor ve o
     duvar kullanıcının içinde bulunduğu modun duvarı. Karışık gün yok:
     her seans kendi moduna yazılıyor, öbür modun günleri boş görünüyor.
     Pomodoro gününün ölçüsü dakika değil TAŞ SAYISI (n). */
  const duvarMod = paketMod;
  const pomoDuvar = duvarMod === "pomodoro";
  const gunluk = {};
  for (const x of S.sessions) {
    if (!x.endedAt) continue;
    if ((x.mode === "pomodoro") !== pomoDuvar) continue;
    (gunluk[x.dayKey] = gunluk[x.dayKey] || []).push(x);
  }
  const duvar = [];
  const gunMs = 86400000;
  for (let i = 0; i < 30; i++) {
    const k = dayKey(now() - i * gunMs);
    const liste = gunluk[k];
    if (!liste || !liste.length) { duvar.push({ g: i, dk: 0, n: 0, m: [] }); continue; }
    if (pomoDuvar) {
      const t = gunTas(liste, k);
      duvar.push({ g: i, dk: 0, n: ((t && t.dkList) || []).length, m: [] });
      continue;
    }
    const v = gunCubuk(liste, k);
    duvar.push({
      g: i, dk: v.dk, n: 0,
      m: (v.molalar || []).map(b => [Math.round(b[0]), Math.round(b[1])])
    });
  }

  const cubuk = se ? (() => {
    const v = cubukVeri(se);
    return {
      id: v.id, dk: v.dk, s: v.sayilmayan,
      m: (v.molalar || []).map(b => [Math.round(b[0]), Math.round(b[1])])
    };
  })() : null;

  const paket = {
    durum, temel, geri,
    net: st ? st.net : 0,
    not: (se && se.note) ? se.note : "",
    bugunNet, bas: se ? hhmm(se.startedAt) : "",
    mod: paketMod,
    hedef: se ? (se.target || 0) : 0,
    cubuk, duvar, t: now()
  };

  /* saniye ve dakika dışındaki her şeyin imzası; sayacı Android kendisi
     işlettiği için saniye değişimi widget'ı yenilemek için sebep değil */
  const imza = durum + "|" + Math.round(temel / 1000) + "|" + geri + "|" +
    Math.floor(paket.net / 60000) + "|" + Math.floor(bugunNet / 60000) + "|" +
    paket.not + "|" + (cubuk ? cubuk.dk + ":" + cubuk.m.length + ":" + cubuk.s : "-") + "|" +
    duvar.length + ":" + duvar[0].dk + ":" + duvar[0].n + ":" + duvarMod;
  if (!zorla && imza === widgetSonImza) return;
  widgetSonImza = imza;
  try { NATIVE.widgetDurum(JSON.stringify(paket)); } catch (e) {}
}
window.widgetBildir = widgetBildir;

/* Bildirim ve widget tuşlarından gelen komutlar. Tek giriş noktası; buradan
   sonrası uygulamanın normal akışı, ayrı bir kod yolu yok. */
window.kertikNativeEylem = function (a) {
  /* "start" seans yokken de anlamlı — widget'ın başlat tuşu buradan geçiyor */
  if (a === "start") {
    if (!activeSession()) { startSession(); render(); }
    nativeBildir(true); widgetBildir(true);
    return;
  }
  const se = activeSession();
  if (!se) { nativeBildir(true); widgetBildir(true); return; }
  const st = stats(se);
  if (a === "break" && !st.onBreak) takeBreak();
  else if (a === "resume" && st.onBreak) resume();
  else if (a === "end") finish();
  nativeBildir(true); widgetBildir(true);
};

/* ============================================================
   KADRAN
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const CX = 155, CY = 155, R0 = 114, GAP = 16, RMAX = 140;

function mk(tag, a) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; }
function arcPath(r, a0, a1) {
  const p = a => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function notch(g, r, angDeg, h, col, w, op) {
  const a = angDeg * Math.PI / 180;
  g.appendChild(mk("line", {
    x1: (CX + (r - h / 2) * Math.cos(a)).toFixed(2), y1: (CY + (r - h / 2) * Math.sin(a)).toFixed(2),
    x2: (CX + (r + h / 2) * Math.cos(a)).toFixed(2), y2: (CY + (r + h / 2) * Math.sin(a)).toFixed(2),
    stroke: col, "stroke-width": w, "stroke-linecap": "round", opacity: op == null ? 1 : op
  }));
}

/* kronometre: dakikada bir çentik, 60 çentikte bir halka */
function drawStopwatchDial(gLayer, se, isStatic) {
  gLayer.innerHTML = "";
  const segs = segments(se);
  const start = se.startedAt;
  const T = ((se.endedAt || now()) - start) / 60000;
  const laps = Math.max(1, Math.ceil(T / 60));
  const s = Math.min(1, RMAX / (R0 + (laps - 1) * GAP));
  const g = mk("g", { transform: `translate(${CX} ${CY}) scale(${s.toFixed(4)}) translate(${-CX} ${-CY})` });
  gLayer.appendChild(g);

  const cAcc = css("--accent"), cTrk = css("--track"), cCool = css("--cool");

  for (let k = 0; k < laps; k++) {
    const from = k * 60, to = Math.min(T, (k + 1) * 60);
    if (to <= from) continue;
    const a0 = (from - k * 60) * 6 - 90, a1 = (to - k * 60) * 6 - 90;
    g.appendChild(mk("path", { d: arcPath(R0 + k * GAP, a0, Math.max(a1, a0 + .01)),
      fill: "none", stroke: cTrk, "stroke-width": 1.2, "stroke-linecap": "round" }));
  }

  const kindAt = m => {
    const ts = start + m * 60000;
    for (const sg of segs) if (ts >= sg.from && ts < sg.to) return sg.type;
    return "work";
  };
  const full = Math.floor(T);
  for (let m = 0; m < full; m++) {
    if (kindAt(m + .5) === "break") continue;
    const k = Math.floor(m / 60), mm = m % 60;
    let h = 6.5;
    if (mm === 0) h = 14; else if (mm % 15 === 0) h = 12; else if (mm % 5 === 0) h = 9;
    notch(g, R0 + k * GAP, mm * 6 - 90, h, cAcc, 1.8, 1);
  }

  for (const sg of segs) {
    if (sg.type !== "break") continue;
    let a = (sg.from - start) / 60000, b = Math.min((sg.to - start) / 60000, T);
    while (a < b) {
      const k = Math.floor(a / 60), end = Math.min(b, (k + 1) * 60);
      const a0 = (a - k * 60) * 6 - 90, a1 = (end - k * 60) * 6 - 90;
      if (a1 > a0 + .05) g.appendChild(mk("path", { d: arcPath(R0 + k * GAP, a0, a1),
        fill: "none", stroke: cCool, "stroke-width": 2.6, "stroke-linecap": "round", opacity: .5 }));
      a = end;
    }
  }

  if (T > 0 && !isStatic) {
    const k = Math.floor(T / 60), r = R0 + k * GAP, a = ((T % 60) * 6 - 90) * Math.PI / 180;
    const d = mk("circle", { cx: (CX + r * Math.cos(a)).toFixed(2), cy: (CY + r * Math.sin(a)).toFixed(2), r: 3.4, fill: cAcc });
    d.setAttribute("class", "head-dot");
    g.appendChild(d);
  }
}

/* pomodoro: hedef kadar çentik, teker teker kazınır */
function drawPomodoroDial(gLayer, target, doneMin) {
  gLayer.innerHTML = "";
  const g = mk("g", {});
  gLayer.appendChild(g);
  const cAcc = css("--accent"), cTrk = css("--track");
  const r = 118, n = Math.max(1, target);
  g.appendChild(mk("circle", { cx: CX, cy: CY, r: r, fill: "none", stroke: cTrk, "stroke-width": 1.2 }));
  const done = Math.max(0, Math.min(n, Math.floor(doneMin)));
  for (let i = 0; i < n; i++) {
    const carved = i < done;
    notch(g, r, i * (360 / n) - 90, (i % 5 === 0) ? 11 : 7, carved ? cAcc : cTrk, carved ? 1.9 : 1.4, 1);
  }
  if (done > 0 && done < n) {
    const a = (done * (360 / n) - 90) * Math.PI / 180;
    const d = mk("circle", { cx: (CX + r * Math.cos(a)).toFixed(2), cy: (CY + r * Math.sin(a)).toFixed(2), r: 3.4, fill: cAcc });
    d.setAttribute("class", "head-dot");
    g.appendChild(d);
  }
}

/* ============================================================
   TOHUMLU RASTGELELİK
   Aynı seans her açılışta aynı deseni verir. Kayıt görünürken
   değişmemeli — desen süslemeden çok parmak izi gibi çalışıyor.
   ============================================================ */
function hash32(t) { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng32(a) {
  a = a >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* dolgulu fırça şeridi: girişte dolgun, uçta incelir (bkz. tasarim/cubuk-laboratuvari.html) */
function firca(x0, y0, x1, y1, w0, w1, bend, segs, sivri) {
  segs = segs || 9; sivri = sivri || 1;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
  const px = -dy / L, py = dx / L;
  const ust = [], alt = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, e = Math.pow(1 - t, sivri), w = (w1 + (w0 - w1) * e) / 2;
    const bow = Math.sin(t * Math.PI) * bend;
    const cx = x0 + dx * t + px * bow, cy = y0 + dy * t + py * bow;
    ust.push([cx + px * w, cy + py * w]); alt.push([cx - px * w, cy - py * w]);
  }
  let d = "M" + ust[0][0].toFixed(2) + "," + ust[0][1].toFixed(2);
  for (let i = 1; i < ust.length; i++) d += "L" + ust[i][0].toFixed(2) + "," + ust[i][1].toFixed(2);
  for (let i = alt.length - 1; i >= 0; i--) d += "L" + alt[i][0].toFixed(2) + "," + alt[i][1].toFixed(2);
  return d + "Z";
}
/* çentiğin ağırlığı — saat başı en koyu, beşlikler orta, tek dakikalar en açık */
function tonu(mm) { return mm === 0 ? css("--is1") : mm % 5 === 0 ? css("--is2") : css("--is3"); }

/* ============================================================
   ÇUBUK — seansın kaydı, kertikten
   Sütun artık bir çizgi değil, GENİŞLİĞİ olan bir kalas; dakikada bir
   kalasa açılmış V kesit çentik (üstte ışık, altta gölge). Mola çentik
   bırakmaz, kalasın arkasında serin bir gölge + kenarda bir iz bırakır.
   Sayılmayan süre nerede olduğu bilinmediği için çubuğa yazılmaz; sağda
   kesikli bir ray olarak yalnız MİKTAR olarak durur. Konum uydurmuyoruz.
   Karar: bkz. tasarim/cubuk-laboratuvari.html "C · Kertik" ve 29-kertik-cubuk-karari.md.
   ============================================================ */

/* app seansı → çubuk verisi (dakika cinsinden, seans başına göre) */
function cubukVeri(se, ref) {
  const st = stats(se, ref);
  const end = se.endedAt || ref || now();
  const dk = Math.max(1, Math.round((end - se.startedAt) / 60000));
  const molalar = [];
  for (const sg of segments(se, ref)) {
    if (sg.type !== "break") continue;
    const a = (sg.from - se.startedAt) / 60000, b = (sg.to - se.startedAt) / 60000;
    if (b > a + .01) molalar.push([Math.max(0, a), Math.min(dk, b)]);
  }
  return { id: se.id, dk, molalar, bos: [], sayilmayan: Math.round(st.unconfirmed / 60000) };
}

/* bir günün bütün seansları tek çubukta: arka arkaya, aralarında bir boşluk */
function gunCubuk(list, key) {
  const sirali = list.slice().sort((a, b) => a.startedAt - b.startedAt);
  const molalar = [], bos = [];
  let m = 0, sayilmayan = 0, id = key || "";
  sirali.forEach((se, i) => {
    if (i > 0) { bos.push([m, m + 1]); m += 1; }
    const v = cubukVeri(se);
    for (const b of v.molalar) molalar.push([m + b[0], m + b[1]]);
    sayilmayan += v.sayilmayan;
    m += v.dk;
    id += se.id;
  });
  return { id, dk: Math.max(1, m), molalar, bos, sayilmayan };
}

/* v = { id, dk, molalar, bos, sayilmayan }  — hepsi dakika */
function cizCubuk(svg, v, o) {
  o = o || {};
  const RP = o.rp || 5.4, TOP = o.top || 5;
  let SW = o.sw || 30, GAP = o.gap || 13;
  const reveal = !!o.reveal, sure = o.sureMs || 1500;
  svg.innerHTML = "";
  const dk = Math.max(1, Math.round(v.dk));
  const kolon = Math.max(1, Math.ceil(dk / 60));
  const satir = kolon > 1 ? 60 : dk;
  const SAG = (v.sayilmayan > 0 ? 11 : 3);
  /* komşu güne taşmasın: o.maxW verilmişse (duvar hücreleri gibi sabit
     genişlikte yerlerde), kolon sayısı arttıkça (60+ dk'lık her seans
     yeni bir kolon açıyor) kalas kalınlığı ve aralık daralır — toplam
     genişlik hücreyi aşmaz, hangi çubuğun hangi güne ait olduğu okunur
     kalır. Tek kolonluk günlerde (≤60 dk) zaten sığıyor, dokunulmuyor. */
  if (o.maxW && kolon > 1) {
    const W0 = kolon * (SW + GAP) - GAP;
    const avail = Math.max(1, o.maxW - 8 - SAG);
    if (W0 > avail) {
      const s = Math.max(.28, avail / W0);
      SW *= s; GAP *= s;
    }
  }
  const KAL = SW * .62;                                     // kalasın kalınlığı
  const W = kolon * (SW + GAP) - GAP, H = TOP * 2 + Math.max(1, satir - 1) * RP;
  svg.setAttribute("viewBox", `-8 0 ${(W + 8 + SAG).toFixed(1)} ${H.toFixed(1)}`);
  svg.setAttribute("width", (W + 8 + SAG).toFixed(1));
  svg.setAttribute("height", H.toFixed(1));

  const acc = css("--accent"), ink = css("--ink"), m1 = css("--mola1"), m2 = css("--mola2"), kop = css("--kopru");
  const id = v.id || "x";
  const R = rng32(hash32(id));
  const j = []; for (let i = 0; i < dk * 4 + 40; i++) j.push(R());   // sabit titreşim havuzu
  const tur = m => {
    for (const b of (v.bos || [])) if (m >= b[0] && m < b[1]) return "bos";
    for (const b of (v.molalar || [])) if (m >= b[0] && m < b[1]) return "mola";
    return "is";
  };

  const g = mk("g", {}); svg.appendChild(g);
  const colX = k => k * (SW + GAP);
  const yOf = m => TOP + (m % 60) * RP;

  /* kalas — çubuğun kendisi. Düz değil, hafif düzensiz kenarlı ahşap;
     ılık köprü tonu (gri değil) ve birkaç düzensiz damar çizgisi. */
  for (let k = 0; k < kolon; k++) {
    const son = Math.min(60, dk - k * 60);
    const y0 = TOP - 3, y1 = yOf(son - 1) + 3, x = colX(k);
    const kg = mk("g", { "data-kalas": "1" });
    const Rk = rng32(hash32(id + "k" + k));
    let sol = "M" + x.toFixed(2) + "," + y0.toFixed(2); const sag = [];
    const N = Math.max(6, Math.round((y1 - y0) / 9));
    for (let i = 0; i <= N; i++) {
      const t = i / N, yy = y0 + (y1 - y0) * t;
      sol += "L" + (x + (Rk() - .5) * .9).toFixed(2) + "," + yy.toFixed(2);
      sag.push([x + KAL + (Rk() - .5) * 1.1, yy]);
    }
    for (let i = sag.length - 1; i >= 0; i--) sol += "L" + sag[i][0].toFixed(2) + "," + sag[i][1].toFixed(2);
    kg.appendChild(mk("path", { d: sol + "Z", fill: kop, opacity: .19 }));
    const Rd = rng32(hash32(id + "damar" + k));
    for (let dnr = 0; dnr < 3; dnr++) {
      const dx = KAL * (.22 + Rd() * .56);
      let dd = "M" + (x + dx).toFixed(2) + "," + y0.toFixed(2);
      for (let i = 1; i <= 10; i++) { const t = i / 10;
        dd += "L" + (x + dx + (Rd() - .5) * KAL * .16).toFixed(2) + "," + (y0 + (y1 - y0) * t).toFixed(2); }
      kg.appendChild(mk("path", { d: dd, fill: "none", stroke: kop, "stroke-width": .8, opacity: .24 }));
    }
    kg.appendChild(mk("line", { x1: x, y1: y0, x2: x, y2: y1, stroke: ink, "stroke-width": 1.1, opacity: .30 }));
    kg.appendChild(mk("line", { x1: x + KAL, y1: y0, x2: x + KAL, y2: y1, stroke: ink, "stroke-width": .8, opacity: .15 }));
    if (reveal) { kg.style.opacity = 0; kg.style.transition = "opacity .5s ease";
      setTimeout(() => kg.style.opacity = 1, 60 + k * 90); }
    g.appendChild(kg);
  }

  /* mola — kalasta hiç kesik yok, arkasında serin bir gölge bandı + kenarda bir iz.
     Uzunluk doğrudan okunur: süre dağılımı ölçmeden görülür. */
  for (const b of (v.molalar || [])) {
    let a = b[0];
    while (a < Math.min(b[1], dk)) {
      const k = Math.floor(a / 60), son = Math.min(b[1], dk, (k + 1) * 60);
      if (son > a) {
        const mg = mk("g", { "data-mola": "1" });
        mg.appendChild(mk("rect", { x: colX(k) + .6, y: yOf(a) - RP * .45, width: KAL - 1.2,
          height: Math.max(1.5, (son - 1 - a) * RP + RP * .9), fill: m1, opacity: .085 }));
        mg.appendChild(mk("line", { x1: colX(k) - 3.6, y1: yOf(a) - RP * .45, x2: colX(k) - 3.6,
          y2: yOf(son - 1) + RP * .45, stroke: m2, "stroke-width": Math.max(1.5, SW * .065),
          "stroke-linecap": "round", opacity: .66 }));
        [yOf(a) - RP * .45, yOf(son - 1) + RP * .45].forEach(yy =>
          mg.appendChild(mk("line", { x1: colX(k) - 5, y1: yy, x2: colX(k) + KAL * .42, y2: yy,
            stroke: m2, "stroke-width": .75, opacity: .42 })));
        if (reveal) { mg.style.opacity = 0; mg.style.transition = "opacity .6s ease";
          setTimeout(() => mg.style.opacity = 1, 200 + (a / dk) * sure); }
        g.appendChild(mg);
      }
      a = son;
    }
  }

  /* çentikler — kalasa açılmış V kesit. İki yüz: ışık ve gölge.
     bos/mola dakikaları burada atlanır — o dakikaya kesik atılmaz. */
  const adim = Math.min(.02, (sure / 1000) / Math.max(1, dk));
  let n = 0;
  for (let m = 0; m < dk; m++) {
    if (tur(m) !== "is") continue;
    const k = Math.floor(m / 60), mm = m % 60;
    const r1 = j[m * 4], r2 = j[m * 4 + 1], r3 = j[m * 4 + 2], r4 = j[m * 4 + 3];
    const derin = KAL * (mm === 0 ? .94 : mm % 15 === 0 ? .80 : mm % 5 === 0 ? .66 : .48) * (1 + (r1 - .5) * .30);
    const x = colX(k), y = yOf(m) + (r2 - .5) * RP * .34;
    const kal = RP * (mm === 0 ? .62 : mm % 5 === 0 ? .50 : .38) * (1 + (r3 - .5) * .34);
    const egim = (r4 - .5) * RP * .5;

    const ng = mk("g", { "data-centik": "1" });
    /* gölge yüzü — kesiğin alt duvarı, koyu, çentiğin ağırlığını taşıyan yüz */
    ng.appendChild(mk("path", {
      d: `M${x.toFixed(2)},${(y + kal * .5).toFixed(2)}` +
         `L${(x + derin).toFixed(2)},${(y + egim + kal * .16).toFixed(2)}` +
         `L${(x + derin).toFixed(2)},${(y + egim - kal * .16).toFixed(2)}` +
         `L${x.toFixed(2)},${(y - kal * .5).toFixed(2)}Z`,
      fill: tonu(mm), opacity: (mm === 0 ? .95 : .72 + r3 * .2).toFixed(3) }));
    /* ışık yüzü — kesiğin üst kenarı, ince ve açık */
    ng.appendChild(mk("path", {
      d: firca(x, y - kal * .5, x + derin * .94, y + egim - kal * .14, kal * .30, kal * .10, 0, 5),
      fill: css("--bg"), opacity: .42 }));
    /* dip gölgesi */
    ng.appendChild(mk("path", {
      d: firca(x + .4, y + kal * .52, x + derin * .86, y + egim + kal * .20, kal * .26, kal * .08, 0, 5),
      fill: ink, opacity: .20 }));
    if (reveal) {
      ng.style.opacity = 0; ng.style.transition = "opacity .3s ease";
      setTimeout(() => ng.style.opacity = 1, (.05 + n * adim) * 1000);
    }
    g.appendChild(ng);
    n++;
  }

  /* sayılmayan süre — miktar, konum değil.
     Son kalasın sağında kesikli bir ray; kaç çentiğin sayılmadığını gösterir. */
  if (v.sayilmayan > 0) {
    const k = kolon - 1, boyu = Math.min(v.sayilmayan, satir);
    const x = colX(k) + KAL + 5;
    const l = mk("line", { x1: x, y1: TOP, x2: x, y2: TOP + Math.max(1, boyu - 1) * RP,
      stroke: acc, "stroke-width": 1.6, "stroke-linecap": "round",
      "stroke-dasharray": (RP * .55).toFixed(2) + " " + (RP * .45).toFixed(2), opacity: .42 });
    if (reveal) { l.style.opacity = 0; l.style.transition = "opacity .5s ease";
      setTimeout(() => l.style.opacity = .42, 120 + n * adim * 1000); }
    g.appendChild(l);
  }
  return (.05 + n * adim) * 1000 + 420;
}

/* ============================================================
   TAŞ — pomodoro gününün duvar kaydı
   Çubuk mürekkep/sıvı dilinde çiziyor (kronometre = ebru, bkz.
   27-sanat-ayrisimi.md). Pomodoro katı/sayılabilir dilde: her
   tamamlanan pomodoro bir taş, boyu √süre ile büyür — 25 dk ≠ 60 dk.
   Bir güne çok taş sığmayınca (örn. 15-20 pomodoro tek günde) hepsi
   aynı oranda küçülür; asla komşu güne taşmaz, asla üst üste yığılıp
   okunmaz bir lekeye dönüşmez. Bir tabandan sonra sıkışma kaçınılmaz
   hâle gelir — bu bilerek görünür bırakılıyor, gizlenmiyor.
   ============================================================ */
function rYaricapTas(dk, taban) {
  const m = (dk && typeof dk === "object") ? dk.dk : dk;
  return taban * Math.sqrt(Math.max(1, m) / 25);
}

function paketleTas(dkList, taban, mevcutGenislik, adimKat, minOlcek) {
  const ham = dkList.map(dk => rYaricapTas(dk, taban));
  if (!ham.length) return { r: [], olcek: 1 };
  const gerekli = ham.reduce((a, r) => a + r * adimKat, 0);
  const olcek = gerekli > mevcutGenislik ? Math.max(minOlcek, mevcutGenislik / gerekli) : 1;
  return { r: ham.map(r => r * olcek), olcek };
}

/* Tek taş — Kum Bahçesi uyumlu organik nehir çakılı. FBM gürültüsü,
   zemin gölgesi ve ışık parıltısıyla kâğıtta zengin derinlik sağlar.

   KIRIK TAŞ (vaat tutulmadı): çatlak taşın ÜSTÜNE çizilen bir çizgi
   değil — silüetin kendisi ikiye ayrılır. Küçük parça hafifçe kayar ve
   döner, aradan zemin gölgesi görünür. Fay hattı konkoidal: yumuşak yay
   değil, kırıklı testere.
   ALTIN (kintsugi): kırıktan SONRA aynı gün tamamlanan bir pomodoro
   varsa onarım hak edilmiştir — parçalar neredeyse kapanır ve dikiş
   altınla doldurulur. Altın bedava değil; dönüş bedelidir.
   ============================================================ */
function tasSvg(g, cx, tabanY, r, seed, isBottom, isKirik, isAltin, isTozlu) {
  const R = rng32(seed);
  const rot = (R() - .5) * .35;
  const el = .76 + R() * .20;
  const seedT = seed;
  const N = 12;
  const cy = tabanY - r;
  const nokta = i => {
    const a = rot + i / N * Math.PI * 2;
    const rad = r * (.90 + fbm(Math.cos(a) * 1.8, Math.sin(a) * 1.8, seedT % 89) * .22);
    return [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * el];
  };
  const yol = (dx, dy, sx, sy) => {
    let d = "";
    for (let i = 0; i <= N; i++) {
      const [x, y] = nokta(i);
      const px = cx + (x - cx) * (sx || 1) + dx;
      const py = cy + (y - cy) * (sy || 1) + dy;
      d += (i ? "L" : "M") + px.toFixed(2) + "," + py.toFixed(2) + " ";
    }
    return d + "Z";
  };
  const tasRengi = css("--tas") || css("--ink");
  const golgeRengi = css("--tas-golge") || css("--ink");
  const golgeOp = parseFloat(css("--tas-golge-o")) || .18;
  const isikRengi = css("--tas-isik") || css("--bg");
  const isikOp = parseFloat(css("--tas-isik-o")) || .34;
  const parcaOp = parseFloat(css("--tas-parca-o")) || .84;

  /* 1. Zemin gölgesi — kırılsa da taş yerinde durur, gölge bütündür */
  g.appendChild(mk("path", {
    d: yol(r * .08, r * .78, 1.15, .28),
    fill: golgeRengi, opacity: golgeOp
  }));

  if (!isKirik) {
    /* 2. Taş gövdesi */
    g.appendChild(mk("path", { d: yol(0, 0, 1, 1), fill: tasRengi, opacity: .94 }));
    /* 3. Işık parıltısı */
    g.appendChild(mk("ellipse", {
      cx: (cx - r * .24).toFixed(2), cy: (cy - r * .22).toFixed(2),
      rx: (r * .36).toFixed(2), ry: (r * .18).toFixed(2),
      fill: isikRengi, opacity: isikOp, transform: `rotate(-15 ${cx.toFixed(2)} ${cy.toFixed(2)})`
    }));
    return;
  }

  /* ---------- KIRIK ---------- */
  const a = Math.floor(R() * N) % N;
  const b = (a + 5 + Math.floor(R() * 3)) % N;
  const PA = nokta(a), PB = nokta(b);
  const vx = PB[0] - PA[0], vy = PB[1] - PA[1];
  const L = Math.hypot(vx, vy) || 1;
  const nx = -vy / L, ny = vx / L;

  /* fay hattı: uçlarda sapma sıfır, ortada keskin kırılmalar */
  const K = 5, fay = [PA];
  for (let i = 1; i < K; i++) {
    const t = i / K, s = Math.sin(t * Math.PI);
    const j = (R() - .5) * r * .38 * s;
    fay.push([PA[0] + vx * t + nx * j, PA[1] + vy * t + ny * j]);
  }
  fay.push(PB);
  const kirikD = fay.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");

  const arc = (from, to) => { const o = []; let i = from; for (;;) { o.push(nokta(i)); if (i === to) break; i = (i + 1) % N; } return o; };
  const ic = fay.slice(1, -1);
  const parca1 = arc(a, b).concat(ic.slice().reverse());
  const parca2 = arc(b, a).concat(ic);
  const kapali = pts => pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ") + " Z";
  const alan = pts => { let s = 0; for (let i = 0; i < pts.length; i++) { const q = pts[(i + 1) % pts.length]; s += pts[i][0] * q[1] - q[0] * pts[i][1]; } return Math.abs(s) / 2; };
  const kucukIlk = alan(parca1) < alan(parca2);
  const buyuk = kucukIlk ? parca2 : parca1;
  const kucuk = kucukIlk ? parca1 : parca2;

  /* küçük parçanın kayma yönü: bütünün merkezinden dışarı */
  const mrk = pts => { let x = 0, y = 0; pts.forEach(p => { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; };
  const mk2 = mrk(kucuk);
  let ox = mk2[0] - cx, oy = mk2[1] - cy;
  const on = Math.hypot(ox, oy) || 1; ox /= on; oy /= on;
  const ayrik = isAltin ? r * .03 : r * .15;
  const aci = (isAltin ? .9 : 3.6) * (R() < .5 ? -1 : 1);
  const my = (fay[0][1] + fay[K][1]) / 2, mx = (fay[0][0] + fay[K][0]) / 2;

  /* 2a. büyük parça */
  g.appendChild(mk("path", { d: kapali(buyuk), fill: tasRengi, opacity: .94 }));

  /* 2b. kırık yüzeyin kıl payı gölgesi. DİKKAT: burada --bg renkli kalın bir
     çizgi çizme — taş zaten neredeyse siyah, açık renkli dikiş taşı DELİK
     gösteriyor (bir kez bu hataya düşüldü). Kırık, silüetin ayrılmasından
     ve iki parçanın farklı ışık almasından okunmalı. */
  g.appendChild(mk("path", {
    d: kirikD, fill: "none", stroke: tasRengi,
    "stroke-width": Math.max(.6, r * .06).toFixed(2),
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 1
  }));

  /* 2c. küçük parça — kaymış, dönmüş ve taze yüzü olduğu için bir tık açık */
  const gk = mk("g", {
    transform: `translate(${(ox * ayrik).toFixed(2)},${(oy * ayrik).toFixed(2)}) rotate(${aci.toFixed(2)} ${mx.toFixed(2)} ${my.toFixed(2)})`
  });
  gk.appendChild(mk("path", { d: kapali(kucuk), fill: tasRengi, opacity: parcaOp }));
  g.appendChild(gk);

  /* 2d. Terk edilmiş / rüzgar aşınması (tozlu yüzey ve mikro kum zerrecikleri) */
  if (isTozlu) {
    const tozRengi = css("--line") || css("--sand-ridge") || tasRengi;
    g.appendChild(mk("path", {
      d: kirikD, fill: "none", stroke: tozRengi,
      "stroke-width": Math.max(1.2, r * .18).toFixed(2),
      "stroke-linecap": "round", "stroke-linejoin": "round", opacity: .28
    }));
    const Rtoz = rng32(((seedT | 0) + 7733) >>> 0);
    const tozSayisi = Math.min(18, Math.max(6, Math.floor(r * .8)));
    for (let i = 0; i < tozSayisi; i++) {
      const fi = Math.floor(Rtoz() * (K - 1));
      const p1 = fay[fi], p2 = fay[fi + 1] || fay[K];
      const sub = Rtoz();
      const px = p1[0] + (p2[0] - p1[0]) * sub + (Rtoz() - .5) * r * .35;
      const py = p1[1] + (p2[1] - p1[1]) * sub + (Rtoz() - .5) * r * .28;
      const rad = (.4 + Rtoz() * .55).toFixed(2);
      g.appendChild(mk("circle", {
        cx: px.toFixed(2), cy: py.toFixed(2), r: rad,
        fill: tozRengi, opacity: (.35 + Rtoz() * .40).toFixed(2)
      }));
    }
  }

  if (!isAltin) return;

  /* 3. KINTSUGI — dikişe dökülen altın vernik.
     Altın yol, fayın uçlarından biraz içeri çekilir: yuvarlak uçlu kalın
     çizgi taşın dışına taşarsa kenarda serseri altın lekeleri kalıyor. */
  const altin = css("--altin") || css("--warn");
  const altinP = css("--altin-p") || css("--altin") || css("--warn");
  const iceri = (p, q, k) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
  const aFay = fay.slice();
  aFay[0] = iceri(fay[0], fay[1], .16);
  aFay[K] = iceri(fay[K], fay[K - 1], .16);
  const fayD = aFay.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
  g.appendChild(mk("path", {
    d: fayD, fill: "none", stroke: altin,
    "stroke-width": Math.max(1.2, r * .30).toFixed(2),
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: .20
  }));
  g.appendChild(mk("path", {
    d: fayD, fill: "none", stroke: altin,
    "stroke-width": Math.max(.9, r * .105).toFixed(2),
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: .95
  }));
  if (r > 16) g.appendChild(mk("path", {
    d: fayD, fill: "none", stroke: altinP,
    "stroke-width": Math.max(.5, r * .05).toFixed(2),
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: .75
  }));

  /* 3b. kılcal — altın tek bir çizgi olarak okunmasın */
  if (r > 9) {
    const ki = 1 + Math.floor(R() * (K - 2));
    const p = fay[ki], q = fay[ki + 1];
    const dl = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1;
    const tx = (q[0] - p[0]) / dl, ty = (q[1] - p[1]) / dl;
    const yon = R() < .5 ? 1 : -1;
    const th = Math.atan2(ty, tx) + yon * 1.05;
    let uz = r * (.20 + R() * .16);
    const ux = p[0] + Math.cos(th) * uz, uy = p[1] + Math.sin(th) * uz;
    if (Math.hypot(ux - cx, (uy - cy) / (el || 1)) > r * .70) uz = 0;
    if (uz > 0) g.appendChild(mk("path", {
      d: `M${p[0].toFixed(2)},${p[1].toFixed(2)} L${(p[0] + Math.cos(th) * uz).toFixed(2)},${(p[1] + Math.sin(th) * uz).toFixed(2)}`,
      fill: "none", stroke: altin, "stroke-width": Math.max(.6, r * .07).toFixed(2),
      "stroke-linecap": "round", opacity: .8
    }));
  }

  /* 3c. onarılan taş ışığını geri kazanır — ama sönük */
  g.appendChild(mk("ellipse", {
    cx: (cx - r * .24).toFixed(2), cy: (cy - r * .22).toFixed(2),
    rx: (r * .34).toFixed(2), ry: (r * .17).toFixed(2),
    fill: isikRengi, opacity: (isikOp * .58).toFixed(3), transform: `rotate(-15 ${cx.toFixed(2)} ${cy.toFixed(2)})`
  }));
}

/* Bir günün bütün pomodoroları — çubuğun taş karşılığı. Ayrı seanslar
   burada zaten ayrı taş olarak görünüyor, çubuktaki gibi araya boşluk
   koymaya gerek yok. */
function gunTas(list, key, gunListesi) {
  const kirikMi = se => tasKirikMi(se);
  const sirali = list.slice().sort((a, b) => a.startedAt - b.startedAt);
  const dkList = sirali.map(se => ({
    dk: Math.max(1, Math.round(stats(se).confirmed / 60000)),
    kirik: kirikMi(se),
    tozlu: molaKirar(se),
    target: se.target || 0,
    at: se.startedAt
  }));
  /* KINTSUGI HAKKI: kırık bir taş, aynı gün ONDAN SONRA tamamlanmış bir
     pomodoro varsa altınla onarılır. Onarımı kırılma değil, dönüş kazandırır.
     Ölçüt günün tamamına bakar (gunListesi) — tek seans gösterilirken bile. */
  const gun = (gunListesi || list).slice().sort((a, b) => a.startedAt - b.startedAt);
  let sonrasiTam = [];
  let bayrak = false;
  for (let i = gun.length - 1; i >= 0; i--) {
    sonrasiTam[i] = bayrak;
    const se = gun[i];
    if (se.endedAt && se.mode === "pomodoro" && (se.target || 0) > 0 && !kirikMi(se)) bayrak = true;
  }
  const hak = {};
  gun.forEach((se, i) => { hak[se.id] = sonrasiTam[i]; });
  sirali.forEach((se, i) => { dkList[i].altin = !!(dkList[i].kirik && hak[se.id]); });
  return { id: key || "", dkList };
}

/* Bir günün pomodoroları — akıllı çok katmanlı karesansui zen çakıl yatağı.
   1-4 taş tek katmanda, 5-9 taş 2 katmanda, 10-25 taş 3 katmanlı
   doğal çakıl höyüğü gibi yerleşir. Altında hafif kum tırmığı halkaları
   ile karesansui bahçe zeminine oturur. */
function cizTas(svg, v, o) {
  o = o || {};
  const TABAN = o.taban || 7.5, ADIM = 1.55, MINOLCEK = o.minOlcek != null ? o.minOlcek : .22;
  svg.innerHTML = "";
  const dkList = v.dkList || [];
  if (!dkList.length) { svg.setAttribute("viewBox", "0 0 1 1"); svg.setAttribute("width", "1"); svg.setAttribute("height", "1"); return; }

  const n = dkList.length;
  const maxW = o.maxW || (TABAN * 5.6);
  
  let katmanSayisi = 1;
  if (n > 9) katmanSayisi = 3;
  else if (n > 4) katmanSayisi = 2;

  let baseTaban = TABAN;
  if (katmanSayisi === 2) baseTaban = TABAN * 0.72;
  if (katmanSayisi === 3) baseTaban = TABAN * 0.52;

  const katmanlar = [];
  if (katmanSayisi === 1) {
    katmanlar.push(dkList);
  } else if (katmanSayisi === 2) {
    const k1 = Math.ceil(n * 0.58);
    katmanlar.push(dkList.slice(0, k1));
    katmanlar.push(dkList.slice(k1));
  } else {
    const k1 = Math.ceil(n * 0.45);
    const k2 = Math.ceil(n * 0.32);
    katmanlar.push(dkList.slice(0, k1));
    katmanlar.push(dkList.slice(k1, k1 + k2));
    katmanlar.push(dkList.slice(k1 + k2));
  }

  const TOP = o.top != null ? o.top : 3;
  let totalH = baseTaban * 2.4 * katmanSayisi + TOP * 2;
  let totalW = maxW + TOP * 2;
  if (katmanSayisi === 1) {
    const pak0 = paketleTas(dkList, baseTaban, maxW, ADIM, MINOLCEK);
    const sumW = pak0.r.reduce((a, r) => a + r * 1.55, 0) + TOP * 2;
    totalW = Math.min(maxW + TOP * 2, Math.max(baseTaban * 2 + TOP * 2, sumW));
  }

  const g = mk("g", {}); svg.appendChild(g);

  // Karesansui Kum Tırmığı Haleleri (Öbek altındaki hafif tırmık halkaları)
  const cxMid = totalW / 2;
  const cyMid = totalH - TOP;
  const rx = Math.min(totalW * 0.45, 14 + n * 0.95);
  const ry = Math.min(12, 5 + n * 0.32);
  g.appendChild(mk("ellipse", {
    cx: cxMid.toFixed(2), cy: cyMid.toFixed(2), rx: (rx + 4).toFixed(2), ry: (ry + 2.5).toFixed(2),
    fill: "none", stroke: css("--line"), "stroke-width": .7, opacity: .35, "stroke-dasharray": "3 2"
  }));
  g.appendChild(mk("ellipse", {
    cx: cxMid.toFixed(2), cy: cyMid.toFixed(2), rx: rx.toFixed(2), ry: ry.toFixed(2),
    fill: "none", stroke: css("--line"), "stroke-width": 1.0, opacity: .55
  }));

  let globalIdx = 0;
  katmanlar.forEach((kSeans, kIdx) => {
    const pak = paketleTas(kSeans, baseTaban, maxW, ADIM, MINOLCEK);
    const rl = pak.r;
    const tabanY = totalH - TOP - (kIdx * (baseTaban * 1.55));
    const stepX = maxW / Math.max(1, rl.length);

    rl.forEach((r, i) => {
      const cx = TOP + (i * stepX) + (stepX * 0.5) + ((kIdx % 2 !== 0) ? (stepX * 0.15) : 0);
      const item = kSeans[i];
      const isKirik = !!(item && typeof item === "object" && item.kirik);
      const isAltin = !!(item && typeof item === "object" && item.altin);
      const isTozlu = !!(item && typeof item === "object" && item.tozlu);
      tasSvg(g, cx, tabanY, r, hash32((v.id || "x") + "|" + globalIdx), kIdx === 0, isKirik, isAltin, isTozlu);
      globalIdx++;
    });
  });

  svg.setAttribute("viewBox", `0 0 ${totalW.toFixed(1)} ${totalH.toFixed(1)}`);
  svg.setAttribute("width", totalW.toFixed(1));
  svg.setAttribute("height", totalH.toFixed(1));
}

/* ============================================================
   AKIŞ — seans sürerken arkada oluşan alan
   Alan seansın kimliğinden türer: aynı seans hep aynı desen.
   Dakikada bir grup çizgi eklenir; ekranda hiçbir şey oynamaz —
   sadece sessizce kalabalıklaşır. Mola dakikaları serin ve seyrek.
   Kadranın çevresi ve alt şerit her zaman açık kalır.
   ============================================================ */
const AK = { sid: null, serit: [], sira: null, tohum: 0, off: null, offCtx: null, ctx: null,
             w: 0, h: 0, pw: 0, ph: 0, dpr: 1, ciz: 0, lastMin: -1, hazir: false, kapali: false,
             tanit: false,
             /* kademeli sıklaşma: 1. kademeden itibaren, ihtiyaç anında hesaplanır */
             ek: [], ekKapali: false, ruzgarDamga: "" };

/* Akış'ın yönleri.

   katman: [pay, kalınlık, karanlık α, açık α, yıkama kalınlığı]
   Paylar 1'e tamamlanır. Bir şeridin hangi katmana düştüğü rastgele değil,
   alanın kendi gürültüsünden geliyor (bkz. akisSira): kalın damarlar bölge
   bölge kümeleniyor, ebru kâğıdındaki gibi.

   ton/isik: şeridin ağırlığına göre renk kayması. Kalın damar biraz daha
   koyu ve derin, kılcal tüy biraz daha açık. Yanardönerlik buradan geliyor.

   alan: şeritlerin geometrisi.
     dsep  şerit aralığı — komşuluk taraması 3×3 olduğu için gerçek aralık ~3×dsep
     maxl  bir şeridin en fazla uzunluğu
     dene  kaç başlangıç noktası denenecek (maliyetin çoğu burada)
     af    açı alanının üç oktavı: sayı büyüdükçe frekans artar, desen kıvrılır.
           Eski değer (1 ve 3) neredeyse düz bir alan veriyordu — ekranı boş
           gösteren asıl sebep buydu, saydamlık değil.
     of    doluş sırasının frekansı, jit  o sıraya karışan rastgelelik.
           Düşük of = alan tek bir kütle hâlinde büyür ve seansın yarısında
           ekranın yarısı boş kalır. Yüksek of + biraz jit = birkaç yerden
           birden büyür, her an dolu görünür. */
const AKMOD = {
  /* v1 — uygulamanın ilk hâli. Karşılaştırma için duruyor. */
  sade:     { dolum: 120, alt: .19, halo: [.12, .42], ton: 0,  isik: 0,
              alan: { dsep: 3.2, maxl: 900, dene: 14000, af: [1, 3, 0], of: 1, jit: 0 },
              katman: [[1, 1.05, .30, .20, 0]] },
  /* aynı alfabe, sadece görünür: sık alan, tek kalınlık */
  belirgin: { dolum: 80,  alt: .11, halo: [.12, .42], ton: 0,  isik: 0,
              alan: { dsep: 1.7, maxl: 700, dene: 22000, af: [2.6, 6, 13], of: 4, jit: .25 },
              katman: [[1, 1.05, .34, .24, 0]] },
  /* ebru — kalın damarlar, kılcal tüyler, altında geniş bir yıkama */
  ebru:     { dolum: 80,  alt: .11, halo: [.12, .42], ton: 16, isik: .11,
              alan: { dsep: 1.7, maxl: 700, dene: 22000, af: [2.6, 6, 13], of: 4, jit: .25 },
              katman: [[.62, .80, .16, .11, 0],
                       [.28, 1.35, .34, .24, 0],
                       [.10, 2.30, .52, .40, 9]],
              /* fırça basıncı: şerit sabit kalınlıkta değil (24-sanat-dili.md §2.3) */
              firca: 9,
              /* molada zıt renk yok — aynı mürekkep, zayıflamış (20-sanat-geri-bildirim.md m.3) */
              silikMola: { alfa: .42, doygunluk: .55, aciklik: .34 },
              /* KADEMELİ SIKLAŞMA — statikleşmenin çözümü.
                 say  : kaç kademe (80 · 240 · 720 · 2160 · 6480 dk)
                 kat  : her kademenin süresi bir öncekinin kaç katı
                 bol  : şerit aralığı her kademede kaça bölünür (sıklaşma)
                 incelme / katki : mürekkep korunumu — resim koyulaşmasın, incelsin
                 tonB / isikB / yikamaB : ince kademelerde ton yelpazesi açılsın
                 TOHUM VE AÇI ALANI DEĞİŞMİYOR: yeni şeritler eskilerin ARASINA,
                 onlara paralel giriyor. Kesişme yok → moiré yok. */
              kademe: { say: 5, kat: 3, bol: 1.5, deneUs: 1.35,
                        incelme: .78, katki: .58, tonB: .42, isikB: .34, yikamaB: .55,
                        butce: 900 } }
};
let AKSEC = "ebru";

/* Seansın akisV damgası → hangi yönle çizilecek. Yeni bir yöne geçilirse
   buraya 3 eklenir ve AKIS_GUNCEL 3 olur; eskiler eski hâllerini korur. */
const AKIS_SURUM = { 1: "sade", 2: "ebru" };
const AKIS_GUNCEL = 2;
function akisYonu(se) { return AKIS_SURUM[se && se.akisV] || AKIS_SURUM[1]; }

/* #RRGGBB → [h,s,l]. Palet değişkenleri hep hex; değilse null döner ve
   renk olduğu gibi kullanılır. */
function hexHsl(x) {
  const m = /^#([0-9a-f]{6})$/i.exec(x || ""); if (!m) return null;
  const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

/* n : kaçıncı kademe (ince kademelerde ton yelpazesi açılır — zaman "daha koyu"
       değil "daha yanardöner" olarak okunsun)
   silik : mola. Aynı mürekkep, doygunluğu ve ağırlığı düşmüş. */
function akisRenk(hsl, taban, q, M, n, silik, koyu) {
  if (!hsl || !M.ton) return taban;
  const KD = M.kademe, g = n || 0;
  const k = q * 2 - 1;                       /* -1 tüy … +1 damar */
  const ton = M.ton * (KD ? 1 + KD.tonB * g : 1);
  const isik = M.isik * (KD ? 1 + KD.isikB * g : 1);
  const h = (hsl[0] + k * ton + 360) % 360;
  let l = Math.min(.94, Math.max(.06, hsl[2] - k * isik)), sat = hsl[1];
  if (silik && M.silikMola) {
    sat *= M.silikMola.doygunluk;
    l = koyu ? l * (1 - M.silikMola.aciklik * .41) : l + (1 - l) * M.silikMola.aciklik;
  }
  return "hsl(" + h.toFixed(1) + "," + (sat * 100).toFixed(1) + "%," + (l * 100).toFixed(1) + "%)";
}

function h2i(i, j, s) {
  let n = Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263) ^ Math.imul(s | 0, 362437);
  n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = h2i(i, j, s), b = h2i(i + 1, j, s), c = h2i(i, j + 1, s), d = h2i(i + 1, j + 1, s);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, s) { return vnoise(x, y, s) * .6 + vnoise(x * 2.1, y * 2.1, s + 7) * .27 + vnoise(x * 4.3, y * 4.3, s + 19) * .13; }

/* FIRÇA BASINCI — şeridi tek `stroke` yerine kalınlığı değişen parçalar hâlinde
   çizer. Uçlar ince, gövde dolgun, üstüne şeridin kendi gürültüsünden gelen el
   titremesi. `24-sanat-dili.md` §2.3: "doku eklenen bir katman değil, çizginin
   kendi davranışından çıkmalı — kâğıt dokusu değil, fırça basıncı."
   Parça sayısı sabit tutuluyor (uzun şerit = uzun parça), maliyet şerit başına
   sabit kalsın diye. */
function fircaCiz(g, p, tabanKalinlik, tohum, parca) {
  const n = p.length >> 1;
  if (n < 3) return;
  const adim = Math.max(2, Math.ceil(n / parca));
  for (let a = 0; a < n - 1; a += adim) {
    const b = Math.min(n - 1, a + adim);
    const t = (a + b) / 2 / (n - 1);
    const uc = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, t))), .42);
    const bas = 1 + (fbm(t * 4.1 + tohum * .013, tohum * .07, tohum | 0) - .5) * .85;
    const w = tabanKalinlik * (.26 + .74 * uc) * bas;
    if (w <= .02) continue;
    g.lineWidth = w;
    g.beginPath(); g.moveTo(p[a * 2], p[a * 2 + 1]);
    for (let k = a + 1; k <= b; k++) g.lineTo(p[k * 2], p[k * 2 + 1]);
    g.stroke();
  }
}

/* akış çizgilerini bir kere hesapla; sonra sadece daha fazlası çizilir */
/* dsep/dene/eskiler/tohumEk verilmezse eski davranış birebir korunur.
   Verilirse: aynı tohum, aynı açı alanı, daha sık şerit — ve `eskiler`deki
   şeritler ızgaraya işaretlendiği için yeni şeritler onların ARASINA girer. */
function akisAlan(seed, W, H, A, dsep, dene, eskiler, tohumEk) {
  const R = rng32(seed + (tohumEk || 0));
  const DSEP = dsep || A.dsep, STEP = 2.0, MAXL = A.maxl;
  const gw = Math.ceil(W / DSEP) + 2, gh = Math.ceil(H / DSEP) + 2;
  const dolu = new Uint8Array(gw * gh);
  const f = A.af;
  const aci = (x, y) => (fbm(x / (W / f[0]), y / (W / f[0]), seed) * 2 - 1) * Math.PI * 1.9
                      + (fbm(x / (W / f[1]), y / (W / f[1]), seed + 3) - .5) * 1.1
                      + (f[2] ? (fbm(x / (W / f[2]), y / (W / f[2]), seed + 11) - .5) * .5 : 0);
  const bosMu = (x, y) => {
    const gi = (x / DSEP | 0) + 1, gj = (y / DSEP | 0) + 1;
    if (gi < 0 || gj < 0 || gi >= gw || gj >= gh) return false;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const q = (gj + b) * gw + (gi + a); if (q >= 0 && q < dolu.length && dolu[q]) return false;
    }
    return true;
  };
  const isaretle = (x, y) => { const gi = (x / DSEP | 0) + 1, gj = (y / DSEP | 0) + 1;
    if (gi >= 0 && gj >= 0 && gi < gw && gj < gh) dolu[gj * gw + gi] = 1; };

  /* önceki kademelerin şeritleri yerlerini korusun */
  if (eskiler) for (const p of eskiler) for (let k = 0; k < p.length; k += 2) isaretle(p[k], p[k + 1]);

  /* Doluş sırası: alan tek kütle hâlinde değil, birkaç yerden birden büyüsün. */
  const denemeler = [];
  const DENE = dene || A.dene;
  for (let i = 0; i < DENE; i++) {
    const x = R() * W, y = R() * H;
    denemeler.push({ x, y, o: fbm(x / (W / A.of), y / (W / A.of), seed + 41) * (1 - A.jit) + R() * A.jit });
  }
  denemeler.sort((a, b) => a.o - b.o);

  const seritler = [];
  for (const d of denemeler) {
    if (!bosMu(d.x, d.y)) continue;
    let pts = [];
    for (const yon of [1, -1]) {
      let x = d.x, y = d.y; const par = [];
      for (let k = 0; k < MAXL / STEP; k++) {
        const a = aci(x, y);
        x += Math.cos(a) * STEP * yon; y += Math.sin(a) * STEP * yon;
        if (x < -20 || y < -20 || x > W + 20 || y > H + 20) break;
        if (k > 2 && !bosMu(x, y)) break;
        par.push(x, y);
      }
      if (yon === 1) pts.push(...par);
      else { const rev = []; for (let k = par.length - 2; k >= 0; k -= 2) rev.push(par[k], par[k + 1]); pts.unshift(...rev); }
    }
    if (pts.length < 14) continue;
    for (let k = 0; k < pts.length; k += 2) isaretle(pts[k], pts[k + 1]);
    seritler.push(Float32Array.from(pts));
  }
  return seritler;
}

/* Her şerit için 0..1 arası bir "ağırlık sırası". Şeridin orta noktasındaki
   gürültüden çıkıyor, sonra sıralanıp yüzdeye çevriliyor — böylece katman
   payları (%62 tüy, %28 orta, %10 damar) her seansta birebir tutuyor ve
   kalın damarlar rastgele serpilmek yerine bölge bölge kümeleniyor. */
function akisSira(seritler, W, seed) {
  const n = seritler.length, w = new Float32Array(n), idx = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const p = seritler[i], k = (p.length >> 2) << 1;
    w[i] = fbm(p[k] / W * 1.7, p[k + 1] / W * 1.7, seed + 91);
    idx[i] = i;
  }
  const sirali = Array.from(idx).sort((a, b) => w[a] - w[b]);
  const s = new Float32Array(n);
  for (let r = 0; r < n; r++) s[sirali[r]] = n > 1 ? r / (n - 1) : 0;
  return s;
}

/* Tuvalleri ekran ölçüsüne göre kurar. Hem seans akışı hem ilk açılış
   tanıtımı buradan geçiyor. */
function akisTuval() {
  const cv = el("akis"); if (!cv) return null;
  const W = Math.max(1, innerWidth), H = Math.max(1, innerHeight);
  AK.dpr = Math.min(1.75, window.devicePixelRatio || 1);
  /* Ekranın gerçek en-boy oranını (aspect ratio) koru.
     360 birimlik referans temel üzerinden oranlanır; katlanabilir ekranda (Google Fold)
     veya yatay modda asla basıklık yapmaz ve 1:1 kareye zorlanmaz. */
  const baz = 360;
  if (W <= H) {
    AK.w = baz;
    AK.h = Math.round(baz * (H / W));
  } else {
    AK.h = baz;
    AK.w = Math.round(baz * (W / H));
  }
  AK.pw = Math.round(AK.w * AK.dpr);
  AK.ph = Math.round(AK.h * AK.dpr);
  cv.width = AK.pw; cv.height = AK.ph;
  AK.ctx = cv.getContext("2d");
  AK.off = document.createElement("canvas");
  AK.off.width = AK.pw; AK.off.height = AK.ph;
  AK.offCtx = AK.off.getContext("2d");
  AK.offCtx.setTransform(AK.dpr, 0, 0, AK.dpr, 0, 0);
  return cv;
}

function akisBaslat(se) {
  const cv = akisTuval(); if (!cv) return;
  AK.sid = se.id; AK.hazir = false; AK.ciz = 0; AK.lastMin = -1; AK.serit = [];
  AK.ek = []; AK.ekKapali = false;
  const id = AK.sid;
  /* hesap ağır; önce arayüz boyansın diye bir tık sonraya bırakılıyor */
  setTimeout(() => {
    if (AK.sid !== id) return;
    /* duvar saati değil, tek yönlü sayaç: simülatör hızlandırsa bile doğru ölçer */
    const t0 = performance.now();
    AK.tohum = hash32(id);
    AK.alanYon = AKSEC;
    AK.serit = akisAlan(AK.tohum, AK.w, AK.h, (AKMOD[AKSEC] || AKMOD.sade).alan);
    AK.sira = akisSira(AK.serit, AK.w, AK.tohum);
    /* çok yavaş cihazda desenden vazgeç — uygulamanın geri kalanı aynen çalışır */
    if (performance.now() - t0 > 1400) { AK.kapali = true; AK.serit = []; AK.sira = null; el("akis").classList.remove("on"); return; }
    AK.hazir = true; akisIsle();
  }, 60);
}

/* [bas, son) aralığındaki şeritleri K.g bağlamına ekler.
   K = { g, serit, sira, mod }; molaMi(i) o şeridin mola dakikasına düşüp
   düşmediğini söyler. Hem canlı akış hem kayıt resmi buradan geçiyor. */
function akisCiz(K, bas, son, molaMi) {
  const g = K.g; if (!g) return;
  const M = AKMOD[K.mod] || AKMOD.sade;
  const acc = css("--sanat"), cool = css("--cool");
  const accH = hexHsl(acc), coolH = hexHsl(cool);
  const koyu = document.documentElement.classList.contains("dark");
  const SM = M.silikMola;                 /* molada zıt renk yerine silikleşme */
  const n = K.n || 0;                     /* kaçıncı kademe */
  const incelme = K.incelme || 1;         /* ince kademe = ince şerit */
  const alfaKat = K.alfaKat || 1;         /* mürekkep korunumu */
  const yikamaKat = M.kademe ? 1 + M.kademe.yikamaB * n : 1;
  g.lineCap = "round"; g.lineJoin = "round";
  for (let i = bas; i < son; i++) {
    const mola = molaMi(i);
    /* DİFÜZYON — molada bırakılan mürekkep kendi kendine yayılır (RÜZGAR).
       0 taze · 1 kenarlar yumuşar · 2 solar (sabi) · 3 uçtu, yalnız iz kaldı. */
    const as = K.asinmaSor ? K.asinmaSor(i) : 0;
    /* Difüzyon YAYAR ama GÜÇLENDİRMEZ. Şeridin KENDİSİ kalınlaşmıyor: ebru
       zaten sık (dsep 1.7), kalınlaşan şeritler komşularıyla birleşip dolu bir
       kütleye dönüyor ve mola veren seans mola vermeyenden KOYU görünüyordu.
       Yayılmayı taşıyan katman `yıkama`: aynı yol, çok geniş, çok soluk. */
    const asA = as === 0 ? 1 : as === 1 ? .52 : as === 2 ? .28 : .075;
    const asW = 1;
    const asY = as === 0 ? 1 : as === 1 ? 1.7 : as === 2 ? 2.5 : 3.4;

    /* şeridin ağırlığı → hangi katman, hangi ton */
    const q = K.sira ? K.sira[i] : .5;
    let pay = 0, kat = M.katman[0];
    for (const k of M.katman) { pay += k[0]; kat = k; if (q < pay) break; }
    const a = (koyu ? kat[2] : kat[3]) * (mola ? (SM ? SM.alfa : .8) : 1) * alfaKat * asA;

    const p = K.serit[i];

    /* yıkama: aynı yol, geniş ve çok soluk. Ebrudaki gölleşmeyi bu veriyor.
       Molada yıkama yok — mola zaten "mürekkebin zayıfladığı" an. */
    if ((kat[4] || as) && !(SM && mola)) {
      g.beginPath(); g.moveTo(p[0], p[1]);
      for (let k = 2; k < p.length; k += 2) g.lineTo(p[k], p[k + 1]);
      g.strokeStyle = (!SM && mola) ? cool : acc;
      g.lineWidth = Math.max(kat[4], as ? kat[1] * 2.2 : 0) * incelme * yikamaKat * asY;
      g.globalAlpha = a * (as ? .22 : .13);
      g.stroke();
    }
    g.strokeStyle = akisRenk((!SM && mola) ? coolH : accH, (!SM && mola) ? cool : acc,
                             q, M, n, mola || as >= 2, koyu);
    g.globalAlpha = a;
    const kal = kat[1] * incelme * (mola ? .85 : 1) * asW;
    if (M.firca) fircaCiz(g, p, kal, (K.tohum || 0) + i * 7, M.firca);
    else {
      g.lineWidth = kal;
      g.beginPath(); g.moveTo(p[0], p[1]);
      for (let k = 2; k < p.length; k += 2) g.lineTo(p[k], p[k + 1]);
      g.stroke();
    }
  }
  g.globalAlpha = 1;
}

/* Kademe n'in zaman aralığı: [dolum·kat^(n-1), dolum·kat^n).
   n=0 için [0, dolum). */
function kademeAralik(M, n) {
  const KD = M.kademe;
  if (!KD || n === 0) return [0, M.dolum];
  return [M.dolum * Math.pow(KD.kat, n - 1), M.dolum * Math.pow(KD.kat, n)];
}

function akisIsle() {
  const se = activeSession();
  if (!se || !AK.hazir || AK.sid !== se.id) return;
  const top = AK.serit.length; if (!top) return;
  const M = AKMOD[AKSEC] || AKMOD.sade;
  const KD = M.kademe;
  const dk = (stats(se).end - se.startedAt) / 60000;
  const segs = segments(se);
  /* i. şerit hangi gerçek dakikaya düşüyor → o an molada mıydı */
  const molaSor = (adet, bas, bitis) => i => {
    const ts = se.startedAt + (bas + (i / adet) * (bitis - bas)) * 60000;
    for (const sg of segs) if (ts >= sg.from && ts < sg.to) return sg.type === "break";
    return false;
  };
  /* ...ve o şeritten SONRA ne kadar uzun bir mola verildi (difüzyon kademesi) */
  const MK = molaKademeleri(se);
  const asinmaSor = (adet, bas, bitis) => i => {
    if (!MK.length) return 0;
    const ts = se.startedAt + (bas + (i / adet) * (bitis - bas)) * 60000;
    let en = 0;
    for (const m of MK) if (m.from >= ts && m.kademe > en) en = m.kademe;
    return en;
  };

  /* --- kademe 0: eski davranışın birebir aynısı --- */
  const hedef = Math.floor(top * Math.min(1, dk / M.dolum));
  if (hedef > AK.ciz) {
    akisCiz({ g: AK.offCtx, serit: AK.serit, sira: AK.sira, mod: AKSEC,
              tohum: AK.tohum, n: 0, incelme: 1, alfaKat: 1,
              asinmaSor: asinmaSor(top, 0, M.dolum) },
            AK.ciz, hedef, molaSor(top, 0, M.dolum));
    AK.ciz = hedef;
  }

  /* --- kademe 1..n: aynı tohum, daha sık şerit ---
     Sadece o kademeye girildiğinde hesaplanır. Hesap bütçeyi aşarsa
     sıklaşma orada durur; uygulamanın geri kalanı etkilenmez. */
  if (KD && !AK.ekKapali && dk > M.dolum) {
    for (let n = 1; n < KD.say; n++) {
      const [bas, bitis] = kademeAralik(M, n);
      if (dk <= bas) break;
      let K = AK.ek[n - 1];
      if (!K) {
        const t0 = performance.now();
        const eskiler = AK.serit.concat(...AK.ek.filter(Boolean).map(x => x.serit));
        const serit = akisAlan(AK.tohum, AK.w, AK.h, M.alan,
                               M.alan.dsep / Math.pow(KD.bol, n),
                               Math.round(M.alan.dene * Math.pow(KD.bol, n * KD.deneUs)),
                               eskiler, n * 977);
        if (performance.now() - t0 > KD.butce || !serit.length) { AK.ekKapali = true; break; }
        const incelme = Math.pow(KD.incelme, n);
        K = { serit, sira: akisSira(serit, AK.w, AK.tohum + n * 13), ciz: 0,
              incelme, n,
              /* mürekkep korunumu: her ince kademe, ilk kademenin mürekkebinin
                 `katki` katı kadar ekler. Şerit sayısı katlansa da resim
                 koyulaşmıyor — İNCELİYOR. */
              alfaKat: Math.min(1, KD.katki * top / Math.max(1, serit.length * incelme)) };
        AK.ek[n - 1] = K;
      }
      const h = Math.floor(K.serit.length * Math.min(1, (dk - bas) / (bitis - bas)));
      if (h > K.ciz) {
        akisCiz({ g: AK.offCtx, serit: K.serit, sira: K.sira, mod: AKSEC,
                  tohum: AK.tohum + n * 3301, n, incelme: K.incelme, alfaKat: K.alfaKat,
                  asinmaSor: asinmaSor(K.serit.length, bas, bitis) },
                K.ciz, h, molaSor(K.serit.length, bas, bitis));
        K.ciz = h;
      }
      if (dk <= bitis) break;
    }
  }
  akisBirlestir();
}

/* alanı ekrana bas, sonra kadranın çevresini ve alt şeridi aç */
function akisBirlestir() {
  const g = AK.ctx; if (!g) return;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, AK.pw, AK.ph);
  g.drawImage(AK.off, 0, 0);
  g.globalCompositeOperation = "destination-out";
  const kx = AK.pw / Math.max(1, innerWidth);
  const ky = AK.ph / Math.max(1, innerHeight);
  const M = AKMOD[AKSEC] || AKMOD.sade;

  const r = el("dial").getBoundingClientRect();
  if (r.width > 4) {
    const cx = (r.left + r.width / 2) * kx, cy = (r.top + r.height / 2) * ky;
    const radX = (r.width / 2) * kx, radY = (r.height / 2) * ky;
    const rad = Math.max(radX, radY);
    const ic = Math.max(1, rad * M.halo[0]), dis = Math.max(ic + 2, rad * M.halo[1]);
    const gr = g.createRadialGradient(cx, cy, ic, cx, cy, dis);
    gr.addColorStop(0, "rgba(0,0,0,0.85)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(cx - dis, cy - dis, dis * 2, dis * 2);
  }
  const isLandscape = innerWidth > innerHeight;
  const altOran = isLandscape ? Math.min(M.alt, 0.22) : M.alt;
  const alt = AK.ph * altOran;
  const gl = g.createLinearGradient(0, AK.ph - alt, 0, AK.ph);
  gl.addColorStop(0, "rgba(0,0,0,0)"); gl.addColorStop(1, "rgba(0,0,0,1)");
  g.fillStyle = gl; g.fillRect(0, AK.ph - alt, AK.pw, alt);

  g.globalCompositeOperation = "source-over";
}

/* tema değişti: renkler alana işlenmiş, baştan çizmek gerekiyor */
function akisYeniden() {
  if (AK.tanit) return;
  const _se = activeSession();
  if (kumMu(_se) && KUM.hazir && AK.sid === _se.id) { kumYeniden(); return; }
  if (!AK.hazir || !AK.offCtx) return;
  AK.offCtx.setTransform(1, 0, 0, 1, 0, 0);
  AK.offCtx.clearRect(0, 0, AK.pw, AK.ph);
  AK.offCtx.setTransform(AK.dpr, 0, 0, AK.dpr, 0, 0);
  AK.ciz = 0;
  for (const K of AK.ek) if (K) K.ciz = 0;      /* kademeler de baştan boyansın */
  akisIsle();
}

/* Simülatörün yön düğmeleri buraya bağlı. belirgin↔ebru aynı alanı kullanıyor,
   geçiş anlık; sade'nin geometrisi farklı olduğu için o yön alanı yeniden
   hesaplatıyor (karşılaştırma dürüst olsun diye eski hâli birebir duruyor). */
function akisYon(ad) {
  if (!AKMOD[ad] || ad === AKSEC) return;
  const eski = (AKMOD[AKSEC] || AKMOD.sade).alan;
  AKSEC = ad; AK.lastMin = -1;
  if (JSON.stringify(eski) !== JSON.stringify(AKMOD[ad].alan)) {
    AK.sid = null; AK.hazir = false; akisTazele();
  } else akisYeniden();
}

/* ============================================================
   KUM HAVUZU — POMODORO'NUN SANATI (karesansui)

   `27-sanat-ayrisimi.md`: "pomodoro katı, kronometre sıvı." Kronometre akar
   (ebru); pomodoro biriktirir. Bu yüzden kum havuzunun birimi SEANS DEĞİL
   GÜN'dür: bahçe sabah boş açılır, her tamamlanan pomodoro bir taş bırakır,
   gün batımında (yeni gün anahtarı) düzlenir.

   Üç itiraz vardı (`tasarim/Kum Bahçesine Karşı Yorumum.md`), üçü de burada
   karşılanıyor:

   1. "Ekran sınırlı, bir yerden sonra güncelleme gelmez."
      → KADEMELİ SIKLAŞMA. Tırmık cephesi ekranı bir kez taradıktan sonra
        bahçıvan aynı bahçeyi tekrar geçiyor: yeni çizgiler eskilerin TAM
        ORTASINA, daha ince ve daha yavaş düşüyor (3 kademe ≈ 26 saat).
        Aynı alan, aynı tohum → kesişme yok, moiré yok.

   2. "Başlamadan ne göreceğimi biliyorum."
      → BAHÇE BİÇİMİ günün tohumundan geliyor: tırmık kimi gün üstten, kimi
        gün yandan, kimi gün çapraz geliyor — ve sekizde bir gün hiç cephe
        yok, bahçe yalnız taşların halkalarından doğuyor ("ada"). Taşların
        yeri, sayısı ve iriliği de günün gerçek pomodorolarından çıkıyor.

   3. "Tek renk, wow yok."
      → Çizgi rengi taşa olan uzaklıkla kayıyor: taşın dibinde sıcak (accent),
        açık kumda serin (cool). Taş düşerken kum sıçrıyor, krater kalıyor,
        ses ve titreşim çarpma anında geliyor.

   Molada tırmık geçmiyor: kum düz kalıyor. Boş bant bir eksiklik değil,
   günün dürüst kaydı.
   ============================================================ */

/* ============================================================
   RÜZGAR — MOLADA BOZULMA

   `27-sanat-ayrisimi.md` bölüm 3 ve 7. Eşikler nörobilimden, keyfi değil:

     10 dk : Genel konsensüs "5–10 dk optimal; 10+ dk'da bağlamsal bellek
             çözülüyor". İlk esinti. Çizgiler kayar, keskin kenar yumuşar.
     20 dk : Ultradian döngünün toparlanma penceresi (Lavie ~20 dk) kapanır;
             DeskTime'ın üretken molası da 17 dk. Bunun ötesi artık "mola"
             değil. İkinci ve güçlü esinti.
     30 dk : Görev-kümesi araştırmasında dönüş gecikmesi bu aralıkta sertçe
             büyür — geri dönen kişi *devam etmiyor*, yeniden başlıyor.
             Tırmık izleri silinir.

   İki mod aynı takvimi kullanıyor ama malzemeleri farklı davranıyor:

   KUM   — rüzgar dışarıdan gelen bir kuvvet. Duyulur: kısa bir hışırtı ve
           titreşim eşlik eder. Tek seferlik, sonlu; sonra ekran durur
           (sürekli rüzgar = seijaku ihlali). **Fudōshin koruması:** o gün
           3 pomodoro tamamlanmışsa silinme olmaz — biriken bahçe artık
           bir günün kaydıdır, bir molanın keyfine bırakılmaz. Taşlar ve
   EBRU  — rüzgar değil, malzemenin kendi fiziği: pasif difüzyon. **Sessiz**
           (belge bölüm 3: "difüzyona ses eklemek malzemeyi yalanlar").
           30 dk'da şeritler uçar ama kâğıt boş kalmaz: çok soluk bir iz
           kalır. Kullanıcı döndüğünde yeni akış boş kâğıda değil, SİLİNMİŞ
           bir kâğıda düşer.
   ============================================================ */
const RUZGAR = { esinti: 10, firtina: 20, silme: 30, koruma: 3 };

/* Pomodoro süresine oranlı hak edilen mola (standart 1/5 kuralı: 25 dk -> 5 dk, 50 dk -> 10 dk) */
function hakEdilenMolaDk(se) {
  if (!se) return 5;
  const dk = (se.target > 0) ? se.target : (stats(se).net / 60000);
  return Math.max(3, Math.round(Math.max(5, dk) / 5));
}

/* FUDŌSHIN (Sarsılmaz Zihin) KORUMASI:
   O gün yeterli odaklanma olgunluğuna ulaşıldığında (en az 3 küçük pomodoro veya
   en az 2 büyük 45+ dk pomodoro veya toplam >= 75 dk tamamlanmış net odak):
   Bahçe artık günün kalıcı kaydıdır; rüzgar fırtınası çıkmaz ve uzun molalar taşı kıramaz. */
function fudoshinKoruma(gun, ref) {
  if (!gun) gun = todayKey();
  const seanslar = (typeof kumSeanslar === "function") ? kumSeanslar(gun, ref) :
    (S.sessions || []).filter(s => s.dayKey === gun && s.mode === "pomodoro" && (!ref || s.startedAt <= ref));
  let tamamlananSayisi = 0;
  let buyukTamamlanan = 0;
  let toplamNetDk = 0;
  for (const se of seanslar) {
    if (!se.endedAt || se.kirik) continue;
    const netDk = stats(se, ref).net / 60000;
    const target = se.target || 0;
    if (target > 0 && netDk >= (target - 0.25)) {
      tamamlananSayisi++;
      toplamNetDk += netDk;
      if (target >= 45) buyukTamamlanan++;
    }
  }
  return tamamlananSayisi >= 3 || buyukTamamlanan >= 2 || toplamNetDk >= 75;
}

/* Seansın kendi içindeki molalarını kademeye çevirir. Sürmekte olan mola da sayılır:
   kademe kullanıcı ekrana bakmadan, molanın kendi uzunluğundan doğar. */
function molaKademeleri(se, ref) {
  if (!se) return [];
  const out = [];
  for (const sg of segments(se, ref)) {
    if (sg.type !== "break") continue;
    const dk = (sg.to - sg.from) / 60000;
    const k = dk >= RUZGAR.silme ? 3 : dk >= RUZGAR.firtina ? 2 : dk >= RUZGAR.esinti ? 1 : 0;
    if (k) out.push({ from: sg.from, to: sg.to, dk, kademe: k });
  }
  return out;
}

/* Taşı kıran şey NEDİR? Fudōshin koruması yoksa seans içi tek bir molanın
   RUZGAR.silme (30 dk) eşiğini geçmesi. Malzeme hiyerarşisi: 10 dk kumu tarar,
   20 dk dağıtır, 30 dk TAŞI kırar.
   Fudōshin koruması devredeyse (günde 3 pomodoro / 2 büyük 50 dk pomodoro) taş kırılmaz. */
function molaKirar(se, ref) {
  if (!se) return false;
  const gun = se.dayKey || (se.startedAt ? dayKey(se.startedAt) : todayKey());
  if (fudoshinKoruma(gun, ref)) return false;
  for (const m of molaKademeleri(se, ref)) {
    if (m.kademe >= 3) return true;
  }
  return false;
}

/* Bir seansın taşı kırık mı? SÜREN seans asla kırık değildir (içinde 30+ dk mola yoksa).
   Bitmiş seansta ölçüt vaadin tutulup tutulmadığı; sürende yalnız seans içi uzun mola. */
function tasKirikMi(se, ref) {
  if (!se || se.mode !== "pomodoro" || !(se.target > 0)) return false;
  if (molaKirar(se, ref)) return true;
  if (!se.endedAt) return false;
  return (stats(se, ref).net / 60000) < (se.target - 0.25) || !!se.kirik;
}

/* Bir seansın (ya da günün) ulaştığı en yüksek rüzgar kademesi — canlı
   ekranın "bir şey değişti mi" damgası. */
function ruzgarDamga(se, ref) {
  const olaylar = (se && se.mode === "pomodoro") || (!se && S.settings.mode === "pomodoro")
    ? kumOlaylar((se && se.dayKey) || todayKey(), ref)
    : (se ? molaKademeleri(se, ref) : []);
  let en = 0, s = 0;
  for (const o of olaylar) {
    const k = o.kademe || 0;
    if (k > en) en = k;
    s += k;
  }
  return en + "/" + s;
}

/* Kum Bahçesi Rüzgarı: Kuru kum taneciklerinin sessiz nefesi / hafif kum yerleşme hışırtısı.
   Sentetik YouTube 'whoosh' / frekans süpürmesi YOKTUR. 180-220 Hz altı sıcak mineral hava dokusu (24-sanat-dili.md §6.5). */
function sesCalRuzgar(guc) {
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const sr = ctx.sampleRate || 48000;
    const dur = guc > 1 ? 0.42 : 0.32;
    const n = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    const raw = new Float32Array(n);
    let b0 = 0, b1 = 0;
    const tepe = dur * 0.38;

    for (let i = 0; i < n; i++) {
      const t = i / sr, w = Math.random() * 2.0 - 1.0;
      b0 = 0.94 * b0 + 0.06 * w;
      b1 = 0.86 * b1 + 0.14 * w;
      const grain = (b0 * 0.7 + b1 * 0.3);
      const airWave = Math.sin(2.0 * Math.PI * 50.0 * t) * 0.15;
      const env = t < tepe ? Math.sin((t / tepe) * (Math.PI / 2.0)) : Math.exp(-(t - tepe) / (dur * 0.28));
      raw[i] = (grain + airWave) * env * (guc > 1 ? 0.55 : 0.40);
    }

    const cutoff = guc > 1 ? 220.0 : 180.0;
    const filtered = applyIIRLowpass(raw, sr, cutoff);
    for (let i = 0; i < n; i++) {
      d[i] = Math.tanh(filtered[i] * 1.8);
    }
    applyAudioWindow(d, sr);
    sesCalTampon(ctx, buf, dur);
  } catch (e) {}
}

/* Rüzgarın kendisi: ekranı bir kez yalayıp geçen kum şeritleri. Sonra DURUR. */
function kumRuzgarAnim(guc) {
  if (!AK.ctx || !KUM.hazir) return;
  cancelAnimationFrame(KUM.ruzgarAnim);
  const SURE = guc > 1 ? 900 : 680;
  const R = rng32(((Math.random() * 1e9) | 0) >>> 0);
  const toz = [];
  for (let i = 0, n = guc > 1 ? 110 : 70; i < n; i++) {
    toz.push({ x: -R() * 160, y: R() * KUM.H,
               v: (3.2 + R() * 6.5) * (guc > 1 ? 1.3 : 1),
               vy: (R() - .48) * 1.6,
               u: 3 + R() * 14, k: .5 + R() * 1.2, a: .18 + R() * .40 });
  }
  const t0 = performance.now();
  const kare = () => {
    const dt = performance.now() - t0, p = Math.min(1, dt / SURE);
    const sonme = p < .30 ? p / .30 : Math.pow(1 - (p - .30) / .70, 1.4);
    kumBirlestir(g => {
      g.save();
      g.strokeStyle = css("--muted");
      g.lineCap = "round";
      for (const t of toz) {
        t.x += t.v; t.y += t.vy;
        if (t.x - t.u > KUM.W) continue;
        g.globalAlpha = t.a * sonme * .55;
        g.lineWidth = t.k;
        g.beginPath(); g.moveTo(t.x - t.u, t.y); g.lineTo(t.x, t.y); g.stroke();
      }
      g.restore();
    });
    if (p < 1) KUM.ruzgarAnim = requestAnimationFrame(kare);
    else kumIsle();
  };
  KUM.ruzgarAnim = requestAnimationFrame(kare);
}


const KUMMOD = {
  /* Aralık sabit değil: bahçenin kendi büyüklüğünden çıkıyor. Kademe 0 her
     zaman `bant` kadar geniş bant demek — tek taşlı bahçede de, altı taşlı
     bahçede de ilk geçiş aynı ferahlıkta. Aralığı daraltmak deseni
     zenginleştirmiyor, kalabalıklaştırıyor: `ma` burada malzemenin kendisi. */
  bant: 6.2,      /* kademe 0'da kaç tırmık bandı */
  araMin: 30, araMax: 58,
  dkl: 5,         /* kademe 0'da bir çizgi kaç çalışılmış dakika */
  kademe: 4,      /* kaç kez sıklaşma (16'da bir aralığa kadar) */
  kat: 2.9,       /* her kademede bir çizginin bedeli kaç kat artar */
  alt: .11,       /* alt şeridin silinme payı — akış ile aynı */
  halo: [.12, .42]
};

const KUM = {
  gun: null, hazir: false, kapali: false,
  W: 0, H: 0, ST: 3.2, gw: 0, gh: 0, G: null,
  tohum: 0, bicim: null, ara: 13, maxF: 1,
  taslar: [], plan: [], kont: null,
  imza: "", dusen: null, dusAnim: 0, kraterler: [], tanit: false,
  ruzgarAnim: 0, ruzgarDamga: ""
};

/* --- günün pomodoro seansları, başlangıç sırasıyla --- */
function kumSeanslar(gun, sonTs) {
  return S.sessions
    .filter(s => s.dayKey === gun && s.mode === "pomodoro" && (!sonTs || s.startedAt <= sonTs))
    .sort((a, b) => a.startedAt - b.startedAt);
}

/* --- TAŞLAR ---------------------------------------------------------------
   Taş süsleme değil KAYIT: günün kaçıncı pomodorosuysa o kadar taş var,
   iriliği hedef süresinden geliyor (15 dk çakıl, 25 dk taş, 50 dk kaya).
   Yerleşim "en iyi aday" (Mitchell) yöntemiyle: her taş kendinden öncekilere
   en uzak noktayı seçiyor. Sıra bozulmadığı için gün içinde yeni taş eklenince
   ESKİ TAŞLAR YERİNDEN OYNAMIYOR. */
function kumTasUret(gun, dkList) {
  const W = KUM.W, H = KUM.H, n = dkList.length, out = [];
  if (!n) return out;
  const R = rng32(hash32("kum|" + gun));
  const olcek = n <= 5 ? 1 : Math.pow(5 / n, .26);
  for (let i = 0; i < n; i++) {
    const item = dkList[i];
    const dk = Math.max(5, (item && typeof item === "object") ? item.dk : item);
    const kirik = !!(item && typeof item === "object" && item.kirik);
    const altin = !!(item && typeof item === "object" && item.altin);
    const tozlu = !!(item && typeof item === "object" && item.tozlu);
    const r = Math.max(W * .022, W * (.030 + Math.sqrt(dk / 60) * .038) * olcek);
    let bx = W * .5, by = H * .4, iyi = -1e9;
    /* İlk "yeterince iyi" yeri kabul ediyor, en iyisini aramıyor: en iyiyi
       arayan yerleşim her gün aynı paketlemeye yakınsıyordu — kullanıcının
       "başlamadan ne göreceğimi biliyorum" itirazının asıl kaynağı buydu. */
    for (let d = 0; d < 44; d++) {
      /* Bahçenin kumu ekranın tamamı, ama TAŞIN oturabileceği yer değil:
         kadran ve alt düğme şeridi arayüzün. Geriye üst üçte iki ve yan
         şeritler kalıyor — asimetrik, karesansui'nin sevdiği yerleşim. */
      const x = W * (.11 + R() * .78), y = H * (.085 + R() * .60);
      let m = Math.min(x - r * 1.4, W - x - r * 1.4, y - r * 1.4, H * .70 - y - r * 1.4);
      m = Math.min(m, Math.hypot(x - W * .5, (y - H * .42) * .74) - r - W * .30);
      for (const t of out) m = Math.min(m, Math.hypot(t.x - x, t.y - y) - (t.r + r) - W * .10);
      if (m > iyi) { iyi = m; bx = x; by = y; }
      if (iyi > W * .055) break;
    }
    out.push({ x: bx, y: by, r, a: R() * Math.PI * 2, e: .74 + R() * .40,
               tohum: (R() * 1e6) | 0, dk, kirik, altin, tozlu, seansIdx: i });
  }
  return out;
}

/* --- BAHÇE BİÇİMİ ---------------------------------------------------------
   Tırmığın nereden geldiği günün tohumundan. "ada" gününde cephe yok:
   çizgiler yalnız taşların çevresinden halka halka doğuyor. */
function kumBicim(tohum) {
  const R = rng32(tohum + 17);
  const z = R();
  const tur = z < .12 ? "ada" : z < .36 ? "ust" : z < .58 ? "alt"
            : z < .74 ? "sol" : z < .88 ? "sag" : "capraz";
  return { tur, eg: (R() - .5) * .52, aci: R() * Math.PI * 2,
           gurultu: .70 + R() * .55, araKat: .88 + R() * .30 };
}

function kumCepheMesafe(x, y, W, H, B) {
  switch (B.tur) {
    case "ada": return 1e7;
    case "ust": return (y - H * .045) + B.eg * (x - W * .5);
    case "alt": return (H * .955 - y) + B.eg * (x - W * .5);
    case "sol": return (x - W * .055) + B.eg * (y - H * .5) * .6;
    case "sag": return (W * .945 - x) + B.eg * (y - H * .5) * .6;
    default: {
      const c = Math.cos(B.aci), s = Math.sin(B.aci);
      return ((x - W * .5) * c + (y - H * .5) * s) + Math.max(W, H) * .58;
    }
  }
}

/* --- ALAN ---------------------------------------------------------------
   Kuru bahçenin bütün görüntüsü tek satırda: cepheye ve taşlara olan
   uzaklıkların YUMUŞAK ENKÜÇÜĞÜ. Açık kumda koşut çizgiler, taşın çevresinde
   halkalar, ikisinin arasında yumuşak bir geçiş. */
function kumSmin(a, b, k) {
  const h = Math.max(0, Math.min(1, .5 + .5 * (b - a) / k));
  return b * (1 - h) + a * h - k * h * (1 - h);
}

function kumAlanKur() {
  const W = KUM.W, H = KUM.H, S = KUM.tohum, B = KUM.bicim;
  const ARA = KUM.ara, YUM = ARA * 1.25;
  const ST = KUM.ST;
  const gw = Math.ceil(W / ST) + 1, gh = Math.ceil(H / ST) + 1;
  const G = new Float32Array(gw * gh);
  const taslar = KUM.taslar;
  const sFrontList = (B.tur !== "ada") ? taslar.map(t => kumCepheMesafe(t.x, t.y, W, H, B)) : null;
  let mx = 1;
  for (let j = 0; j < gh; j++) {
    const y = j * ST;
    for (let i = 0; i < gw; i++) {
      const x = i * ST;
      let f = kumCepheMesafe(x, y, W, H, B)
            + (fbm(x / (W * .80), y / (W * 1.6), S + 3) - .5) * ARA * B.gurultu;
      for (let ti = 0; ti < taslar.length; ti++) {
        const t = taslar[ti];
        const dx = (x - t.x) * Math.cos(t.a) + (y - t.y) * Math.sin(t.a);
        const dy = (-(x - t.x) * Math.sin(t.a) + (y - t.y) * Math.cos(t.a)) / t.e;
        const dStone = Math.hypot(dx, dy) - t.r;
        if (B.tur === "ada") {
          f = kumSmin(f, dStone, YUM);
        } else {
          const sFront = sFrontList[ti];
          const fStone = sFront + dStone;
          f = kumSmin(f, fStone, YUM);
        }
      }
      G[j * gw + i] = f;
      if (f > mx) mx = f;
    }
  }
  KUM.G = G; KUM.gw = gw; KUM.gh = gh; KUM.maxF = mx;
  KUM.kont = new Map();
}

/* --- ÇİZGİ PLANI ---------------------------------------------------------
   Tırmık hatları: 0, ARA, 2·ARA … maxF.
   Bahçenin tüm derinliğini kapsayan homojen Karesansui tırmık olukları. */
function kumPlanKur() {
  const ARA = KUM.ara, plan = [];
  if (ARA <= 0) return;
  for (let c = 0; c <= KUM.maxF + ARA * 0.5; c += ARA) {
    plan.push({ c, k: 0 });
  }
  KUM.plan = plan;
}

/* --- GÜNÜN ZAMAN ŞERİDİ --------------------------------------------------
   Pomodoro seanslarının çalışma süreleri ve seanslar arası mola aralıkları.
   Her pomodoro kendi süresine göre bir mola hakkı doğurur (hedef / 5).
   Hak edilen mola aşıldıkça rüzgar kademesi yükselir:
     Aşım <= 0 dk  : Kademe 0 (Sakin kum, tırmık izleri korunur)
     Aşım < 10 dk  : Kademe 1 (Esinti, tırmık izleri yumuşar)
     Aşım < 20 dk  : Kademe 2 (Fırtına, izler dağılır)
     Aşım >= 20 dk : Kademe 3 (Silme, tırmık izleri tamamen silinir, sadece taş kalır) */
function kumOlaylar(gun, sonTs) {
  const seanslar = kumSeanslar(gun, sonTs);
  const out = [];
  const korundu = fudoshinKoruma(gun, sonTs);
  for (let i = 0; i < seanslar.length; i++) {
    const se = seanslar[i];
    const bas = se.startedAt;
    const bit = se.endedAt || sonTs || now();
    const sonSinir = sonTs ? Math.min(bit, sonTs) : bit;
    const calisilanDk = Math.max(0, (sonSinir - bas) / 60000);
    const target = se.target || 25;
    if (calisilanDk > 0 || se.endedAt) {
      out.push({
        sure: calisilanDk,
        target,
        mola: false,
        kademe: 0,
        seansIdx: i,
        ended: !!se.endedAt,
        kirik: tasKirikMi(se, sonTs)
      });
    }
    if (se.endedAt) {
      const molaBas = se.endedAt;
      const sonrakiBas = (i + 1 < seanslar.length) ? seanslar[i + 1].startedAt : (sonTs || now());
      const molaBit = sonTs ? Math.min(sonrakiBas, sonTs) : sonrakiBas;
      if (molaBit > molaBas) {
        const molaDk = (molaBit - molaBas) / 60000;
        const hakDk = hakEdilenMolaDk(se);
        const asimDk = molaDk - hakDk;
        const k = korundu ? 0 : (asimDk <= 0 ? 0 : asimDk < 10 ? 1 : asimDk < 20 ? 2 : 3);
        out.push({ from: molaBas, to: molaBit, sure: molaDk, mola: true, kademe: k, hakDk, seansIdx: i });
      }
    }
  }
  return out;
}

/* --- BİRİKİMLİ TIRMIK ----------------------------------------------------
   Bir pomodoro = bahçenin BİR TAM GEÇİŞİ: hedef süresi dolduğunda tırmık
   baştan sona gitmiş olur. 25 dk da 50 dk da aynı sayıda çizgi bırakır;
   sürenin karşılığı çizgi değil TAŞIN İRİLİĞİ (bkz. kumTasUret) — bir saatlik
   emek daha çok çizik değil daha ağır bir taş demek.

   Günün ikinci pomodorosu bahçeyi SIFIRLAMAZ: eski çizgiler yerinde kalır,
   yeni tırmık onların ARASINA girer. Faz van der Corput dizisinden geliyor —
   her yeni geçiş, o ana kadarki en geniş boşluğu tam ortasından böler:
     1. geçiş  ─────────────────   (0, ARA, 2·ARA …)
     2. geçiş  ──┼──┼──┼──┼──     (yarım aralık kaymış)
     3. geçiş  ─┼┼─┼┼─┼┼─         (çeyrek)  …
   Derinlik arttıkça çizgi inceliyor ve soluyor: en eski geçiş bahçenin
   iri oluğu, sonrakiler onun üstüne işlenen ince doku. Böylece ekrana
   bakınca "bugün kaçıncı pomodoro" GÖRÜLÜYOR.

   Rüzgar (uzayan mola) hâlâ yıkıcı: bir geçişten SONRA esen en güçlü rüzgar
   o geçişi aşındırır, 3. kademe rüzgar tamamen siler. Birikim korunmuş değil
   HAK EDİLMİŞ bir şey. */

/* van der Corput (taban 2): 0, 1/2, 1/4, 3/4, 1/8, 5/8, 3/8, 7/8 … */
function kumFaz(i) {
  let f = 0, b = .5;
  for (let n = i | 0; n > 0; n >>= 1, b *= .5) if (n & 1) f += b;
  return f;
}
/* i. geçişin sıklaşma derinliği: 0 · 1 · 2,2 · 3,3,3,3 · 4… (KUMMOD.kademe'de durur) */
function kumDerinlik(i) {
  let d = 0;
  for (let n = i | 0; n > 0; n >>= 1) d++;
  return Math.min(KUMMOD.kademe, d);
}

function kumCizgiler(olaylar) {
  const plan = KUM.plan;
  KUM.tazeOran = 0;               /* şu anki geçiş bahçenin ne kadarını taradı */
  if (!plan || !plan.length || !olaylar || !olaylar.length) return [];

  const N = plan.length;
  const ARA = KUM.ara || 1;

  /* bir çizgi, kendisinden SONRA esen en güçlü rüzgar kadar aşınır */
  const suf = new Int8Array(olaylar.length + 1);
  for (let j = olaylar.length - 1; j >= 0; j--)
    suf[j] = Math.max(suf[j + 1], olaylar[j].mola ? (olaylar[j].kademe || 0) : 0);

  /* son çalışma olayı = şu an tırmığı çeken geçiş */
  let sonCalIdx = -1;
  for (let j = olaylar.length - 1; j >= 0; j--) if (!olaylar[j].mola) { sonCalIdx = j; break; }
  if (sonCalIdx < 0) return [];

  const cikti = [];
  for (let j = 0; j < olaylar.length; j++) {
    const o = olaylar[j];
    if (o.mola) continue;

    const gecis = (o.seansIdx != null) ? o.seansIdx : 0;   /* günün kaçıncı pomodorosu */
    const target = Math.max(5, o.target || 25);
    const oran = Math.min(1, Math.max(0, (o.sure || 0) / target));
    const adet = Math.min(N, Math.round(oran * N));
    if (adet <= 0) continue;

    const ofs = kumFaz(gecis) * ARA;      /* geçişin faz kayması */
    const k = kumDerinlik(gecis);         /* çizgi inceliği */
    const asinma = suf[j + 1] || 0;       /* bu geçişten sonraki en güçlü rüzgar */
    const taze = (j === sonCalIdx);

    if (taze) {
      KUM.tazeOran = adet / N;    /* krater ve kırılma bu orana göre sönüyor */
      for (let p = 0; p < adet; p++) {
        cikti.push({
          c: plan[p].c + ofs,
          k,
          bos: false,
          seansIdx: gecis,
          taze: true,
          hayalet: false,
          asinma
        });
      }

      /* Çoklu seans: Aktif seans henüz bahçenin tamamını taramadıysa,
         önceki taranmış seansın arkada kalan çizgileri hayalet doku olarak tamamlar */
      if (olaylar.length > 1 && adet < N) {
        const ofsH = kumFaz(0) * ARA;
        const kH = kumDerinlik(0);
        for (let p = adet; p < N; p++) {
          cikti.push({
            c: plan[p].c + ofsH,
            k: kH,
            bos: false,
            seansIdx: 0,
            taze: false,
            hayalet: true,
            asinma: 0
          });
        }
      }
    }
  }

  /* iri oluk altta, ince doku üstte kalsın */
  cikti.sort((a, b) => (a.k - b.k) || (a.c - b.c));
  return cikti;
}

/* --- YÜRÜYEN KARELER: seviye eğrisini parça parça çıkar --- */
function kumKontur(c) {
  if (KUM.kont.has(c)) return KUM.kont.get(c);
  const G = KUM.G, gw = KUM.gw, gh = KUM.gh, ST = KUM.ST, seg = [];
  const ar = (a, b) => (Math.abs(b - a) < 1e-9 ? .5 : (c - a) / (b - a));
  for (let j = 0; j < gh - 1; j++) {
    for (let i = 0; i < gw - 1; i++) {

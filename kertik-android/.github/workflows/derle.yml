name: Kertik derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testler:
    name: Sayfa testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test bağımlılıkları
        working-directory: test
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright jsdom
          npx playwright install --with-deps chromium

      # Tarayıcı gerektirmeyenler önce koşar: bir şey bozulduysa
      # 10 saniyede öğrenilir, 3 dakikada değil.
      - name: Hızlı testler (birleştirme + çizim)
        working-directory: test
        run: node hepsi.js --hizli

      # Duman testi dahil geri kalan her şey. hepsi.js sahte Google'ı
      # kendi başlatıp kapatır; buraya yeni dosya eklemek gerekmez —
      # test/hepsi.js içindeki TESTLER listesine eklemek yeterli.
      - name: Tüm testler
        working-directory: test
        run: node hepsi.js

  derle:
    name: APK + AAB
    runs-on: ubuntu-latest
    needs: testler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # İmza anahtarı deponun içinde DEĞİL. GitHub → Settings → Secrets → Actions
      # altında KERTIK_KEYSTORE_B64 (base64'lenmiş .p12) ve KERTIK_STORE_PASSWORD
      # tanımlı olmalı. Yoksa iş imzasız derler ve uyarır.
      - name: İmza anahtarını çöz
        id: imza
        env:
          B64: ${{ secrets.KERTIK_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "var=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KERTIK_KEYSTORE_B64 tanımlı değil — imzasız derlenecek."
          else
            echo "$B64" | base64 -d > "$RUNNER_TEMP/kertik-imza.p12"
            echo "var=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derle
        env:
          KERTIK_STORE_FILE: ${{ runner.temp }}/kertik-imza.p12
          KERTIK_STORE_PASSWORD: ${{ secrets.KERTIK_STORE_PASSWORD }}
          KERTIK_KEY_ALIAS: kertik
          KERTIK_KEY_PASSWORD: ${{ secrets.KERTIK_STORE_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Çıktıları topla
        run: |
          mkdir -p cikti
          find app/build/outputs -name "*.apk" -o -name "*.aab" | xargs -r -I{} cp {} cikti/
          ls -la cikti

      - uses: actions/upload-artifact@v4
        with:
          name: kertik-${{ github.sha }}
          path: cikti/*
          if-no-files-found: error
